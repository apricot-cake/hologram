<!--
  Hand-authored X/Twitter DOM shapes for extension/utils/extractor/x.ts's mediaIdentity
  extractIdentity/isPostMedia (which post does a dragged/hovered <img> belong
  to, and is it the post's own picture). Distinct from fixtures/content/x.html
  (site-detect.ts's permalink/post-element logic) — this one needs <img>
  elements in the exact position real markup puts them (a sibling of the
  status anchor, not inside it), since extractIdentity's ancestor-container
  fallback is what's under test.
-->
<!DOCTYPE html>
<html>
<head></head>
<body>

  <!-- normal post: the image sits in a sibling div, not inside the anchor
       itself, so extractIdentity must fall back to findAncestorContainerLink
       bounded by <article> -->
  <article data-testid="tweet" id="post1">
    <a href="/alice/status/111"><time datetime="2026-01-01T00:00:00Z">1h</time></a>
    <div data-testid="tweetPhoto"><img id="imgPost1" src="https://pbs.twimg.com/media/AAA.jpg"></div>
  </article>

  <!-- avatar: outside any /status/ anchor and outside any article, so no
       container link can ever be found -->
  <img id="imgAvatar" src="https://pbs.twimg.com/profile_images/BBB.jpg">

  <!-- lightbox/photo-viewer image: anchor-less and outside <article>, so
       identity comes from the URL bar instead (only valid on a /status/ page) -->
  <img id="imgViewer" src="https://pbs.twimg.com/media/CCC.jpg">

  <!-- video / GIF posts: the poster frame is served from a *_video_thumb path
       rather than media/, which is what used to hide the save button (#372).
       Paths counted on live X, 2026-07-28. -->
  <article data-testid="tweet" id="post2">
    <a href="/bob/status/222"><time datetime="2026-01-01T00:00:00Z">2h</time></a>
    <div data-testid="videoPlayer"><img id="imgAmplify" src="https://pbs.twimg.com/amplify_video_thumb/222/img/DDD.jpg"></div>
  </article>
  <article data-testid="tweet" id="post3">
    <a href="/carol/status/333"><time datetime="2026-01-01T00:00:00Z">3h</time></a>
    <div data-testid="videoPlayer"><img id="imgExtTw" src="https://pbs.twimg.com/ext_tw_video_thumb/333/pu/img/EEE.jpg"></div>
  </article>
  <article data-testid="tweet" id="post4">
    <a href="/dave/status/444"><time datetime="2026-01-01T00:00:00Z">4h</time></a>
    <div data-testid="videoPlayer"><img id="imgGif" src="https://pbs.twimg.com/tweet_video_thumb/FFF.jpg"></div>
  </article>

  <!-- link-card preview: shares the host with post media and resolves to its
       post perfectly well, so only the path keeps it out of the save button -->
  <article data-testid="tweet" id="post5">
    <a href="/erin/status/555"><time datetime="2026-01-01T00:00:00Z">5h</time></a>
    <div data-testid="card.wrapper"><img id="imgCard" src="https://pbs.twimg.com/card_img/999/GGG.jpg"></div>
  </article>

  <!-- the same video post once its player has initialised: X replaces the
       poster <img> with a <video poster>, and never puts the <img> back, so
       this is the shape every hoverable video post actually has (#450) -->
  <article data-testid="tweet" id="post6">
    <a href="/frank/status/666"><time datetime="2026-01-01T00:00:00Z">6h</time></a>
    <div data-testid="videoPlayer"><video id="videoPlaying" poster="https://pbs.twimg.com/amplify_video_thumb/666/img/HHH.jpg"></video></div>
  </article>

  <!-- a <video> whose poster is not post media: the element type must not be
       what grants the button -->
  <article data-testid="tweet" id="post7">
    <a href="/grace/status/777"><time datetime="2026-01-01T00:00:00Z">7h</time></a>
    <div data-testid="videoPlayer"><video id="videoNotPostMedia" poster="https://pbs.twimg.com/profile_images/III.jpg"></video></div>
  </article>

</body>
</html>

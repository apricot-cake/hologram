<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Protocol-Relative Image Page</title>
    <meta property="og:title" content="A Page With a Protocol-Relative og:image" />
    <meta property="og:image" content="//cdn.example.com/thumb.png" />
  </head>
  <body>
    <p>og:image has no scheme at all ("//host/path") — must resolve onto the page's own protocol.</p>
  </body>
</html>

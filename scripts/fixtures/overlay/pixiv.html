<!doctype html>
<html><head><meta charset="utf-8"><title>pixiv overlay fixture</title><style>
  /* pixiv-shaped discovery grid: each card is an a[href*="/artworks/"] (the
     unit selector itself) wrapping the thumbnail img, with the bookmark heart
     laid over the card as a SIBLING of the anchor — pixiv's variant of the
     #338 sibling-overlay shape. The _p0 filename on i.pximg.net is what
     media-identity accepts as post media and reads the artwork id from. */
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; font-family: Arial, sans-serif; }
  header { position: fixed; inset: 0 0 auto; height: 56px; z-index: 100; background: #fff; border-bottom: 1px solid #d9d9d9; padding: 16px 32px; }
  main { width: 720px; margin: 0 auto; padding: 80px 0 400px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 224px); gap: 24px; }
  .card { position: relative; width: 224px; }
  .card a { display: block; }
  .card img { display: block; width: 224px; height: 224px; border-radius: 8px; background: linear-gradient(135deg, #e4f0ff, #ffe4ef); }
  .card .heart { position: absolute; right: 8px; bottom: 8px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(255,255,255,.9); }
</style></head><body>
  <header>pixiv</header>
  <main><ul id="grid"></ul></main>
  <script>
    const grid = document.getElementById('grid');
    for (let i = 1; i <= 12; i++) {
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="card">
          <a href="/artworks/10000${i}"><img src="https://i.pximg.net/img-master/img/2026/01/01/00/00/00/10000${i}_p0_square1200.jpg" alt="artwork ${i}"></a>
          <button class="heart" type="button"></button>
        </div>`;
      grid.appendChild(li);
    }
  </script>
</body></html>

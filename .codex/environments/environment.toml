version = 1
name = "ローカル"

[setup]
script = "npm run setup"

[[actions]]
name = "検証"
icon = "test"
command = "npm run check"

[[actions]]
name = "アプリを起動"
icon = "run"
command = "npm --workspace hologram-app run dev"

[[actions]]
name = "拡張機能を開発"
icon = "debug"
command = "npm run dev:ext"

[[actions]]
name = "拡張機能をビルド"
icon = "tool"
command = "npm run build:ext"

[[actions]]
name = "拡張機能を型検査"
icon = "test"
command = "npm --prefix extension run typecheck"

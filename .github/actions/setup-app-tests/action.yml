name: Set up app tests
description: >-
  app-tests のシャードがテストを走らせる前に必要なもの一式＝依存の木・アプリの
  バンドル・Playwright の Chromium。あのジョブを並列のシャードへ割ったとき（#937）
  app-tests.yml から切り出した。下の手順はどのシャードでも同一なので、3回書く
  代わりにここへ1回だけ置いてある。

  各シャードはこの準備をアーティファクトで受け取らず、毎回やり直す。依存の木も
  キャッシュしない。PR 内の先行 run が書き換えた実行ファイルを、同じ lockfile の
  後続 run が復元するとテスト結果を偽装できるためである。

runs:
  using: composite
  steps:
    # node_modules はキャッシュせず、npm の内容アドレス付きダウンロードキャッシュ
    # だけを再利用する。これなら PR 内の先行 run が導入済みのテスト runner を改変
    # しても、後続 run はその実行ファイルを引き継がず、lockfile から木を作り直す。
    - name: Setup Node
      id: setup-node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: |
          package-lock.json
          extension/package-lock.json
    # ci.yml と同じ導入経路＝素の `npm ci` では動く木ができない理由は
    # scripts/setup.cts を参照。ここでは拡張機能のビルドも行う。検証済みの Chrome
    # リリース出力から用意するブラウザテストは、すべてこれを必要とする。
    # setup.cts は Electron のランタイムの復元と extension/ の別 lockfile の install、
    # Chrome 向け拡張機能のビルドも行う。
    - name: Install dependencies
      shell: pwsh
      run: npm run setup
    # 拡張機能のブラウザテストは、通常の Chrome 向け出力ではなくテスト用の
    # chrome-mv3-test を読み込む。これは install の副作用ではないので、各
    # シャードの共通準備で明示的に作る。
    - name: Build test extension
      shell: pwsh
      run: npm run ext:build:test
    # ハーネスは app/ で `electron .` を起こす。その main フィールドは app/out を
    # 指している。取り出したばかりのチェックアウトにはビルド出力が無く、
    # `npm run setup` も作らないので、これが無いとどのハーネスも入口が無くて死ぬ。
    - name: Build app bundles
      shell: pwsh
      run: npm run _build --workspace=app
    # Playwright のブラウザのビルドは、package.json の `^` 範囲ではなく解決後の
    # @playwright/test のバージョンに結び付いている＝lockfile から読むことで、
    # キャッシュのキーが実際に入るものを追いかける。
    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: |
        version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~\AppData\Local\ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
    # setup は --ignore-scripts で install するので、Playwright の postinstall は
    # 走らず、ブラウザも取ってこない。Chromium だけにするのは、ここのブラウザ
    # テストがすべて展開済みの MV3 拡張機能を読み込むからで、それはもともと
    # Chromium にしかできない。キャッシュに当たっても走らせる＝ブラウザが既に
    # あればすぐ返る。
    - name: Install Playwright Chromium
      shell: pwsh
      run: npx playwright install chromium

name: 不具合の報告
description: アプリまたは拡張機能が説明どおりに動かない。
labels: ["バグ"]
body:
  - type: markdown
    attributes:
      value: |
        質問は [Q&A](https://github.com/apricot-cake/hologram/discussions/categories/q-a)、新しい機能の案は[機能の提案](https://github.com/apricot-cake/hologram/issues/new?template=feature_request.yml)、セキュリティの問題は[非公開の報告フォーム](https://github.com/apricot-cake/hologram/security/advisories/new)へお願いします。

  - type: dropdown
    id: component
    attributes:
      label: どの部分か
      options:
        - デスクトップアプリ
        - ブラウザ拡張機能
        - ブラウザからの保存（両方にまたがる）
        - わからない
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: アプリのバージョン
      description: "設定（左下の歯車）→ このアプリについて。"

  - type: input
    id: os
    attributes:
      label: OS

  - type: input
    id: browser
    attributes:
      label: ブラウザ

  - type: input
    id: site
    attributes:
      label: サイト

  - type: textarea
    id: steps
    attributes:
      label: 再現手順

  - type: textarea
    id: expected-actual
    attributes:
      label: 期待した動きと、実際に起きたこと

  - type: textarea
    id: logs
    attributes:
      label: ログの抜粋
      render: text

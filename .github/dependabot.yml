# Issue が引き取った依存更新は、その Issue を立てた時点でここに `ignore` を足し、
# Issue が閉じたら消す。エントリには Issue を名指しするコメントを添える。
# `ignore` が止めるのはバージョン更新の PR だけ＝セキュリティ更新の PR は
# それとは関わりなく開く（GitHub Docs "Dependabot options reference"）。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ワークフローの `uses:` は SHA で固定してある（タグは差し替え可能＝
  # サプライチェーンの穴・GitHub Docs "Security hardening for GitHub Actions"）。
  # 固定したまま更新を受け取る経路がこれ＝Dependabot が SHA と `# vX.Y.Z`
  # コメントの両方を書き換える。
  # `/` が見るのは .github/workflows だけ＝composite action は置き場を名指しする。
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-app-tests"
    schedule:
      interval: "weekly"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"

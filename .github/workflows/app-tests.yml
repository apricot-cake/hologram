name: App tests

# Electron と拡張機能の実プロセス検証。節目に手動実行する。
# 隔離ケースは Playwright の2シャード・各4ワーカーで実行する。
# 実ポインタ入力を使う flow は別ジョブで逐次実行する。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 手動実行では常にスイート全体を選ぶ。この出力をシャードの共通条件にする。
  changed:
    name: Select test suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: 'true'
    steps:
      - run: echo "すべての app-tests を実行する"

  pooled:
    name: 'Shard: app + extension tests (${{ matrix.shard }}/2)'
    needs: changed
    if: needs.changed.outputs.relevant == 'true'
    runs-on: windows-latest
    # 手元ではスイート全体が約2.5分。上限を想定されるランナー時間よりずっと高く
    # 置いているのは、固まった Electron が既定の6時間を食い潰すのを止めるためだけ。
    timeout-minutes: 30
    strategy:
      # 片方が赤くなっても、両方のシャードを最後まで走らせる: 最初の失敗で止まる
      # 夜間ジョブは、ほかに何が壊れていたかを知るのに丸1日を費やさせる（#818＝
      # 4夜続けて赤く、毎回違う層で、その夜すべての層が走っていたからこそ切り分け
      # られた）。
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: ./.github/actions/setup-app-tests
      - name: App harnesses, extension e2e and overlay tests
        run: npm run test:e2e:process -- --shard=${{ matrix.shard }}/2

  # シャード3＝Playwright の層（#14）。`flow` プロジェクトだけを走らせる。`visual` の
  # 方は開発機で撮ってコミットしたベースラインと比べるもので、ランナーのフォント・
  # GPU 無しの描画・ディスプレイ設定はそれを再現しない（#14 の 2026-07-29 の決定）。
  # ここで走らせても、検査対象の変更について何も語らない差分を報告するだけになる。
  flows:
    name: 'Shard: E2E flows'
    needs: changed
    if: needs.changed.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: ./.github/actions/setup-app-tests
      - name: Electron E2E (user flows)
        run: npx playwright test --project=flow

  # シャードが失敗または中止された場合も結果を一つに集約するため `always()` を使う。
  # 手動実行の成否はこのジョブで確認する。
  app-tests:
    name: Electron harnesses / extension e2e
    needs: [changed, pooled, flows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to be green
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # スイート選択と各シャードのすべてに success を求める。
          detect="$(echo "$RESULTS" | jq -r '.changed.result')"
          if [ "$detect" != "success" ]; then
            echo "::error::変更の検出が成功しなかった（changed=$detect）＝緑と報告することを拒む"
            exit 1
          fi
          shards="$(echo "$RESULTS" | jq 'del(.changed)')"
          bad="$(echo "$shards" | jq -r 'to_entries | map(select(.value.result != "success") | "\(.key)=\(.value.result)") | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::緑でない app-tests のシャードがある: $bad"
            exit 1
          fi
          echo "すべてのシャードが緑"

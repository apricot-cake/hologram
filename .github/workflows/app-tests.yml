name: App tests

# 第2段（#15）＝ci.yml では抱えられないテストの層。Windows と本物のデスクトップ
# セッションが要るため。
#   - scripts/test-app-*.cts — どれも本物の Electron のメインプロセスを起こし、
#     立ち上がったレンダラーを駆動する
#   - e2e/flows — 同じだが、見えるウィンドウと実ポインタ入力を使う（#14）
#   - 拡張機能の e2e — ビルド済みの拡張機能を読み込んだ本物の Chromium が、
#     HKCU への書き込みで登録した使い捨ての Native Messaging ホストと話す
#
# Windows と実ブラウザを使うこの層は1回あたりの実行時間が長い。非公開リポジトリの
# Actions 枠を日常の push で消費しないよう、リリース前、大きな変更、実機確認が必要な
# 節目に手動実行する。日常の push 後検査は ci.yml が担う。
#
# 作業は並列のシャードとして走る（#937）。3本で、それ以上は細かくしない: 準備が
# 1シャードあたり約55秒かかり、Free プランはアカウント全体で同時20ジョブまでで、
# それは複数の実行が重なれば届いてしまう。どちらの数字の実測も
# .github/actions/setup-app-tests を参照。
#
# #937 はシャードの境界をテストの層に沿って引いた。それが自然な継ぎ目で、ジョブ名が
# どの層が赤いかを語れたから。#968 はそれを引き直した。拡張機能と overlay の
# スクリプトがハーネスと同じワーカープール（scripts/run-app-tests.cts）に入った時点で、
# 層は費用の単位ではなくなったからで、ハーネスの層だけで最長の原子になり、他の層を
# どう並べても実時間はそこで決まるようになった。いまの分け方は
#
#   プールに載るスクリプト（42のハーネス・6の拡張機能 e2e・2の overlay テスト）を
#   2シャードへ。1つおきに取ることで、片方のシャードに長いものが集まらないようにする。
#   加えて Playwright の flow に1シャード。こちらはプールに入れられない
#   （playwright.config.ts が `workers: 1` を保っているのは、これらのケースが見える
#   ウィンドウを実ポインタ入力で駆動するからで、混んだマシンが壊すのはまさにそれ）。
#
# ジョブ名が語らなくなったものは、ログが語る: プールはスクリプトごとに `ok`/`FAIL` を
# 1行ずつ出し、最後の行で失敗した名前を並べ直す（#829）。
#
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 手動実行では常にスイート全体を選ぶ。この出力をシャードの共通条件にする。
  changed:
    name: Select test suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: 'true'
    steps:
      - run: echo "すべての app-tests を実行する"

  # シャード1と2＝自前のサンドボックスプロセスを起こすスクリプトすべてを、各シャードの
  # 中で4本ずつ走らせる。スクリプトは npm スクリプト経由ではなく集約器から呼ぶ。
  # npm スクリプト経由だと、それぞれが `npm run setup` の済ませた拡張機能のビルドを
  # やり直すことになる。
  pooled:
    name: 'Shard: app + extension tests (${{ matrix.shard }}/2)'
    needs: changed
    if: needs.changed.outputs.relevant == 'true'
    runs-on: windows-latest
    # 手元ではスイート全体が約2.5分。上限を想定されるランナー時間よりずっと高く
    # 置いているのは、固まった Electron が既定の6時間を食い潰すのを止めるためだけ。
    timeout-minutes: 30
    strategy:
      # 片方が赤くなっても、両方のシャードを最後まで走らせる: 最初の失敗で止まる
      # 夜間ジョブは、ほかに何が壊れていたかを知るのに丸1日を費やさせる（#818＝
      # 4夜続けて赤く、毎回違う層で、その夜すべての層が走っていたからこそ切り分け
      # られた）。
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: ./.github/actions/setup-app-tests
      - name: App harnesses, extension e2e and overlay tests
        run: node scripts/run-app-tests.cts --shard=${{ matrix.shard }}/2

  # シャード3＝Playwright の層（#14）。`flow` プロジェクトだけを走らせる。`visual` の
  # 方は開発機で撮ってコミットしたベースラインと比べるもので、ランナーのフォント・
  # GPU 無しの描画・ディスプレイ設定はそれを再現しない（#14 の 2026-07-29 の決定）。
  # ここで走らせても、検査対象の変更について何も語らない差分を報告するだけになる。
  flows:
    name: 'Shard: E2E flows'
    needs: changed
    if: needs.changed.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: ./.github/actions/setup-app-tests
      - name: Electron E2E (user flows)
        run: npx playwright test --project=flow

  # シャードが失敗または中止された場合も結果を一つに集約するため `always()` を使う。
  # 手動実行の成否はこのジョブで確認する。
  app-tests:
    name: Electron harnesses / extension e2e
    needs: [changed, pooled, flows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to be green
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # スイート選択と各シャードのすべてに success を求める。
          detect="$(echo "$RESULTS" | jq -r '.changed.result')"
          if [ "$detect" != "success" ]; then
            echo "::error::変更の検出が成功しなかった（changed=$detect）＝緑と報告することを拒む"
            exit 1
          fi
          shards="$(echo "$RESULTS" | jq 'del(.changed)')"
          bad="$(echo "$shards" | jq -r 'to_entries | map(select(.value.result != "success") | "\(.key)=\(.value.result)") | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::緑でない app-tests のシャードがある: $bad"
            exit 1
          fi
          echo "すべてのシャードが緑"

  # scripts/e2e-capture-test.cts＝実サイトのカナリアは、どのシャードにも入っていない。
  # 本物のプラットフォームを読むもので、X は未ログインのブラウザに投稿の DOM を返さない
  # ので、ランナー上ではログインの壁を報告することしかできない（docs/testing.md）。
  # サイト DOM のカナリアを CI で動かすにはログイン手段がまだ要る。
  # #15 がそれを未解決として記録している。

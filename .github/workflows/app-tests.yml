name: App tests

# 第2段（#15）＝ci.yml では抱えられないテストの層。Windows と本物のデスクトップ
# セッションが要るため。
#   - scripts/test-app-*.cts — どれも本物の Electron のメインプロセスを起こし、
#     立ち上がったレンダラーを駆動する
#   - e2e/flows — 同じだが、見えるウィンドウと実ポインタ入力を使う（#14）
#   - 拡張機能の e2e — ビルド済みの拡張機能を読み込んだ本物の Chromium が、
#     HKCU への書き込みで登録した使い捨ての Native Messaging ホストと話す
#
# この層はかつて1日1回しか走らなかった。理由は算術で、Windows の1分は Linux の2倍で
# 課金されるので、このジョブ1回でおよそ12分ぶんの請求になり、このリポジトリが1日に
# 記録した 63 回の push（2026-07-28）では、月 2,000 分の枠を3日で使い切る計算だった。
# リポジトリを公開にしたこと（#75）でメーター自体が消え＝標準ランナーは無料で無制限
# なので、#883 以降は ci.yml と同じく main への push ごとに走る（#996 がその引き金を
# 落とすまでは、プルリクエストごとにも走っていた）。
#
# ここでは算術よりこちらの方が効く: ci.yml が見るのは lint・型・単体テストだけなので、
# この変更の前は、本物のアプリや本物の拡張機能を起こすものがマージの前に検査される
# ことが一度も無かった。夜間の実行は残す。1日ぶんの変更が積み上がったときにだけ壊れる
# ものへの受け皿として。
#
# 作業は並列のシャードとして走る（#937）。3本で、それ以上は細かくしない: 準備が
# 1シャードあたり約55秒かかり、Free プランはアカウント全体で同時20ジョブまでで、
# それは同時に5〜6本のプルリクエストがあれば届いてしまう。どちらの数字の実測も
# .github/actions/setup-app-tests を参照。
#
# #937 はシャードの境界をテストの層に沿って引いた。それが自然な継ぎ目で、ジョブ名が
# どの層が赤いかを語れたから。#968 はそれを引き直した。拡張機能と overlay の
# スクリプトがハーネスと同じワーカープール（scripts/run-app-tests.cts）に入った時点で、
# 層は費用の単位ではなくなったからで、ハーネスの層だけで最長の原子になり、他の層を
# どう並べても実時間はそこで決まるようになった。いまの分け方は
#
#   プールに載るスクリプト（42のハーネス・6の拡張機能 e2e・2の overlay テスト）を
#   2シャードへ。1つおきに取ることで、片方のシャードに長いものが集まらないようにする。
#   加えて Playwright の flow に1シャード。こちらはプールに入れられない
#   （playwright.config.ts が `workers: 1` を保っているのは、これらのケースが見える
#   ウィンドウを実ポインタ入力で駆動するからで、混んだマシンが壊すのはまさにそれ）。
#
# ジョブ名が語らなくなったものは、ログが語る: プールはスクリプトごとに `ok`/`FAIL` を
# 1行ずつ出し、最後の行で失敗した名前を並べ直す（#829）。
#
# main への `pull_request` と `push` の両方。引き金の側では paths で絞らない＝
# allow-list は下の `changed` ジョブへ移した。引き金を2つ持つことの理由（vitejs/vite・
# wxt-dev/wxt・biomejs/biome・microsoft/vscode が実際にどうしているかの調査）は
# ci.yml が持っている。このワークフロー固有のものは:
#
#   - 本物の Electron の層をプルリクエストで走らせるのは、慣習を引き延ばした話では
#     ない: vscode は pr-linux-test / pr-darwin-test / pr-linux-cli-test を PR で
#     走らせている。マージ前に無いことがいちばん響くのがこの層で、アプリと拡張機能を
#     起こすものはこれしかない。
#   - allow-list はここではまだ元を取っている。1シャードが Linux 1分ではなく
#     Windows 3分かかるからで、ci.yml がフィルタを丸ごと落としたのは、まさにこれの
#     裏返しの理由だった。ただし引き金の上には置けない: `Electron harnesses /
#     extension e2e` がまた必須の状態チェックになり（2026-08-09）、`paths` で
#     スキップされたワークフローはそのチェックを Pending のまま永久に残す。だから
#     検出をジョブにし、シャードは `if:` からそれを読む。vitejs/vite の ci.yml も
#     同じ作りで（`changed` ジョブ → `if: needs.changed…` → どちらの場合も報告する
#     集約ジョブ）、GitHub 自身のコミュニティ回答も、スキップされた必須チェックに
#     対してこれを指している。文書はこの罠を書くだけで、回避策を出していない。
#
# ⚠️ これはいまも allow-list ＝`changed` ジョブが名指ししていないものはシャードを
# 走らせないので、最上位のディレクトリを増やしても、誰かが足すまで見えない。
# 変わったのは、そのスキップが隠れなくなったこと＝集約ジョブは必ず報告し、何を
# スキップしたかを出す。夜間の `schedule` は受け皿として残り、この一覧を一切見ない。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 18:37 UTC ＝ 03:37 JST。毎正時を外し、22:00-02:00 UTC も意図して外す:
    # 予約実行は他人の実行の後ろに並ぶので、その時間帯の山を避ける。
    - cron: '37 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # かつて引き金の `paths` だった allow-list。ジョブになっている理由はこのファイルの
  # 冒頭に書いた1つだけ＝下の集約チェックが必須で、`paths` フィルタがスキップした
  # ワークフローは何も報告しない。
  changed:
    name: Get changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # schedule と workflow_dispatch には見るべき差分が無く、これらの実行は受け皿
      # ＝常にスイート全体を走らせる。
      relevant: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
    steps:
      # 要るのは `push` のときだけ（そこではアクションが git で差分を読み、基点が
      # `initial-fetch-depth` より深ければ自分で履歴を追加取得する）。`pull_request`
      # では API を通るので、チェックアウトは要らない。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Match the allow-list
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 既定の `some` にしない。あれは `!` のパターンを丸ごと無視する＝下の2つの
          # 除外が黙って効かなくなり、`scripts/**` がまた全部に一致する。
          # `some-with-excludes` では、ファイルは少なくとも1つの規則に一致し、
          # 否定された規則のどれにも一致しないことが要る。しかも除外は最終で、後の
          # パターンがそのファイルを引き戻すことはない。ここへ移る前に GitHub 自身の
          # `paths` がこの一覧に与えていた読み方と同じ。
          predicate-quantifier: 'some-with-excludes'
          filters: |
            app:
              - 'app/**'
              - 'extension/**'
              - 'native-host/**'
              - 'scripts/**'
              # テスト自体を直した変更も、同じ CI で実行して初めて検証になる。
              # この層の実行対象を増減したり、ハーネスの待機・隔離を変えたりしても、
              # 夜間実行まで結果が分からない状態にはしない。
              - 'e2e/**'
              - '!scripts/make-icons.cjs'
              # 開発者自身のマシン向けの、Windows 専用の起動スクリプト。このジョブは
              # PowerShell を実行も lint もしないので、これを編集しても、どのシャードも
              # 触らないファイルのために Windows 3分を使うだけになる。2026-08-07 に
              # リポジトリのルートからここへ移ったことで、そもそも scripts/** の内側に
              # 入った。これが頼っている取り決めの方は覆われている＝
              # test-app-restart-signal.cts が見ていて、それは
              # app/src/main/restart-signal.ts を通じて app/** の影響範囲にあり、
              # scripts/** そのものにもある。
              - '!scripts/restart-app.ps1'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - 'vitest.config.ts'
              - '.github/workflows/app-tests.yml'
              - '.github/actions/setup-app-tests/**'

  # シャード1と2＝自前のサンドボックスプロセスを起こすスクリプトすべてを、各シャードの
  # 中で4本ずつ走らせる。スクリプトは npm スクリプト経由ではなく集約器から呼ぶ。
  # npm スクリプト経由だと、それぞれが `npm run setup` の済ませた拡張機能のビルドを
  # やり直すことになる。
  pooled:
    name: 'Shard: app + extension tests (${{ matrix.shard }}/2)'
    needs: changed
    if: needs.changed.outputs.relevant == 'true'
    runs-on: windows-latest
    # 手元ではスイート全体が約2.5分。上限を想定されるランナー時間よりずっと高く
    # 置いているのは、固まった Electron が既定の6時間を食い潰すのを止めるためだけ。
    timeout-minutes: 30
    strategy:
      # 片方が赤くなっても、両方のシャードを最後まで走らせる: 最初の失敗で止まる
      # 夜間ジョブは、ほかに何が壊れていたかを知るのに丸1日を費やさせる（#818＝
      # 4夜続けて赤く、毎回違う層で、その夜すべての層が走っていたからこそ切り分け
      # られた）。
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: ./.github/actions/setup-app-tests
      - name: App harnesses, extension e2e and overlay tests
        run: node scripts/run-app-tests.cts --shard=${{ matrix.shard }}/2

  # シャード3＝Playwright の層（#14）。`flow` プロジェクトだけを走らせる。`visual` の
  # 方は開発機で撮ってコミットしたベースラインと比べるもので、ランナーのフォント・
  # GPU 無しの描画・ディスプレイ設定はそれを再現しない（#14 の 2026-07-29 の決定）。
  # ここで走らせても、検査対象の変更について何も語らない差分を報告するだけになる。
  flows:
    name: 'Shard: E2E flows'
    needs: changed
    if: needs.changed.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: ./.github/actions/setup-app-tests
      - name: Electron E2E (user flows)
        run: npx playwright test --project=flow

  # 下の name は main のルールセットが要求しているものそのもので、このジョブに
  # ずっと付けたままにする。そうすればルールセットに触らずにシャードの構成を変え
  # られる（#937）。既定ではなく `always()` にしているのは、これが無いと、スキップ
  # または中止されたシャードがあるとこのジョブもスキップされ、スキップされたジョブは
  # 失敗を報告しないから＝一度も走らなかったテストの上で必須チェックが緑になる。
  #
  # 文書だけのプルリクエストでも必須チェックに到達できるのは、このジョブのおかげ:
  # シャードはスキップされ、これだけは走って報告する。
  app-tests:
    name: Electron harnesses / extension e2e
    needs: [changed, pooled, flows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to be green (or deliberately skipped)
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # `changed` だけは単独で success を求める: 下のスキップが正当かどうかを
          # 決めるのがこれなので、これ自身が失敗したなら、何かを意図したスキップと
          # 呼ぶ根拠が無い。
          detect="$(echo "$RESULTS" | jq -r '.changed.result')"
          if [ "$detect" != "success" ]; then
            echo "::error::変更の検出が成功しなかった（changed=$detect）＝緑と報告することを拒む"
            exit 1
          fi
          shards="$(echo "$RESULTS" | jq 'del(.changed)')"
          # `skipped` を通すのはここだけ。この2つをスキップさせるものは、`changed` が
          # 「allow-list のファイルは動いていない」と答えた場合しかないから。それ以外
          # ＝失敗・中止は赤。
          bad="$(echo "$shards" | jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)") | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::緑でない app-tests のシャードがある: $bad"
            exit 1
          fi
          # スキップは声に出して言う。黙ったスキップは、引き金の `paths` フィルタが
          # 抱えていた壊れ方＝緑と一度も走っていないが同じに見える。
          skipped="$(echo "$shards" | jq -r 'to_entries | map(select(.value.result == "skipped") | .key) | join(", ")')"
          if [ -n "$skipped" ]; then
            echo "::notice::allow-list のファイルは変わっていない＝スキップしたシャード: $skipped"
          else
            echo "すべてのシャードが緑"
          fi

  # scripts/e2e-capture-test.cts＝実サイトのカナリアは、どのシャードにも入っていない。
  # 本物のプラットフォームを読むもので、X は未ログインのブラウザに投稿の DOM を返さない
  # ので、ランナー上ではログインの壁を報告することしかできない（docs/testing.md）。
  # このワークフローの schedule が抱えるはずのサイト DOM のカナリアには、CI からログイン
  # する手立てがまだ要る。#15 がそれを未解決として記録している。

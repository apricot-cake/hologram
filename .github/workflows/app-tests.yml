name: App tests

# Electron と拡張機能の実プロセス検証。アプリに関係する変更だけを自動で選び、
# 文書などだけの変更では Windows ランナーを使わない。
# 隔離ケースは Playwright の2シャード・各4ワーカーで実行する。
# 実ポインタ入力を使う flow は別ジョブで逐次実行する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR は現在の HEAD がそれまでの差分をすべて含むので、古い実行を打ち切る。
  # main は後続の文書だけの push でアプリ変更の検査を消さないよう、完走させる。
  group: app-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR では base..HEAD 全体、main ではこの push の範囲を見る。PR の最新コミットが
  # 文書だけでも、その前にアプリを変えていれば E2E を省略しない。差分の取得に失敗
  # した場合は、安全側に倒して実行する。
  changed:
    name: Select test suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.select.outputs.relevant }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: select
        name: Select app test suite
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          choose_all() {
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            choose_all '手動実行'
            exit 0
          fi

          if [ "$EVENT_NAME" = 'pull_request' ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$base" ] || printf '%s' "$base" | grep -q '^0\{40\}$' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            choose_all '比較元を取得できない'
            exit 0
          fi

          changed="$(git diff --name-only --diff-filter=ACMR "$base" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(app/|native-image/|extension/|e2e/|\.github/workflows/app-tests\.yml$|\.github/actions/setup-app-tests/|package(-lock)?\.json$|extension/package(-lock)?\.json$|\.node-version$|\.npmrc$|playwright\.config\.ts$|tsconfig[^/]*\.json$|scripts/(setup|build-extension|build-test-extension|prepare-meilisearch|lib-wait)\.cts$|scripts/(prepare-meilisearch|prepare-avif-validator)\.mjs$|scripts/build-avif-validator\.ps1$)'; then
            choose_all 'アプリまたは E2E に関係する変更'
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'reason=App tests の対象外の変更だけ' >> "$GITHUB_OUTPUT"
          fi

  pooled:
    name: 'Shard: app + extension tests (${{ matrix.shard }}/2)'
    needs: changed
    if: needs.changed.outputs.relevant == 'true'
    runs-on: windows-latest
    # 手元ではスイート全体が約2.5分。上限を想定されるランナー時間よりずっと高く
    # 置いているのは、固まった Electron が既定の6時間を食い潰すのを止めるためだけ。
    timeout-minutes: 30
    strategy:
      # 片方が赤くなっても、両方のシャードを最後まで走らせる: 最初の失敗で止まる
      # 夜間ジョブは、ほかに何が壊れていたかを知るのに丸1日を費やさせる（#818＝
      # 4夜続けて赤く、毎回違う層で、その夜すべての層が走っていたからこそ切り分け
      # られた）。
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: ./.github/actions/setup-app-tests
      - name: App harnesses, extension e2e and overlay tests
        run: npm run test:e2e:process -- --shard=${{ matrix.shard }}/2

  # シャード3＝Playwright の層（#14）。`flow` プロジェクトだけを走らせる。`visual` の
  # 方は開発機で撮ってコミットしたベースラインと比べるもので、ランナーのフォント・
  # GPU 無しの描画・ディスプレイ設定はそれを再現しない（#14 の 2026-07-29 の決定）。
  # ここで走らせても、検査対象の変更について何も語らない差分を報告するだけになる。
  flows:
    name: 'Shard: E2E flows'
    needs: changed
    if: needs.changed.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: ./.github/actions/setup-app-tests
      - name: Electron E2E (user flows)
        run: npx playwright test --project=flow

  # シャードが失敗または中止された場合も結果を一つに集約するため `always()` を使う。
  # App tests を必須チェックにしても、対象外の変更では成功として完了させる。
  app-tests:
    name: App tests
    needs: [changed, pooled, flows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to be green
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # スイート選択の失敗は緑として扱わない。対象外なら、Windows ジョブは
          # 意図して skipped になり、この集約ジョブだけを成功させる。
          detect="$(echo "$RESULTS" | jq -r '.changed.result')"
          if [ "$detect" != "success" ]; then
            echo "::error::変更の検出が成功しなかった（changed=$detect）＝緑と報告することを拒む"
            exit 1
          fi
          relevant="$(echo "$RESULTS" | jq -r '.changed.outputs.relevant')"
          reason="$(echo "$RESULTS" | jq -r '.changed.outputs.reason')"
          if [ "$relevant" = "false" ]; then
            echo "App tests を省略: $reason"
            exit 0
          fi
          shards="$(echo "$RESULTS" | jq 'del(.changed)')"
          bad="$(echo "$shards" | jq -r 'to_entries | map(select(.value.result != "success") | "\(.key)=\(.value.result)") | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::緑でない app-tests のシャードがある: $bad"
            exit 1
          fi
          echo "すべてのシャードが緑"

name: Add new issues to project board

on:
  issues:
    types:
      - opened
      - reopened
      - transferred

jobs:
  add-to-project:
    name: Add issue to Hologram Backlog project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/users/apricot-cake/projects/3
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

name: CI

# Stage 1 (#15): the pure-unit / typecheck / lint layer, which needs nothing but
# Node and runs on any OS. The Electron-launch harness and Playwright e2e layers
# land in a later stage alongside #14, on a Windows runner.
#
# `push` to main only — no `pull_request` (#996). The pair used to be deliberate
# (#883): `pull_request` tested refs/pull/N/merge, the merge result, and the
# ruleset required it green before a merge. That gate was removed on 2026-08-06,
# so nothing waits for that run any more — it produced a result nobody read while
# the same check ran again on what landed. One change, two identical runs.
#
# What this costs: the merge result is no longer checked BEFORE it lands, only
# after. Two branches that pass alone and break together now break main and get
# caught there — hence the rule that a red main is fixed before anything else.
on:
  push:
    branches: [main]

# Default token to read-only; no job in this workflow needs to write anything.
# pull-requests: read is for the docs-only detection step's `gh api .../files` call.
permissions:
  contents: read
  pull-requests: read

# A superseded push cancels its predecessor's run instead of letting both finish
# — same signal, half the minutes. The repository is public now so the minutes are
# free, but a queue that clears faster is still worth having when several branches
# are in flight at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ⚠️ DEAD since #996 removed the `pull_request` trigger: this step returns
      # docs_only=false unconditionally on a push event, so every push to main
      # runs the full suite regardless of what changed. It is left in place
      # because #993 rewrites the detection to work off the pushed diff rather
      # than a PR number — deleting it now would only mean writing it back.
      #
      # Why it was shaped this way (#928): docs-only PRs (README, docs/**) don't
      # need the Node install or the check suite this job exists for, and a
      # required-check paths filter couldn't express that — a skipped required
      # workflow leaves the check "expected" forever and blocks the merge.
      - name: Detect docs-only change
        id: docs-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --jq '.[].filename')"
          docs_only=true
          if [ -z "$files" ]; then
            docs_only=false
          fi
          while IFS= read -r f; do
            case "$f" in
              *.md|docs/*) ;;
              *) docs_only=false ;;
            esac
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      # Not `npm ci`: two upstream problems (better-sqlite3, electron-vite/vite peer
      # range) make a plain install fail without extra flags, and this repo's own
      # entry point for installing already knows which flags are still needed and
      # covers extension/'s separate lockfile too. See scripts/setup.cts.
      - name: Install dependencies
        if: steps.docs-only.outputs.docs_only != 'true'
        run: npm run setup
      - name: Lint, typecheck, test
        if: steps.docs-only.outputs.docs_only != 'true'
        run: npm run check

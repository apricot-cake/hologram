name: CI

# 第1段（#15）＝純粋な単体テスト・型検査・lint の層。Node のほかに何も要らず、
# どの OS でも走る。Electron を起こすハーネスと Playwright の e2e 層は、#14 と
# 並んで後の段で Windows ランナーに載る。
#
# `main` への push 後に、lint・型検査・単体テストを非同期で実行する。
# 大きな変更で PR を使う場合も同じ検査を実行する。マージ条件にはしない。
# 短い Linux ジョブなので変更内容によるフィルタは設けない。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# トークンの既定を読み取りのみにする。このワークフローのどのジョブも書き込まない。
permissions:
  contents: read

# 後から来た push が前の実行を打ち切る。古い結果へ実行時間を使わない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # pull_request / push ではコミット間を比較し、手動実行では履歴全体を読む。
      # checkout の既定の shallow clone では足りないため、全履歴を取得する。
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject libraries and verification captures
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && ! printf '%s' "$BASE_SHA" | grep -q '^0\{40\}$'; then
            node scripts/guard-repository-content.cts --range "$BASE_SHA" "$HEAD_SHA"
          else
            node scripts/guard-repository-content.cts --all
          fi
      # Node 24 対応の v3.0.0 を完全な SHA で固定する。更新は Dependabot が担う。
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # 個人アカウント所有のリポジトリなのでライセンスキーは不要。読み取り専用の
          # GITHUB_TOKEN を維持するため、プルリクエストへのコメントは作らない。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: 8.30.1

  check:
    name: lint / typecheck / test
    # secret-scan が失敗した場合も起動し、その失敗をワークフロー全体へ引き継ぐ。
    if: ${{ always() }}
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Require successful secret scan
        if: ${{ needs.secret-scan.result != 'success' }}
        run: exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      # `npm ci` にしない: 上流の2つの問題（better-sqlite3・electron-vite と vite の
      # peer 範囲）のせいで、素の install は追加のフラグ無しには失敗する。このリポジトリ
      # 自身の導入経路が、いま何のフラグが要るかを既に知っていて、extension/ の別の
      # lockfile も面倒を見る。scripts/setup.cts を参照。
      - name: Install dependencies
        run: npm run setup
      - name: Lint, typecheck, test
        run: npm run check:ci

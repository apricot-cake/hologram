name: CI

# Stage 1 (#15): the pure-unit / typecheck / lint layer, which needs nothing but
# Node and runs on any OS. The Electron-launch harness and Playwright e2e layers
# land in a later stage alongside #14, on a Windows runner.
#
# `push` to main only — no `pull_request` (#996). The pair used to be deliberate
# (#883): `pull_request` tested refs/pull/N/merge, the merge result, and the
# ruleset required it green before a merge. That gate was removed on 2026-08-06,
# so nothing waits for that run any more — it produced a result nobody read while
# the same check ran again on what landed. One change, two identical runs.
#
# What this costs: the merge result is no longer checked BEFORE it lands, only
# after. Two branches that pass alone and break together now break main and get
# caught there — hence the rule that a red main is fixed before anything else.
#
# `paths-ignore` (#993) replaces a hand-written docs-only detection step that
# called `gh api .../files` on a PR number. It went dead the moment #996 dropped
# the `pull_request` trigger — a push event has no PR to look up, so it always
# ran the full suite. Standard GitHub path filtering needs no script and no
# token. Excluded here rather than enumerated: lint/typecheck touch nearly every
# file, so a new directory should be checked by default, not silently skipped
# because nobody added it to an allow-list.
#
# The `schedule` below is what that exclusion falls back on. `paths-ignore` only
# applies to `push`, so the nightly run always sees the whole tree — including a
# docs/ or *.md change that lint or tsc would in fact have had something to say
# about (a code fence is not the only thing that lives in markdown; a moved file
# referenced from a config is not markdown at all). app-tests.yml has kept its
# nightly for exactly this and schema-canary.yml runs in the same window; this
# layer was the one still missing it.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
  schedule:
    # 18:17 UTC = 03:17 JST. Off the hour and outside 22:00-02:00 UTC for the same
    # reason as app-tests.yml — scheduled runs queue behind everyone else's, and
    # those are the peaks. Twenty minutes ahead of app-tests' 03:37 and ten behind
    # schema-canary's 03:07, so the three nightly jobs do not contend for runners.
    - cron: '17 18 * * *'
  workflow_dispatch:

# Default token to read-only; no job in this workflow needs to write anything.
permissions:
  contents: read

# A superseded push cancels its predecessor's run instead of letting both finish
# — same signal, half the minutes. The repository is public now so the minutes are
# free, but a queue that clears faster is still worth having when several branches
# are in flight at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      # Not `npm ci`: two upstream problems (better-sqlite3, electron-vite/vite peer
      # range) make a plain install fail without extra flags, and this repo's own
      # entry point for installing already knows which flags are still needed and
      # covers extension/'s separate lockfile too. See scripts/setup.cts.
      - name: Install dependencies
        run: npm run setup
      - name: Lint, typecheck, test
        run: npm run check

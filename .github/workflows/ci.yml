name: CI

# 第1段（#15）＝純粋な単体テスト・型検査・lint の層。Node のほかに何も要らず、
# どの OS でも走る。Electron を起こすハーネスと Playwright の e2e 層は、#14 と
# 並んで後の段で Windows ランナーに載る。
#
# main への `pull_request` と `push` の両方。どちらにも paths フィルタを掛けない。
#
# この2つの引き金は 2026-08-08 に戻した。このスタックの実プロダクトはどれも検査層を
# プルリクエストで走らせているからで、議論ではなく実測に基づく＝vitejs/vite・
# wxt-dev/wxt・biomejs/biome・microsoft/vscode がすべてそうしていて、vscode の
# pr.yml には `push` の引き金が無い。#996 が落としたのは、2026-08-06 にマージゲート
# が無くなり、実行が「誰も読まない結果を出すだけ」になったからだった。だが結果が
# 役に立つために待たれる必要はない＝マージの前に見えていればよい。無かった代償は
# 2026-08-07 に払った: #1015 が赤い storage-redirect-guard のスイートを入れ（2つの
# ブランチの相互作用ではなくブランチ単独で赤かった）、次のコミット＝文書だけの
# コミットが、その赤い main を引き継いだ。
#
# フィルタ（#993）は 2026-08-09 をもって無い。`lint / typecheck / test` がまた
# 必須の状態チェックになったからで、`paths` でスキップされたワークフローはその
# チェックを Pending のまま永久に残す。必須のチェックを引き金の側で絞ってはいけない
# ＝GitHub 自身がこの罠を文書に書き、回避策を用意していない。
#
# app-tests.yml は allow-list を変更検出のジョブへ移すことで保っている（vitejs/vite
# の ci.yml と同じ形）。こちらは意図してそうしない: 検出ジョブはそれ自身のランナー・
# チェックアウト・アクションを食い、それはこのジョブ全体の費用とほぼ同じになる
# （Linux 1分に対し、あちらはシャード1本が Windows 3分）。だから常に走らせる。
# wxt-dev/wxt の validate.yml も同じ形。
#
# マージ可否のほかに得られるもの: 以前は「走っていない」と「緑」が `gh pr checks`
# で見分けられず、文書だけのプルリクエストではこのワークフローの項目自体が出なかった。
# いまは必ず項目が出る。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 18:17 UTC ＝ 03:17 JST。毎正時を外し、22:00-02:00 UTC も外す。理由は
    # app-tests.yml と同じ＝予約実行は他人の実行の後ろに並ぶので、その時間帯の山を
    # 避ける。app-tests の 03:37 より20分前、schema-canary の 03:07 より10分後に
    # 置いてあり、夜間の3ジョブがランナーを取り合わない。
    - cron: '17 18 * * *'
  workflow_dispatch:

# トークンの既定を読み取りのみにする。このワークフローのどのジョブも書き込まない。
permissions:
  contents: read

# 後から来た push が前の実行を打ち切る＝両方を最後まで走らせない。同じ合図が半分の
# 時間で得られる。リポジトリは公開になったので実行時間は無料だが、複数のブランチが
# 同時に飛んでいるときは、待ち行列が早く掃けること自体に価値がある。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      # `npm ci` にしない: 上流の2つの問題（better-sqlite3・electron-vite と vite の
      # peer 範囲）のせいで、素の install は追加のフラグ無しには失敗する。このリポジトリ
      # 自身の導入経路が、いま何のフラグが要るかを既に知っていて、extension/ の別の
      # lockfile も面倒を見る。scripts/setup.cts を参照。
      - name: Install dependencies
        run: npm run setup
      - name: Lint, typecheck, test
        run: npm run check:ci

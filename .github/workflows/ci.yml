name: CI

# Stage 1 (#15): the pure-unit / typecheck / lint layer, which needs nothing but
# Node and runs on any OS. The Electron-launch harness and Playwright e2e layers
# land in a later stage alongside #14, on a Windows runner.
#
# `pull_request` AND `push` to main, with NO path filter on either. Both halves of
# that were measured against what real projects in this stack do, not argued from
# first principles (2026-08-08 survey of vitejs/vite, wxt-dev/wxt, biomejs/biome,
# microsoft/vscode, electron/electron):
#
#   - every one of them runs its check layer on `pull_request`; vscode's pr.yml has
#     no `push` trigger at all. Zero of them check only what has already landed.
#     #996 had dropped the trigger because the merge gate was gone on 2026-08-06 and
#     the run "produced a result nobody read" — but a result does not have to be
#     waited on to be useful. It only has to be visible before the merge. The cost
#     of not having it was paid on 2026-08-07: #1015 landed a red
#     storage-redirect-guard suite that was red in the branch alone (not a
#     two-branch interaction), and the next commit — a docs-only one — inherited
#     that red main.
#   - the path filter has to go before this check can be REQUIRED, which is the
#     point of restoring the trigger. GitHub's own guidance is explicit: a workflow
#     skipped by `paths`/`paths-ignore` leaves its checks Pending forever, so a
#     required check must not be filtered that way (a job skipped by an `if:`
#     reports Success and is fine; a workflow skipped by paths does not).
#     Dropping the filter outright rather than moving it into a job-level `if:`
#     costs about a minute of Linux time on a docs-only change and needs no
#     change-detection step — and this repository has already had one of those go
#     silently dead (#993 removed a `gh api .../files` step that could not work on
#     a push event). Nothing to maintain is worth more than the minute.
#
# The `schedule` below no longer has a filter to fall back on, but it keeps its
# other job: catching what a day of stacked changes breaks, in the same window as
# app-tests.yml and schema-canary.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 18:17 UTC = 03:17 JST. Off the hour and outside 22:00-02:00 UTC for the same
    # reason as app-tests.yml — scheduled runs queue behind everyone else's, and
    # those are the peaks. Twenty minutes ahead of app-tests' 03:37 and ten behind
    # schema-canary's 03:07, so the three nightly jobs do not contend for runners.
    - cron: '17 18 * * *'
  workflow_dispatch:

# Default token to read-only; no job in this workflow needs to write anything.
permissions:
  contents: read

# A superseded push cancels its predecessor's run instead of letting both finish
# — same signal, half the minutes. The repository is public now so the minutes are
# free, but a queue that clears faster is still worth having when several branches
# are in flight at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      # Not `npm ci`: two upstream problems (better-sqlite3, electron-vite/vite peer
      # range) make a plain install fail without extra flags, and this repo's own
      # entry point for installing already knows which flags are still needed and
      # covers extension/'s separate lockfile too. See scripts/setup.cts.
      - name: Install dependencies
        run: npm run setup
      - name: Lint, typecheck, test
        run: npm run check

name: CI

# Stage 1 (#15): the pure-unit / typecheck / lint layer, which needs nothing but
# Node and runs on any OS. The Electron-launch harness and Playwright e2e layers
# land in a later stage alongside #14, on a Windows runner.
#
# `pull_request` AND `push` to main, NEITHER path-filtered.
#
# The trigger pair came back on 2026-08-08 because every real project in this stack
# runs its check layer on pull requests — measured, not argued: vitejs/vite,
# wxt-dev/wxt, biomejs/biome and microsoft/vscode all do, and vscode's pr.yml has no
# `push` trigger at all. #996 had dropped it because the merge gate was gone on
# 2026-08-06 and the run "produced a result nobody read", but a result does not have
# to be WAITED ON to be useful — it only has to be VISIBLE before the merge. The cost
# of not having it was paid on 2026-08-07: #1015 landed a red storage-redirect-guard
# suite that was red in the branch alone (not a two-branch interaction), and the next
# commit — a docs-only one — inherited that red main.
#
# The filter (#993) is gone as of 2026-08-09, because `lint / typecheck / test` is a
# REQUIRED status check again. A workflow skipped by `paths` leaves its check Pending
# forever, so a required check must never be filtered at the trigger — GitHub
# documents that trap and offers no fix for it.
#
# app-tests.yml keeps its allow-list by moving it into a change-detection JOB, the
# shape vitejs/vite's ci.yml uses. This workflow deliberately does NOT: a detection
# job costs its own runner, checkout and action — roughly what this whole job costs
# (one Linux minute against the three Windows minutes a shard costs over there). So
# it simply always runs, which is also what wxt-dev/wxt's validate.yml does.
#
# What that buys beyond mergeability: NOT RUN AND GREEN used to look identical in
# `gh pr checks`, and a docs-only pull request produced no entry for this workflow at
# all. Now there is always an entry.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 18:17 UTC = 03:17 JST. Off the hour and outside 22:00-02:00 UTC for the same
    # reason as app-tests.yml — scheduled runs queue behind everyone else's, and
    # those are the peaks. Twenty minutes ahead of app-tests' 03:37 and ten behind
    # schema-canary's 03:07, so the three nightly jobs do not contend for runners.
    - cron: '17 18 * * *'
  workflow_dispatch:

# Default token to read-only; no job in this workflow needs to write anything.
permissions:
  contents: read

# A superseded push cancels its predecessor's run instead of letting both finish
# — same signal, half the minutes. The repository is public now so the minutes are
# free, but a queue that clears faster is still worth having when several branches
# are in flight at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      # Not `npm ci`: two upstream problems (better-sqlite3, electron-vite/vite peer
      # range) make a plain install fail without extra flags, and this repo's own
      # entry point for installing already knows which flags are still needed and
      # covers extension/'s separate lockfile too. See scripts/setup.cts.
      - name: Install dependencies
        run: npm run setup
      - name: Lint, typecheck, test
        run: npm run check

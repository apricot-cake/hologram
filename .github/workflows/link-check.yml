name: Link check

# 文書だけの変更を支える床。ci.yml は `**/*.md` と `docs/**` を意図して無視していて
# （#993）、app-tests.yml はもともと一致しない。だからこのワークフローができるまで、
# markdown しか触らない変更は夜間まで検査を1つも通らなかった。そういう変更で実際に
# 壊れうるもののうち最も安いのが、解決しなくなった相対リンクで、これは仮の話ではない:
# 2026-08-07 に PRIVACY.md と THIRD-PARTY-NOTICES.md を docs/ へ移したとき、そこへの
# リンクは全部壊れ、直せたかどうかは誰かが grep を思い出すかに懸かっていた（その参照の
# 1つは生きたコードだった＝scripts/model-registry.test.ts が notices のファイルを読む
# ので、そちら半分は自力で赤くなった。README.md のリンクはならなかった）。
#
# --offline は意図してのもの。外部の URL は、このリポジトリと関わりのない理由で壊れる
# ＝サイトの改編・CI ランナーへのレート制限・ドメインの失効。他人の障害で赤くなる検査
# は人が無視することを覚えるので、買うものより費用が大きい。検証するのはリポジトリの
# 内側を指すリンクだけ。外部の腐りは実在するが、それは見直しの回で扱うものであって、
# 文書を編集するたびの関門ではない。
#
# glob を `**/*.md` にせず列挙しているのは、その書き方だと node_modules（どの依存も
# README を同梱する）と .claude/worktrees（このリポジトリの丸ごとのチェックアウトが
# 入る）まで歩くから。2026-08-07 時点の `git ls-files '*.md'` では、追跡されている
# markdown はすべて下のいずれかの経路に入っていた＝文書を含む最上位のディレクトリを
# 増やしたら、ここに足す必要がある。
#
# remark-validate-links（npm 側の同等品）ではなく lychee を使う: ジョブの中で
# `npm ci` が要らないので、文書だけの push が1分ではなく数秒で済み、package.json に
# 依存も増えない。代償は、これがこのリポジトリで最初のサードパーティのアクションに
# なること＝ここでの actions/* の使い方と同じく SHA で固定してあり、Dependabot は
# github-actions のエコシステムを既に見ている。

# `pull_request` は 2026-08-08 に、ci.yml と同じ理由で足した＝壊れた相対リンクは
# マージの後ではなく前に見える価値がある。ただしこちらは `paths` を残す。ci.yml や
# app-tests.yml と違い、意図して必須のチェックにしていないからで、paths で絞られた
# ワークフローはスキップした実行のチェックを Pending のまま残す。これは何もそれを
# 待たない限りにおいて無害でしかない。もし必須にするなら、あちらと同じくフィルタを
# 外す必要がある。
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Relative links resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check relative links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            './*.md'
            './.claude/skills/**/*.md'
            './.github/**/*.md'
            './docs/**/*.md'
            './e2e/**/*.md'
            './native-host/**/*.md'
            './scripts/**/*.md'
          fail: true

<!-- @dsCard group="Components" viewport="700x220" name="Chip — filters & tags" subtitle="The brand-core pill: filter, tag, active-filter" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { background: var(--surface); padding: 20px 22px; }
  .lbl { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:600; margin:0 0 9px; }
  .row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px; }
  .row:last-child { margin-bottom:0; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Chip } = window.CorpusDesignSystem_59d196;
    function Demo(){
      const [sel,setSel] = React.useState({x:true, bluesky:false, pixiv:true});
      const t = (k)=>setSel(s=>({...s,[k]:!s[k]}));
      return (
        <>
          <p className="lbl">Filter chips (sidebar)</p>
          <div className="row">
            <Chip active={sel.x} onClick={()=>t('x')}>X</Chip>
            <Chip active={sel.bluesky} onClick={()=>t('bluesky')}>Bluesky</Chip>
            <Chip onClick={()=>t('misskey')}>Misskey</Chip>
            <Chip onClick={()=>t('mastodon')}>Mastodon</Chip>
            <Chip active={sel.pixiv} onClick={()=>t('pixiv')}>pixiv</Chip>
          </div>
          <p className="lbl">Tag chips with counts</p>
          <div className="row">
            <Chip count={128}>イラスト</Chip>
            <Chip count={64}>風景</Chip>
            <Chip leading="★" count={42}>お気に入り</Chip>
            <Chip count={9}>resources</Chip>
          </div>
          <p className="lbl">Active-filter pills (removable, tinted)</p>
          <div className="row">
            <Chip category="platform" removable>Bluesky</Chip>
            <Chip category="date" removable>2026-01 〜 2026-06</Chip>
            <Chip category="engagement" removable>❤ 100 以上</Chip>
            <Chip category="tag" removable>イラスト</Chip>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>

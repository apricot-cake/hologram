<!-- @dsCard group="Components" viewport="700x440" name="PostCard" subtitle="Saved-post card — grid & list layouts" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { background: var(--bg); padding: 20px 22px; }
  .lbl { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:600; margin:0 0 9px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
  .stack { display:flex; flex-direction:column; gap:8px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { PostCard } = window.CorpusDesignSystem_59d196;
    const A = {
      platform:'bluesky', displayName:'青空スケッチ', screenName:'sora_sketch',
      text:'夕方の光がきれいだったので描きました。空のグラデーションを意識しています。',
      image:'../../assets/sample/art-03.jpg', likes:12480, reposts:321, replies:42,
      date:'2026-06-08', tags:['イラスト','風景'], mediaType:'image',
    };
    const B = {
      platform:'x', displayName:'machi', screenName:'machi_draws',
      text:'ラフ。あとで清書する。', image:'../../assets/sample/art-07.jpg',
      likes:842, reposts:18, replies:3, date:'2026-05-30', isReply:true, mediaType:'image',
    };
    function Demo(){
      return (
        <>
          <p className="lbl">Grid layout</p>
          <div className="grid">
            <PostCard post={A} selectable inFolder />
            <PostCard post={B} selectable selected />
          </div>
          <p className="lbl">List layout</p>
          <div className="stack">
            <PostCard post={A} layout="list" />
            <PostCard post={{...B, platform:'pixiv', displayName:'pixiv作家', text:'連作の3枚目。'}} layout="list" />
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>

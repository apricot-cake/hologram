<!-- @dsCard group="Colors" viewport="700x150" name="Neutral ramp" subtitle="Cool-slate base — the entire monotone foundation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface); padding: 18px 20px; }
  .ramp { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); }
  .sw { flex: 1; height: 64px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; }
  .sw span { font-family: var(--font-mono); font-size: 9px; color: rgba(255,255,255,0.85); }
  .sw.dark span { color: rgba(0,0,0,0.55); }
  .labels { display: flex; margin-top: 7px; }
  .labels div { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw dark" style="background:var(--gray-0)"></div>
    <div class="sw dark" style="background:var(--gray-50)"></div>
    <div class="sw dark" style="background:var(--gray-100)"></div>
    <div class="sw dark" style="background:var(--gray-150)"></div>
    <div class="sw dark" style="background:var(--gray-200)"></div>
    <div class="sw dark" style="background:var(--gray-300)"></div>
    <div class="sw dark" style="background:var(--gray-400)"></div>
    <div class="sw" style="background:var(--gray-500)"></div>
    <div class="sw" style="background:var(--gray-600)"></div>
    <div class="sw" style="background:var(--gray-700)"></div>
    <div class="sw" style="background:var(--gray-800)"></div>
    <div class="sw" style="background:var(--gray-900)"></div>
    <div class="sw" style="background:var(--gray-950)"></div>
  </div>
  <div class="labels">
    <div>0</div><div>50</div><div>100</div><div>150</div><div>200</div><div>300</div><div>400</div><div>500</div><div>600</div><div>700</div><div>800</div><div>900</div><div>950</div>
  </div>
</body>
</html>

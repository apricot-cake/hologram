<!-- @dsCard group="Spacing" viewport="700x150" name="4px grid" subtitle="Spacing scale — dense at the small end" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background:var(--surface); padding:20px 24px; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .col { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar { background:var(--accent); border-radius:2px; width:100%; }
  .box { width:38px; display:flex; align-items:flex-end; height:48px; }
  .lbl { font-family:var(--font-mono); font-size:9px; color:var(--text-muted); }
  .px { font-family:var(--font-mono); font-size:9px; color:var(--text-subtle); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box"><div class="bar" style="height:4px"></div></div><span class="lbl">2</span><span class="px">2</span></div>
    <div class="col"><div class="box"><div class="bar" style="height:8px"></div></div><span class="lbl">3</span><span class="px">6</span></div>
    <div class="col"><div class="box"><div class="bar" style="height:8px"></div></div><span class="lbl">4</span><span class="px">8</span></div>
    <div class="col"><div class="box"><div class="bar" style="height:12px"></div></div><span class="lbl">6</span><span class="px">12</span></div>
    <div class="col"><div class="box"><div class="bar" style="height:16px"></div></div><span class="lbl">7</span><span class="px">16</span></div>
    <div class="col"><div class="box"><div class="bar" style="height:20px"></div></div><span class="lbl">8</span><span class="px">20</span></div>
    <div class="col"><div class="box"><div class="bar" style="height:24px"></div></div><span class="lbl">9</span><span class="px">24</span></div>
    <div class="col"><div class="box"><div class="bar" style="height:32px"></div></div><span class="lbl">10</span><span class="px">32</span></div>
    <div class="col"><div class="box"><div class="bar" style="height:40px"></div></div><span class="lbl">11</span><span class="px">40</span></div>
    <div class="col"><div class="box"><div class="bar" style="height:48px"></div></div><span class="lbl">12</span><span class="px">48</span></div>
  </div>
</body>
</html>

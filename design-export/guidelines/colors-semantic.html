<!-- @dsCard group="Colors" viewport="700x190" name="Semantic surfaces" subtitle="The aliases components consume — light & dark parity" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { display:flex; gap:0; }
  .pane { flex:1; padding:16px 18px; }
  .pane.l { background:var(--bg); }
  .pane.r { background:var(--bg); }
  .ttl { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:10px; font-weight:600; }
  .stack { display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; align-items:center; gap:8px; font-size:11px; font-family:var(--font-mono); color:var(--text); }
  .chip { width:34px; height:20px; border-radius:5px; border:1px solid var(--border-strong); flex-shrink:0; }
</style>
</head>
<body>
  <div class="pane l">
    <div class="ttl">Light</div>
    <div class="stack">
      <div class="row"><span class="chip" style="background:var(--bg)"></span>--bg</div>
      <div class="row"><span class="chip" style="background:var(--surface)"></span>--surface</div>
      <div class="row"><span class="chip" style="background:var(--surface-2)"></span>--surface-2</div>
      <div class="row"><span class="chip" style="background:var(--hover)"></span>--hover</div>
      <div class="row"><span class="chip" style="background:var(--border)"></span>--border</div>
      <div class="row"><span class="chip" style="background:var(--accent)"></span>--accent</div>
    </div>
  </div>
  <div class="pane r" data-theme="dark">
    <div class="ttl">Dark</div>
    <div class="stack">
      <div class="row"><span class="chip" style="background:var(--bg)"></span>--bg</div>
      <div class="row"><span class="chip" style="background:var(--surface)"></span>--surface</div>
      <div class="row"><span class="chip" style="background:var(--surface-2)"></span>--surface-2</div>
      <div class="row"><span class="chip" style="background:var(--hover)"></span>--hover</div>
      <div class="row"><span class="chip" style="background:var(--border)"></span>--border</div>
      <div class="row"><span class="chip" style="background:var(--accent)"></span>--accent</div>
    </div>
  </div>
</body>
</html>

<!-- @dsCard group="Type" viewport="700x160" name="Geist Mono — numerals" subtitle="Counts, handles, dates & paths in tabular mono" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background:var(--surface); padding:20px 24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 28px; }
  .blk .k { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:600; margin-bottom:5px; }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--text-strong); }
  .eng { display:flex; gap:14px; font-size:13px; }
  .eng span { color:var(--text-muted); }
</style>
</head>
<body>
  <div class="grid">
    <div class="blk">
      <div class="k">Engagement</div>
      <div class="eng mono"><span>❤ 12,480</span><span>🔁 3,201</span><span>💬 142</span></div>
    </div>
    <div class="blk">
      <div class="k">Handle</div>
      <div class="mono" style="font-size:14px">@corpus_archive</div>
    </div>
    <div class="blk">
      <div class="k">Date</div>
      <div class="mono" style="font-size:14px">2026-06-08 14:32</div>
    </div>
    <div class="blk">
      <div class="k">Path</div>
      <div class="mono" style="font-size:12px;color:var(--text-muted)">~/Corpus/save/2026/06/</div>
    </div>
  </div>
</body>
</html>

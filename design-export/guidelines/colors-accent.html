<!-- @dsCard group="Colors" viewport="700x150" name="Indigo accent" subtitle="The single restrained accent — selection, active, primary" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface); padding: 18px 20px; }
  .ramp { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); }
  .sw { flex: 1; height: 64px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; }
  .sw span { font-family: var(--font-mono); font-size: 9px; }
  .labels { display: flex; margin-top: 7px; }
  .labels div { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
  .roles { display:flex; gap:8px; margin-top:14px; }
  .role { flex:1; border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; font-size:11px; }
  .dot { width:12px; height:12px; border-radius:3px; display:inline-block; vertical-align:-1px; margin-right:6px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw" style="background:var(--indigo-50)"><span style="color:#555">50</span></div>
    <div class="sw" style="background:var(--indigo-100)"><span style="color:#555">100</span></div>
    <div class="sw" style="background:var(--indigo-200)"><span style="color:#555">200</span></div>
    <div class="sw" style="background:var(--indigo-300)"><span style="color:#fff">300</span></div>
    <div class="sw" style="background:var(--indigo-400)"><span style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--indigo-500)"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--indigo-600)"><span style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--indigo-700)"><span style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--indigo-800)"><span style="color:#fff">800</span></div>
  </div>
  <div class="roles">
    <div class="role"><span class="dot" style="background:var(--accent)"></span>--accent · primary / selected</div>
    <div class="role"><span class="dot" style="background:var(--accent-subtle); border:1px solid var(--accent-border)"></span>--accent-subtle · tinted bg</div>
    <div class="role"><span class="dot" style="background:var(--accent-hover)"></span>--accent-hover</div>
  </div>
</body>
</html>

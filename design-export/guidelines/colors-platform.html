<!-- @dsCard group="Colors" viewport="700x130" name="Platform & status" subtitle="Brand-locked badge colors + the rare status hues" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background:var(--surface); padding:18px 20px; }
  .lbl { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:600; margin-bottom:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .badge { font-size:10px; font-weight:600; letter-spacing:.04em; padding:3px 9px; border-radius:var(--radius-xs); color:#fff; text-transform:uppercase; }
  .stat { display:flex; align-items:center; gap:6px; font-size:11px; font-family:var(--font-mono); color:var(--text); }
  .stat .d { width:14px; height:14px; border-radius:4px; }
</style>
</head>
<body>
  <div class="lbl">Platform badges</div>
  <div class="row">
    <span class="badge" style="background:var(--brand-x)">X</span>
    <span class="badge" style="background:var(--brand-bluesky)">Bluesky</span>
    <span class="badge" style="background:var(--brand-misskey);color:#1a2e05">Misskey</span>
    <span class="badge" style="background:var(--brand-mastodon)">Mastodon</span>
    <span class="badge" style="background:var(--brand-pixiv)">pixiv</span>
  </div>
  <div class="lbl">Status</div>
  <div class="row">
    <div class="stat"><span class="d" style="background:var(--danger)"></span>--danger</div>
    <div class="stat"><span class="d" style="background:var(--success)"></span>--success</div>
    <div class="stat"><span class="d" style="background:var(--amber-500)"></span>--amber-500</div>
  </div>
</body>
</html>

<!-- @dsCard group="Brand" viewport="700x200" name="Wordmark" subtitle="Corpus wordmark — Geist, in light & dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { display:flex; }
  .pane { flex:1; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:10px; padding:0 34px; min-height:200px; }
  .light { background:var(--bg); }
  .dark { background:var(--bg); }
  .mark { display:flex; align-items:center; gap:11px; }
  .glyph {
    width:30px; height:30px; border-radius:8px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .glyph b { color:#fff; font-weight:700; font-size:18px; font-family:var(--font-sans); line-height:1; }
  .word { font-size:26px; font-weight:600; letter-spacing:-0.01em; color:var(--text-strong); }
  .sub { font-family:var(--font-mono); font-size:10px; color:var(--text-subtle); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="pane light">
    <div class="mark"><span class="glyph"><b>C</b></span><span class="word">Corpus</span></div>
    <span class="sub">Personal SNS &amp; illustration archive</span>
  </div>
  <div class="pane dark" data-theme="dark">
    <div class="mark"><span class="glyph"><b>C</b></span><span class="word">Corpus</span></div>
    <span class="sub">コーパス — 静かに集める個人アーカイブ</span>
  </div>
</body>
</html>

<!-- @dsCard group="Type" viewport="700x230" name="Geist Sans scale" subtitle="UI type ramp — dense, tool-grade, sentence case" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background:var(--surface); padding:20px 24px; }
  .r { display:flex; align-items:baseline; gap:16px; padding:6px 0; border-bottom:1px solid var(--border-subtle); }
  .r:last-child { border-bottom:none; }
  .meta { font-family:var(--font-mono); font-size:10px; color:var(--text-subtle); width:108px; flex-shrink:0; }
  .spec { color:var(--text-strong); }
</style>
</head>
<body>
  <div class="r"><span class="meta">26 / 600</span><span class="spec" style="font-size:var(--text-3xl);font-weight:600;letter-spacing:var(--tracking-tight)">投稿を、静かに集める</span></div>
  <div class="r"><span class="meta">21 / 600</span><span class="spec" style="font-size:var(--text-2xl);font-weight:600;letter-spacing:var(--tracking-tight)">画像閲覧 · Image view</span></div>
  <div class="r"><span class="meta">16 / 600</span><span class="spec" style="font-size:var(--text-lg);font-weight:600">カードのタイトル</span></div>
  <div class="r"><span class="meta">14 / 400</span><span class="spec" style="font-size:var(--text-md)">本文。落ち着いて長時間眺められる読みやすさ。</span></div>
  <div class="r"><span class="meta">13 / 400</span><span class="spec" style="font-size:var(--text-base);color:var(--text)">Dense control & body text at 13px.</span></div>
  <div class="r"><span class="meta">12 / 400</span><span class="spec" style="font-size:var(--text-sm);color:var(--text-muted)">メタ情報・キャプション</span></div>
  <div class="r"><span class="meta">11 / 600 ↑</span><span class="spec eyebrow">Section eyebrow</span></div>
</body>
</html>

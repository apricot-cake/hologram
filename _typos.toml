[files]
extend-exclude = ["package-lock.json", "extension/package-lock.json", "app/third-party-licenses/**"]

[default]
# コメントに記載したコミットの短縮ハッシュ。
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
# ダミー投稿の姓・ハンドル。
Ono = "Ono"
Memer = "Memer"

[type.tests]
extend-glob = ["*.test.ts"]

[type.tests.extend-words]
# あいまい検索・前方一致検索の意図的な入力。
illustraton = "illustraton"
gam = "gam"

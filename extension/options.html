<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Corpus 設定</title>
<script src="page-theme.js"></script>
<style>
  /* App design language (design-tokens.css), ported as literals — same token
     set and theming scheme as diag.html (see its header comment: [data-theme]
     stamped by page-theme.js beats the prefers-color-scheme auto path, hence
     the duplicated dark block). Static text is Japanese fallback; options.js
     swaps it for the browser-locale _locales strings (chrome.i18n). */
  :root {
    --bg: #f6f7f9;            /* gray-50 */
    --surface: #ffffff;       /* gray-0 */
    --text: #24282f;          /* gray-800 */
    --text-strong: #0c0e12;   /* gray-950 */
    --text-muted: #606673;    /* gray-550 */
    --border: #e4e7ec;        /* gray-150 */
    --border-strong: #d8dce2; /* gray-200 */
    --hover: #eceef2;         /* gray-100 */
    --field-bg: #eceef2;      /* gray-100 */
    --accent-text: #0a6e96;   /* sky-800 */
    --focus-ring: rgba(40, 168, 219, 0.45); /* sky-500 @45% */
    --font-sans: -apple-system, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Noto Sans JP', system-ui, sans-serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --dur-hover: 0.18s;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f11;
      --surface: #16171a;
      --text: #dadce0;
      --text-strong: #f4f5f7;
      --text-muted: #8e9298;
      --border: #282a2e;
      --border-strong: #36383d;
      --hover: #2a2d33;
      --field-bg: #1a1c20;
      --accent-text: #8ad3ec; /* sky-300 */
      --focus-ring: rgba(40, 168, 219, 0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f11;
    --surface: #16171a;
    --text: #dadce0;
    --text-strong: #f4f5f7;
    --text-muted: #8e9298;
    --border: #282a2e;
    --border-strong: #36383d;
    --hover: #2a2d33;
    --field-bg: #1a1c20;
    --accent-text: #8ad3ec;
    --focus-ring: rgba(40, 168, 219, 0.55);
    color-scheme: dark;
  }

  body {
    margin: 0;
    padding: 18px 20px 20px;
    min-width: 340px;
    background: var(--bg);
    color: var(--text);
    font: 400 13px/1.55 var(--font-sans);
  }
  /* App Settings idiom (.setting-row / .hint in renderer/index.html): label
     left, control right, muted explanation underneath — no card chrome, so
     label / hint / footer link share one left axis. No page heading either:
     the chrome://extensions dialog already titles this "Corpus". */
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  select {
    height: 28px; /* app --control-sm */
    padding: 0 8px;
    border: 1px solid var(--border-strong);
    border-radius: 6px; /* app --radius-sm */
    background: var(--field-bg);
    color: var(--text);
    font: 600 12px/1 var(--font-sans);
    transition: background var(--dur-hover) var(--ease-out), border-color var(--dur-hover);
  }
  select:hover { background: var(--hover); }
  select:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
  .hint {
    margin: 6px 0 0;
    color: var(--text-muted);
    font-size: 12px;
  }
  .foot {
    margin: 16px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .foot a {
    color: var(--accent-text);
    font-weight: 600;
    text-decoration: none;
  }
  .foot a:hover { text-decoration: underline; }
  .foot a:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); border-radius: 4px; }
</style>
<body>
  <div class="setting-row">
    <label for="theme" id="themeLabel">テーマ</label>
    <select id="theme">
      <option value="auto">システムに合わせる</option>
      <option value="light">ライト</option>
      <option value="dark">ダーク</option>
    </select>
  </div>
  <p class="hint" id="themeHint">保存バナーなど、SNSページ上の表示にも適用されます。</p>
  <p class="foot"><a href="diag.html" target="_blank" id="diagLink">診断ページを開く</a></p>
  <script src="options.js"></script>
</body>
</html>

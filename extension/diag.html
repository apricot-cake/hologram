<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Corpus 診断</title>
<style>
  /* App design language (design-tokens.css), ported as literals: this page is
     extension-origin so the app's custom properties don't exist here.
     Light/dark follows the browser via prefers-color-scheme alone — the
     extension has no theme pref of its own (see options.html). */
  :root {
    --bg: #f6f7f9;            /* gray-50 */
    --surface: #ffffff;       /* gray-0 */
    --text: #24282f;          /* gray-800 */
    --text-strong: #0c0e12;   /* gray-950 */
    --text-muted: #606673;    /* gray-550 */
    --border: #e4e7ec;        /* gray-150 */
    --border-strong: #d8dce2; /* gray-200 */
    --hover: #eceef2;         /* gray-100 */
    --active: #e4e7ec;        /* gray-150 */
    --field-bg: #eceef2;      /* gray-100 */
    --focus-ring: rgba(40, 168, 219, 0.45); /* sky-500 @45% */
    --font-sans: -apple-system, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Noto Sans JP', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Roboto Mono', 'Cascadia Code', Consolas, monospace;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --dur-hover: 0.18s;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f11;
      --surface: #16171a;
      --text: #dadce0;
      --text-strong: #f4f5f7;
      --text-muted: #8e9298;
      --border: #282a2e;
      --border-strong: #36383d;
      --hover: #2a2d33;
      --active: #34373d;
      --field-bg: #1a1c20;
      --focus-ring: rgba(40, 168, 219, 0.55);
      color-scheme: dark;
    }
  }

  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 400 13px/1.55 var(--font-sans);
  }
  .diag-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0;
    margin-right: auto;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-strong);
    letter-spacing: -0.012em;
  }
  button {
    height: 28px; /* app --control-sm */
    padding: 0 12px;
    border: 1px solid var(--border-strong);
    border-radius: 6px; /* app --radius-sm */
    background: var(--surface);
    color: var(--text);
    font: 600 12px/1 var(--font-sans);
    cursor: pointer;
    transition: background var(--dur-hover) var(--ease-out), border-color var(--dur-hover);
  }
  button:hover { background: var(--hover); }
  button:active { background: var(--active); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }

  pre {
    margin: 0;
    padding: 14px 16px;
    background: var(--field-bg);
    border: 1px solid var(--border);
    border-radius: 12px; /* app --radius-lg */
    font: 400 12px/1.55 var(--font-mono);
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-all;
    overflow: auto;
  }
  pre:empty::before { content: '…'; color: var(--text-muted); }
</style>
<body>
  <div class="diag-head">
    <h1>Corpus 診断</h1>
    <button id="rerun">再実行</button>
    <button id="clear">退避ログを消去</button>
  </div>
  <pre id="out">running…</pre>
  <script src="diag.js"></script>
</body>
</html>

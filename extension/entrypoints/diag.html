<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Hologram 診断</title>
<style>
  /* The app's design language, not a copy of it (#270): pages/diag.ts imports
     utils/tokens.generated.css, which is generated from the same sheet the
     desktop app renders with. Light/dark follows the browser via
     prefers-color-scheme alone — the extension has no theme pref of its own
     (see options.html). */
  :root {
    /* Both keywords: the buttons below are browser-drawn, and this is what tells
       the browser which pair of native colours to draw them with. */
    color-scheme: light dark;
  }

  body {
    margin: 0;
    padding: 24px;
    background: var(--hologram-page-bg);
    color: var(--hologram-ink);
    font: 400 13px/1.55 var(--hologram-font-sans);
  }
  .diag-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0;
    margin-right: auto;
    font-size: 16px;
    font-weight: 600;
    color: var(--hologram-ink-strong);
    letter-spacing: -0.012em;
  }
  button {
    height: 28px; /* app --control-sm */
    padding: 0 12px;
    border: 1px solid var(--hologram-border-strong);
    border-radius: 6px; /* app --radius-sm */
    background: var(--hologram-page-surface);
    color: var(--hologram-ink);
    font: 600 12px/1 var(--hologram-font-sans);
    cursor: pointer;
    transition: background var(--hologram-duration-base) var(--hologram-ease-out), border-color var(--hologram-duration-base);
  }
  button:hover { background: var(--hologram-hover); }
  button:active { background: var(--hologram-active); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--hologram-focus-ring); }

  pre {
    margin: 0;
    padding: 14px 16px;
    background: var(--hologram-hover);
    border: 1px solid var(--hologram-border);
    border-radius: 12px; /* app --radius-lg */
    font: 400 12px/1.55 var(--hologram-font-mono);
    color: var(--hologram-ink);
    white-space: pre-wrap;
    word-break: break-all;
    overflow: auto;
  }
  pre:empty::before { content: '…'; color: var(--hologram-ink-muted); }
</style>
<body>
  <div class="diag-head">
    <h1>Hologram 診断</h1>
    <button id="rerun">再実行</button>
    <button id="clear">退避ログを消去</button>
  </div>
  <pre id="out">running…</pre>
  <script type="module" src="../pages/diag.ts"></script>
</body>
</html>

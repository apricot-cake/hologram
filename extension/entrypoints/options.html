<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="manifest.open_in_tab" content="true">
<title>Hologram 設定</title>
<style>
  /* App design language (design-tokens.css), ported as literals — same token
     set as diag.html, trimmed to what this page uses. Light/dark follows the
     browser via prefers-color-scheme alone: the extension has no theme pref
     of its own (the on-page capture UI is a theme-independent scrim solid,
     and extension pages tracking the browser is exactly the no-mismatch
     behavior a pref could only break). Static text is Japanese fallback;
     options.js swaps it for the browser-locale _locales strings (chrome.i18n). */
  :root {
    --bg: #f6f7f9;            /* gray-50 */
    --text: #24282f;          /* gray-800 */
    --text-muted: #606673;    /* gray-550 */
    --focus-ring: rgba(40, 168, 219, 0.45); /* sky-500 @45% */
    --font-sans: -apple-system, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Noto Sans JP', system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f11;
      --text: #dadce0;
      --text-muted: #8e9298;
      --focus-ring: rgba(40, 168, 219, 0.55);
      color-scheme: dark;
    }
  }

  body {
    /* Opens as a full tab (manifest options_ui open_in_tab): a centered
       column at the app Settings pane's scale keeps the sparse content from
       stranding in the viewport. */
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px;
    background: var(--bg);
    color: var(--text);
    font: 400 13px/1.55 var(--font-sans);
  }
  /* The body background must still paint the whole viewport around the
     centered column. */
  html { background: var(--bg); }
  /* One setting row: the control leads, its explanation sits under the label
     in muted text (the app Settings pane's shape). */
  .row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin: 0 0 32px;
  }
  .row input { margin: 2px 0 0; }
  .row .desc {
    margin: 4px 0 0;
    color: var(--text-muted);
    font-size: 12px;
  }
  /* A setting with three mutually exclusive values is a radio group, not a
     switch plus a modifier: "off" and "when does it show" in separate controls
     would let the page display a combination that means nothing. */
  fieldset {
    margin: 0 0 32px;
    padding: 0;
    border: 0;
  }
  legend { padding: 0; }
  fieldset .desc {
    margin: 4px 0 10px;
    color: var(--text-muted);
    font-size: 12px;
  }
  fieldset .choice {
    display: flex;
    gap: 10px;
    align-items: baseline;
    margin: 0 0 6px;
  }
  fieldset .choice input { margin: 0; }
  /* The diagnostics link keeps its footnote-quiet styling: normal users never
     need diag, so it shouldn't read as a call to action. */
  .foot {
    margin: 0;
    font-size: 12px;
  }
  .foot a {
    color: var(--text-muted);
    text-decoration: underline; /* the one link affordance kept, so it can't be read as body text */
    text-underline-offset: 2px;
  }
  .foot a:hover { color: var(--text); }
  .foot a:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); border-radius: 4px; }
</style>
<body>
  <fieldset>
    <legend id="savedBadgeLabel">保存済みの投稿につける印</legend>
    <p class="desc" id="savedBadgeDesc">タイムライン上で、すでに Hologram に保存した投稿の画像に小さな印を表示します。判定はこのPCの中だけで行われます。</p>
    <div class="choice">
      <input type="radio" name="savedBadgeMode" id="savedBadgeModeAlways" value="always" checked>
      <label for="savedBadgeModeAlways" id="savedBadgeModeAlwaysLabel">常に表示</label>
    </div>
    <div class="choice">
      <input type="radio" name="savedBadgeMode" id="savedBadgeModeHover" value="hover">
      <label for="savedBadgeModeHover" id="savedBadgeModeHoverLabel">マウスを載せたときだけ表示</label>
    </div>
    <div class="choice">
      <input type="radio" name="savedBadgeMode" id="savedBadgeModeOff" value="off">
      <label for="savedBadgeModeOff" id="savedBadgeModeOffLabel">表示しない</label>
    </div>
  </fieldset>
  <div class="row">
    <input type="checkbox" id="hoverSaveButton" checked>
    <div>
      <label for="hoverSaveButton" id="hoverSaveLabel">画像にマウスを載せたら保存ボタンを出す</label>
      <p class="desc" id="hoverSaveDesc">まだ保存していない投稿の画像に、その場で保存できるボタンを表示します。保存されるのは画像そのものと投稿の情報（本文・作者・元URL）です。投稿の見た目のスクリーンショットが要るときは Alt+S の投稿キャプチャを使ってください。</p>
    </div>
  </div>
  <div class="row">
    <input type="checkbox" id="duplicateWarning" checked>
    <div>
      <label for="duplicateWarning" id="duplicateWarningLabel">同じものを保存しようとしたら確認する</label>
      <p class="desc" id="duplicateWarningDesc">すでに保存した画像をもう一度保存しようとしたときに、コピー・置換・スキップを選べる確認を出します。同じ投稿でも別の画像（漫画の次のページなど）なら確認は出ません。</p>
    </div>
  </div>
  <p class="foot"><a href="diag.html" target="_blank" id="diagLink">診断ページを開く</a></p>
  <script type="module" src="../pages/options.ts"></script>
</body>
</html>

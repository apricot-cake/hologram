<!doctype html>
<!-- lang="ja" is right for what is written below, which is the Japanese fallback
     for a file:// preview with no chrome.i18n. As an extension page the strings all
     get replaced from _locales, and utils/options.ts moves this along with them
     (#1057). -->
<html lang="ja">
<meta charset="utf-8">
<title>Hologram 設定</title>
<body class="settings-popup">
  <main class="page">
    <div class="page-head">
      <h1 id="pageTitle">Hologram 設定</h1>
    </div>

    <section>
      <h2 id="sectionTimeline">タイムライン上の表示</h2>
      <fieldset>
        <legend id="savedBadgeLabel">保存済みの投稿につける印</legend>
        <p class="desc" id="savedBadgeDesc">タイムライン上で、すでに Hologram に保存した投稿の画像に小さな印を表示します。判定はこのPCの中だけで行われます。</p>
        <div class="choice">
          <input type="radio" name="savedBadgeMode" id="savedBadgeModeAlways" value="always" checked>
          <label for="savedBadgeModeAlways" id="savedBadgeModeAlwaysLabel">常に表示</label>
        </div>
        <div class="choice">
          <input type="radio" name="savedBadgeMode" id="savedBadgeModeHover" value="hover">
          <label for="savedBadgeModeHover" id="savedBadgeModeHoverLabel">マウスを載せたときだけ表示</label>
        </div>
        <div class="choice">
          <input type="radio" name="savedBadgeMode" id="savedBadgeModeOff" value="off">
          <label for="savedBadgeModeOff" id="savedBadgeModeOffLabel">表示しない</label>
        </div>
      </fieldset>
      <div class="row">
        <input type="checkbox" id="hoverSaveButton" checked>
        <div>
          <label for="hoverSaveButton" id="hoverSaveLabel">投稿にマウスを載せたら保存ボタンを出す</label>
          <p class="desc" id="hoverSaveDesc">未保存の投稿ごとに保存ボタンを1つ表示します。投稿内の画像や動画をすべて、本文・投稿者・元 URL と一緒に保存します。画像や動画がない投稿も保存できます。</p>
        </div>
      </div>
    </section>

    <p class="foot"><a href="diag.html" target="_blank" id="diagLink">診断ページを開く</a></p>
  </main>
  <script type="module" src="../pages/popup.ts"></script>
</body>
</html>

<!DOCTYPE html>
<!-- lang is a placeholder, not the answer (#1057): src/app/root.tsx overwrites it
     with the language services/i18n.ts resolved (auto/ja/en) before the React mount
     it gates puts any text on screen. The value left here describes nothing — this
     document carries no prose of its own, and <title> is the product name. -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- No <meta> CSP here (#7). The policy is delivered as a RESPONSE HEADER:
       app/src/main/renderer-csp.ts owns the single policy string, the app://
       handler puts it on every response, and the dev server gets the same one
       via onHeadersReceived. That module also records what each directive is
       for and what was measured (#683). Delivering it here again would mean two
       policies intersecting, and the one directive this move exists to enable —
       frame-ancestors — is ignored in <meta> anyway. -->
  <title>Hologram</title>
  <!-- Design tokens (colours, type, spacing, elevation, light/dark) — the ONE stylesheet
       this document links. Everything that consumes them is a Tailwind utility written at
       its own element; there is no app stylesheet in here any more (#6), and with the
       legacy sheet gone there is no cascade layer left to declare either — Tailwind's own
       @layer order is the only one. The Tailwind sheet is bundled through
       src/app/index.tsx's globals.css import; in the production build (electron-vite
       build) it is extracted to a real asset and linked as
       <link rel="stylesheet" href="./assets/index-*.css"> in app/out/renderer/index.html
       (verified #683) — it does NOT need style-src 'unsafe-inline'. Only `electron-vite
       dev`'s Vite dev server injects CSS as a <style> tag for HMR, which is dev-only. -->
  <link rel="stylesheet" href="design-tokens.css">
  <script src="theme.js"></script>
</head>
<body>
  <!-- No markup at all (redesign §0-0⑥, completed by #621): src/app/root.tsx appends the
       single React host div and the AppShell (shell/AppShell.tsx) draws the tab bar,
       sidebar, toolbar, grid host and inspector. Every overlay is either a child of that
       root or portals onto document.body from its own component — no static containers
       left to portal into. -->

  <!-- All React components, React itself, the renderer service layer, AND the boot
       orchestrator in electron-vite's renderer bundle: src/app/index.tsx is the entry,
       which side-effect-imports every service, every component, then (last)
       services/orchestrator.ts + services/shell-ready.ts. orchestrator.ts owns
       data/state/event-delegation + the remaining window.hologram* bridges; each
       component subscribes and renders. Ordering is robust — orchestrator's body awaits
       hologramI18n so it stays deferred behind the synchronous component mounts, and
       components pull current state on mount. theme.js stays its own pre-paint <script>
       (head, above) — it must run before first paint, which this module script
       (deferred by spec) cannot guarantee. -->
  <script type="module" src="./src/app/index.tsx"></script>
</body>
</html>

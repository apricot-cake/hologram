<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' psimg: data: blob:; media-src 'self' psimg: blob:; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Corpus</title>
  <link rel="stylesheet" href="design-tokens.css">
  <script src="theme.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* --- Design tokens (colours, type, spacing, light/dark) live in
       design-tokens.css, linked above. Legacy var names (--fg / --muted /
       --border-soft …) are aliased there onto the new semantic tokens, so the
       rules below keep working while picking up the new palette + dark mode. --- */

    body {
      font: 14px/1.6 var(--font-sans);
      background: var(--bg); color: var(--fg);
      display: flex; min-height: 100vh; overflow-x: hidden;
    }

    /* --- Single left sidebar (Claude-Desktop style): brand + mode nav at the
       top, then the active mode's controls below. One column, no second rail. --- */
    #sidebar {
      width: 248px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; z-index: 30;
      background: var(--sidebar-bg); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 18px 10px 0; gap: 2px;
      overflow: hidden;   /* スクロールは内側の .sb-scroll が担当（アクティブバーは外側の固定フッター） */
    }
    /* Settings gear pinned bottom-left of the sidebar (title/theme button removed;
       theme moved into Settings). */
    .sidebar-footer { flex-shrink: 0; display: flex; align-items: center; margin: 4px -10px 0; padding: 8px 10px; border-top: 1px solid var(--border); }
    .icon-btn {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .12s, color .12s, border-color .12s;
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); border-color: var(--border-strong); }
    .icon-btn svg { width: 15px; height: 15px; }

    /* Settings overlay (opened by the brand-bar gear; floats above either mode) */
    .settings-view { position: fixed; inset: 0; z-index: 11000; background: var(--bg); overflow-y: auto; }
    .settings-view[hidden] { display: none; }
    .settings-view-inner { max-width: 720px; margin: 0 auto; padding: 20px 32px 56px; }
    .settings-view-head {
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: var(--bg); padding: 12px 0 14px;
      border-bottom: 1px solid var(--border-subtle); z-index: 1; margin-bottom: 4px;
    }
    .settings-view-title { font-size: var(--text-2xl); font-weight: var(--weight-semibold); color: var(--text-strong); }
    .settings-view-head .icon-btn { width: 30px; height: 30px; }
    .settings-view-head .icon-btn svg { width: 17px; height: 17px; }
    .settings-view #panelSettings { display: block; max-width: none; }
    /* Toggle switch (Settings → 外観) */
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--text); cursor: pointer; }
    .switch { position: relative; flex-shrink: 0; width: 38px; height: 22px; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch-track { position: absolute; inset: 0; background: var(--surface-3); border: 1px solid var(--border); border-radius: 999px; transition: background .15s, border-color .15s; }
    .switch-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-xs); transition: transform .15s; }
    .switch input:checked + .switch-track { background: var(--accent); border-color: var(--accent); }
    .switch input:checked + .switch-track::after { transform: translateX(16px); background: #fff; }
    .switch input:focus-visible + .switch-track { box-shadow: var(--ring); }
    .mode-nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      border: none; background: none; cursor: pointer; color: var(--fg);
      padding: 8px 10px; border-radius: 8px; font-size: 14px; font-weight: 500; text-align: left;
      transition: background .12s, color .12s;
    }
    .nav-item:hover { background: var(--hover); }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--muted); }
    .nav-item.active { background: var(--accent-subtle); color: var(--accent); }
    .nav-item.active svg { color: var(--accent); }
    .side-controls { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    /* スクロールするのは内側の .sb-scroll だけ。アクティブフィルタバーはその外側の
       固定フッターにして、スクロールバーがバーに被らないようにする。 */
    /* 左: ガター6px（チェックボックスの negative margin が overflow で見切れない
       よう padding 側に逃がす。位置は margin-left で相殺＝従来どおり）。
       右: コンテンツとスクロールバーの間に 8px の余白。 */
    .sb-scroll {
      flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
      margin-left: -6px; padding-left: 6px; padding-right: 8px; padding-bottom: 16px;
    }
    #sidebar select, #sidebar input.search-box { width: 100%; }

    #appMain { flex: 1; min-width: 0; }
    #mode-post { padding: 24px 32px; }

    /* --- Modern scrollbars (Chromium/Electron). NOTE: setting the standard
       `scrollbar-width` property disables these ::-webkit-scrollbar rules in
       Chromium, so style scrollable areas via padding, not scrollbar-width. --- */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in oklch, var(--text-subtle) 55%, transparent); border-radius: 8px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: color-mix(in oklch, var(--text-muted) 70%, transparent); background-clip: padding-box; }
    ::-webkit-scrollbar-corner { background: transparent; }

    #panelSettings { max-width: 720px; }

    /* The tab row was removed (one post view). #panelPosts keeps .tab-panel and
       #controls-posts keeps .tab-controls as the single always-active set. */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    /* Per-tab control set in the sidebar; only the active tab's controls show. */
    .tab-controls { display: none; }
    .tab-controls.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

    /* --- Toolbar (stacked in the sidebar) --- */
    .toolbar {
      display: flex; flex-direction: column; align-items: stretch; gap: 22px;
      margin-bottom: 22px;   /* same inter-section rhythm as .sb-section */
    }
    .toolbar select { width: 100%; }
    .toolbar .view-toggle, .toolbar > .chip, .toolbar .post-count { align-self: flex-start; }
    .toolbar .post-count { margin-left: 13px; }   /* bare text → the shared 23px axis */
    /* The toolbar is split into titled sections (検索/並び順/表示) like the filter
       sections below; space the controls inside each one. */
    #postsToolbar .sb-section { padding: 0; margin-bottom: 0; }
    #postsToolbar .sb-section > * + * { margin-top: 6px; }
    #postsToolbar .post-count { display: inline-block; }
    .toolbar-row {
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      margin-bottom: 12px;
    }
    .search-box {
      width: 100%; box-sizing: border-box;
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; outline: none; transition: border-color 0.15s;
    }
    .search-box:focus { border-color: var(--accent); }
    /* バックアップ設定のラジオ/チェック行 */
    .radio-line { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 4px 0; cursor: pointer; flex-wrap: wrap; }
    .radio-line input { cursor: pointer; }
    select {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; background: var(--surface); outline: none; cursor: pointer;
    }
    .post-count {
      font-size: 12px; color: var(--text-subtle);
    }

    /* --- Chip buttons --- */
    .chip {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 4px 14px; font-size: 13px; color: var(--text);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .date-input {
      padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; color: var(--text); outline: none; cursor: pointer;
    }
    .date-input:focus { border-color: var(--accent); }

    /* --- Selection bar (pinned at the sidebar top while ≥1 card is selected) --- */
    .selection-bar {
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      margin-bottom: 10px; padding: 10px 12px;
      background: var(--accent-subtle); border: 1px solid var(--accent-border);
      border-radius: 10px;
    }
    .selection-bar .post-count { color: var(--text); font-weight: 600; }

    /* --- Sidebar control readability: in dark mode the sidebar bg (--sidebar-bg)
       is LIGHTER than --surface, so surface-colored controls look sunken/dark.
       Raise them to --surface-3 + --border-strong (same fix as the sb-chips). --- */
    #sidebar .chip:not(.active), #sidebar select, #sidebar .search-box,
    #sidebar .date-input, #sidebar input[type="number"], #sidebar .sb-tag-filter,
    #sidebar .view-toggle button:not(.active), #sidebar .tile-size button, #sidebar .icon-btn {
      background: var(--surface-3); border-color: var(--border-strong); color: var(--text);
    }
    /* re-assert the accent hover/focus the block above would otherwise shadow */
    #sidebar .chip:not(.active):hover,
    #sidebar .view-toggle button:not(.active):hover, #sidebar .tile-size button:hover { border-color: var(--accent); color: var(--accent); }
    #sidebar .icon-btn:hover { background: var(--hover); }
    #sidebar .search-box:focus, #sidebar .date-input:focus, #sidebar input[type="number"]:focus, #sidebar .sb-tag-filter:focus { border-color: var(--accent); }
    /* checkbox rows: the BOX aligns with the control edge (same x as the pill
       chips above), like any other control in the column */
    .engagement-select {
      padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; color: var(--text); background: var(--surface); outline: none; cursor: pointer;
    }
    .engagement-input {
      width: 80px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; color: var(--text); outline: none;
    }
    .engagement-input:focus { border-color: var(--accent); }

    /* --- View toggle --- */
    .view-toggle {
      display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    .view-toggle button {
      background: var(--surface); border: none; padding: 6px 12px;
      cursor: pointer; color: var(--text-muted); font-size: 14px; line-height: 1;
      transition: all 0.15s;
    }
    .view-toggle button:not(:last-child) { border-right: 1px solid var(--border); }
    /* Monotone segmented control: the active segment is a lighter neutral fill,
       not the accent (an accent fill made it float against the monotone sidebar). */
    .view-toggle button.active { background: var(--border-strong); color: var(--text-strong); }

    /* Browser-style back/forward over the filter & view state */
    .hist-nav { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; align-self: flex-start; }
    .hist-nav button { background: var(--surface); border: none; padding: 4px 12px; cursor: pointer; color: var(--text-muted); font-size: 13px; line-height: 1; transition: background .12s, color .12s; }
    .hist-nav button:not(:last-child) { border-right: 1px solid var(--border); }
    .hist-nav button:hover:not(:disabled) { color: var(--accent); background: var(--hover); }
    .hist-nav button:disabled { opacity: .35; cursor: default; }

    /* Tile-size ± (shown only in the tile density) */
    .tile-size { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; align-self: flex-start; }
    .tile-size button { background: var(--surface); border: none; padding: 5px 12px; cursor: pointer; color: var(--text-muted); font-size: 14px; line-height: 1; transition: background .12s, color .12s; }
    .tile-size button:not(:last-child) { border-right: 1px solid var(--border); }
    .tile-size button:hover { color: var(--accent); background: var(--hover); }

    /* --- Post grid --- */
    .post-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .post-card {
      background: var(--surface); border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm);
      cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s;
      position: relative;
      /* Skip rendering offscreen cards (huge win for thousands of items, like
         the image grid). The intrinsic size is the per-density height estimate. */
      content-visibility: auto; contain-intrinsic-size: auto 360px;
    }
    .post-card:hover { box-shadow: var(--shadow-md); border-color: var(--border); }
    .post-card img {
      width: 100%; display: block;
      max-height: 300px; object-fit: cover; cursor: zoom-in;
    }
    .open-btn {
      position: absolute; top: 8px; right: 72px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.15s;
      z-index: 1;
    }
    .open-btn:hover { background: color-mix(in oklch, var(--accent) 82%, transparent); }
    .post-card:hover .open-btn { opacity: 1; }
    .post-meta {
      padding: 12px;
    }
    .post-meta .user {
      font-weight: 600; font-size: 13px;
      margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .platform-badge {
      font-size: 10px; font-weight: 500;
      padding: 1px 6px; border-radius: 3px;
      color: #fff; text-transform: uppercase;
    }
    .platform-badge.x { background: var(--brand-x); color: var(--surface); }
    .platform-badge.bluesky { background: #0085ff; }
    .platform-badge.misskey { background: #96d04a; color: #16191e; }
    .platform-badge.mastodon { background: #6364ff; }
    .platform-badge.pixiv { background: #0096fa; }
    .post-meta .text {
      font-size: 13px; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 6px; cursor: pointer;
    }
    .post-meta .text.expanded {
      -webkit-line-clamp: unset; display: block;
    }
    .post-meta .text { position: relative; }
    .text-hint {
      position: absolute; bottom: 0; right: 0;
      font-size: 10px; color: var(--text-subtle);
      background: color-mix(in oklch, var(--surface) 88%, transparent); padding: 0 4px;
      border-radius: 3px; pointer-events: none;
      display: none;
    }
    .post-meta .text.truncated:hover .text-hint { display: block; }
    .post-meta .text.expanded .text-hint { display: none; }
    .post-meta .stats {
      display: flex; gap: 12px; font-size: 12px; color: var(--text-subtle);
    }
    .post-meta .date {
      font-size: 11px; color: var(--text-subtle); margin-top: 4px;
    }

    /* --- Delete button on card --- */
    .delete-btn {
      position: absolute; top: 8px; right: 8px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff; border: none;
      font-size: 16px; line-height: 28px; text-align: center;
      cursor: pointer; opacity: 0; transition: opacity 0.15s;
      z-index: 1;
    }
    .delete-btn:hover { background: color-mix(in oklch, var(--danger) 82%, transparent); }
    .post-card:hover .delete-btn { opacity: 1; }
    .post-card.selected { outline: 3px solid var(--accent); outline-offset: -3px; }
    /* ○ select ring — the ONLY selection entry point. A hollow white ring with a
       soft dark halo (visible on any image), top-left, shown on hover; fills with
       the accent + ✓ once selected (selected cards keep it shown). */
    .post-card .select-check {
      position: absolute; top: 8px; left: 8px;
      width: 22px; height: 22px; border-radius: 50%;
      background: transparent; border: 2px solid #fff;
      box-shadow: 0 0 2px 1px rgba(0,0,0,0.45);
      opacity: 0; transition: opacity .1s, background .1s;
      display: flex; cursor: pointer; z-index: 5;
      align-items: center; justify-content: center;
    }
    .post-card:hover .select-check { opacity: 1; }
    .post-card.selected .select-check { opacity: 1; background: var(--accent); border-color: #fff; }
    /* sharp geometric check drawn with borders (matches image-view; no ✓ glyph) */
    .post-card.selected .select-check::after {
      content: ''; width: 5px; height: 9px; margin-top: -1px;
      border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    /* Selection mode (≥1 selected): clicking anywhere on a card toggles it, so
       every ring stays visible and the per-card hover actions step aside. */
    .post-grid.selecting .select-check { opacity: 1; }
    .post-grid.selecting .delete-btn, .post-grid.selecting .edit-btn,
    .post-grid.selecting .info-btn, .post-grid.selecting .fold-btn,
    .post-grid.selecting .open-btn { display: none; }
    .post-grid.selecting:not(.tile-view) .card-ntag { opacity: 0; }
    /* every click selects now — plain pointer everywhere (no zoom-in over images,
       no "click to expand" hint on the text) */
    .post-grid.selecting .post-card, .post-grid.selecting .post-card img { cursor: pointer; }
    .post-grid.selecting .post-meta .text.truncated:hover .text-hint { display: none; }

    /* --- List view: text-first (scanning post text is the point of the list) --- */
    .post-grid.list-view {
      display: flex; flex-direction: column; gap: 4px;
      grid-template-columns: unset;
    }
    .post-grid.list-view .post-card {
      display: flex; flex-direction: row; border-radius: 6px;
      overflow: hidden; align-items: stretch;
      contain-intrinsic-size: auto 104px;
    }
    .post-grid.list-view .post-card img {
      width: 88px; min-width: 88px; align-self: stretch;
      height: auto; max-height: 110px; object-fit: cover;
    }
    .post-grid.list-view .post-meta {
      display: flex; flex-wrap: wrap; align-items: baseline;
      gap: 3px 10px; padding: 9px 14px; flex: 1; min-width: 0;
    }
    /* text is the hero: full width, up to 2 lines, darker and a touch larger */
    .post-grid.list-view .post-meta .text {
      order: 0; flex-basis: 100%; width: 100%;
      -webkit-line-clamp: 2; margin-bottom: 2px;
      font-size: 14px; line-height: 1.45; color: var(--text-strong);
    }
    /* secondary line: user · stats · date, small and muted */
    .post-grid.list-view .post-meta .user {
      order: 1; margin-bottom: 0; white-space: nowrap;
      font-size: 12px; font-weight: 500; color: var(--text-muted);
    }
    .post-grid.list-view .post-meta .stats { order: 2; white-space: nowrap; font-size: 11px; }
    .post-grid.list-view .post-meta .date { order: 3; white-space: nowrap; margin-top: 0; margin-left: auto; }
    .post-grid.list-view .post-meta .date-captured { display: none; }
    .post-grid.list-view .post-meta .tags-label { display: none; }
    .post-grid.list-view .delete-btn { top: 50%; right: 8px; transform: translateY(-50%); }
    .post-grid.list-view .open-btn { top: 50%; right: 72px; transform: translateY(-50%); }

    /* --- Tile density: a post-card with its info section hidden + a compact
       author/❤ overlay on the image. Purely presentational (reuses the card's
       buttons + select), so card⇄tile⇄list is just like grid/list. --- */
    .post-grid.tile-view {
      grid-template-columns: repeat(auto-fill, minmax(var(--tile-size, 180px), 1fr));
      gap: 8px;
    }
    .post-grid.tile-view .post-card { aspect-ratio: 1; border-color: var(--border); box-shadow: none; contain-intrinsic-size: auto var(--tile-size, 180px); }
    .post-grid.tile-view .post-card:hover { box-shadow: var(--shadow-md); }
    .post-grid.tile-view .card-img { width: 100%; height: 100%; max-height: none; object-fit: cover; }
    .post-grid.tile-view .post-meta { display: none; }
    .card-overlay, .card-ntag { display: none; }
    /* Card / list view: show the ×N image-count badge on the thumbnail's top-left
       (top-right is the hover action row; the selection check only appears when
       selected, so it takes the corner then). */
    .post-grid:not(.tile-view) .card-ntag {
      display: block; position: absolute; top: 8px; left: 8px; z-index: 1;
      padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600;
      background: rgba(0,0,0,0.72); color: #fff; transition: opacity .1s;
    }
    /* the ○ select ring shares the top-left corner: it takes over on hover */
    .post-grid:not(.tile-view) .post-card:hover .card-ntag { opacity: 0; }
    .post-card.selected .card-ntag { display: none; }
    .post-grid.tile-view .card-overlay {
      display: flex; align-items: center; gap: 8px;
      position: absolute; left: 0; right: 0; bottom: 0; padding: 8px;
      background: var(--scrim-grad); color: #fff; font-size: 11px; pointer-events: none;
    }
    .post-grid.tile-view .card-overlay .ov-author { flex: 1; min-width: 0; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-grid.tile-view .card-overlay .ov-likes { flex-shrink: 0; }
    /* tile info overlay is optional (表示 > タイルに情報を表示) */
    .post-grid.tile-view.no-overlay .card-overlay { display: none; }
    /* the ❤ count on tiles only matters while sorting/filtering by engagement */
    .post-grid.tile-view .card-overlay .ov-likes { display: none; }
    .post-grid.tile-view.show-eng .card-overlay .ov-likes { display: block; }
    .post-grid.tile-view .card-ntag {
      display: block; position: absolute; top: 6px; right: 6px; z-index: 2;
      padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 600;
      background: rgba(0,0,0,0.8); color: #fff; transition: opacity .1s;
    }
    .post-grid.tile-view .post-card:hover .card-ntag { opacity: 0; }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-subtle);
    }
    .empty-state p { margin-bottom: 8px; }

    /* --- Settings --- */
    .section {
      background: var(--surface); border-radius: 8px;
      padding: 16px 20px; margin-bottom: 16px;
      border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm);
    }
    .section h2 {
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 13px; color: var(--text); margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; outline: none; transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .hint { font-size: 12px; color: var(--text-subtle); margin-top: 6px; }
    .actions { display: flex; align-items: center; margin-top: 16px; }
    .link-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }

    /* --- Buttons --- */
    .btn {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 8px 20px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-outline {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 16px; font-size: 13px;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger {
      background: var(--surface); color: var(--danger); border: 1px solid var(--danger);
      border-radius: 6px; padding: 7px 16px; font-size: 13px;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-danger:hover { background: var(--danger-bg); }

    .status-msg {
      font-size: 13px; margin-left: 12px;
      opacity: 0; transition: opacity 0.2s;
    }
    .status-msg.show { opacity: 1; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* --- Data management --- */
    .data-section {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .data-hint {
      width: 100%; font-size: 12px; color: var(--text-subtle); margin-top: 8px;
    }
    .file-input-hidden { display: none; }

    /* --- Image lightbox --- */
    .lightbox-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 11000;
      justify-content: center; align-items: center;
      cursor: zoom-out;
    }
    .lightbox-overlay.show { display: flex; }
    .lightbox-overlay img, .lightbox-overlay video {
      max-width: 95vw; max-height: 95vh; object-fit: contain;
      border-radius: 4px;
    }
    .card-video { display: flex; align-items: center; justify-content: center; min-height: 120px; background: var(--surface-2); color: var(--text-muted); font-size: 30px; cursor: pointer; }
    .lb-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 48px; height: 64px; border: none; border-radius: 6px;
      background: rgba(0,0,0,0.4); color: #fff; font-size: 32px; line-height: 1;
      cursor: pointer; z-index: 11001; display: none;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.18); }
    .lb-prev { left: 16px; }
    .lb-next { right: 16px; }
    .lightbox-overlay.multi .lb-nav { display: block; }
    .lb-counter {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 13px; background: rgba(0,0,0,0.4);
      padding: 4px 10px; border-radius: 12px; display: none;
    }
    .lightbox-overlay.multi .lb-counter { display: block; }

    /* --- Original-media thumbnail strip (grid view) --- */

    /* --- Delete confirm --- */
    .confirm-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 10000;
      justify-content: center; align-items: center;
    }
    .confirm-overlay.show { display: flex; }
    .confirm-box {
      background: var(--surface); border-radius: 12px;
      padding: 24px; max-width: 360px; text-align: center;
      border: 1px solid var(--border); box-shadow: var(--shadow-lg);
    }
    .confirm-box p { margin-bottom: 16px; font-size: 14px; }
    .confirm-box .confirm-actions { display: flex; gap: 8px; justify-content: center; }

    /* --- Tags --- */
    .tags-label { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .tag-chip { font-size: 10px; background: var(--surface-3); border-radius: 10px; padding: 1px 8px; color: var(--text-muted); }
    /* タグ編集ダイアログ: チップクリック＝削除なので、ホバーで控えめな赤に
       （srgb 混合 — oklch でサーフェスと混ぜると紫に寄って見える） */
    #editTagsList .tag-chip:hover { background: color-mix(in srgb, var(--red-500) 20%, transparent); color: var(--danger); }
    .post-flags { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 2px; }
    .post-flag { font-size: 10px; border-radius: 3px; padding: 1px 6px; line-height: 1.5; }
    .post-flag.flag-type { background: var(--tint-purple-bg); color: var(--text); }
    .post-flag.flag-media { background: var(--tint-blue-bg); color: var(--text); }
    .post-grid.list-view .post-meta .post-flags { order: 1; margin: 0; }
    .edit-btn {
      position: absolute; top: 8px; right: 40px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.15s;
      z-index: 1;
    }
    .edit-btn:hover { background: color-mix(in oklch, var(--accent) 82%, transparent); }
    .post-card:hover .edit-btn { opacity: 1; }
    .post-grid.list-view .edit-btn { top: 50%; right: 40px; transform: translateY(-50%); }

    /* --- 📁 add-to-default-folder button on card (one-click from hover) --- */
    .fold-btn {
      position: absolute; top: 8px; right: 104px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff; border: none; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.15s, background 0.15s;
      z-index: 1;
    }
    .fold-btn:hover { background: color-mix(in oklch, var(--accent) 82%, transparent); }
    .post-card:hover .fold-btn { opacity: 1; }
    /* membership ('in') tints the button blue but does NOT keep it visible at
       rest — like every other card action it appears on hover only */
    .fold-btn.in { background: var(--accent); }
    /* clicking an .in button REMOVES from the folder → plain red on hover
       (srgb mix: an oklch mix with the dark surface read as purple) */
    .fold-btn.in:hover { background: var(--danger); }
    .fold-btn.added { background: var(--success); }
    /* Right-click menu on 📁: pick the destination folder / set the default (★) */
    .fold-menu {
      position: fixed; z-index: 12000; min-width: 180px; max-width: 260px;
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 8px; box-shadow: var(--shadow-pop); padding: 4px; display: none;
    }
    .fold-menu.show { display: block; }
    .fold-menu .fm-row {
      display: flex; align-items: center; gap: 6px; padding: 5px 8px;
      border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--text);
    }
    .fold-menu .fm-row:hover { background: var(--hover); }
    .fm-star { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 13px; line-height: 1; padding: 0 2px; border-radius: 4px; }
    .fm-star:hover { color: var(--fg); background: var(--active); }
    .fm-star.on { color: var(--fg); }
    .fm-name { flex: 1; word-break: break-word; }
    .fm-check { color: var(--accent); flex-shrink: 0; }
    .fm-sep { height: 1px; background: var(--border); margin: 4px 2px; }
    .fm-manage { color: var(--accent); }
    .post-grid.list-view .fold-btn { top: 50%; right: 104px; transform: translateY(-50%); }

    /* --- ℹ detail-popup button on card (ported from image-view) --- */
    .info-btn {
      position: absolute; top: 8px; right: 136px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff; border: none; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.15s;
      z-index: 1;
    }
    .info-btn:hover { background: color-mix(in oklch, var(--accent) 82%, transparent); }
    .post-card:hover .info-btn { opacity: 1; }
    .post-grid.list-view .info-btn { top: 50%; right: 136px; transform: translateY(-50%); }

    /* --- Query field --- */
    .query-field-row { margin-bottom: 12px; }
    .query-field {
      display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
      min-height: 36px; padding: 4px 8px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    }
    .query-chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
    .query-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--surface-3); border: 1px solid var(--border); border-radius: 14px;
      padding: 3px 10px; font-size: 12px; color: var(--text);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .query-chip:hover { background: var(--hover); border-color: var(--border-strong); }
    .query-chip.qc-platform { background: var(--tint-blue-bg); border-color: var(--tint-blue-bd); }
    .query-chip.qc-postType { background: var(--tint-purple-bg); border-color: var(--tint-purple-bd); }
    .query-chip.qc-date { background: var(--tint-green-bg); border-color: var(--tint-green-bd); }
    .query-chip.qc-engagement { background: var(--tint-orange-bg); border-color: var(--tint-orange-bd); }
    .query-chip.qc-media { background: var(--tint-blue-bg); border-color: var(--tint-blue-bd); }
    .query-add-btn {
      background: none; border: 1px solid var(--border); border-radius: 50%;
      width: 28px; height: 28px; font-size: 16px; line-height: 26px;
      color: var(--text-subtle); cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    .query-add-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* --- Filter menus --- */
    .qf-menu, .qf-submenu {
      position: fixed; background: var(--surface); border-radius: 8px;
      box-shadow: var(--shadow-pop); border: 1px solid var(--border); padding: 4px 0;
      z-index: 1000; min-width: 160px;
    }
    .qf-menu-item {
      padding: 8px 16px; font-size: 13px; color: var(--text);
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    }
    .qf-menu-item:hover { background: var(--hover); }
    .qf-menu-item .arrow { color: var(--text-subtle); font-size: 10px; }

    /* --- Popovers --- */
    .qf-popover {
      position: fixed; background: var(--surface); border-radius: 10px;
      box-shadow: var(--shadow-pop); border: 1px solid var(--border); padding: 16px;
      z-index: 1001; min-width: 260px;
    }
    .qf-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 999; background: transparent;
    }

    /* --- App layout: persistent left sidebar (nav + controls) + content --- */
    .app-layout {
      display: flex; gap: 24px; align-items: flex-start;
    }
    .app-sidebar {
      width: 250px; flex-shrink: 0;
      /* Match body's 24px top padding so the sticky bar doesn't jump up / crowd
         the tabs against the window edge when the content scrolls. */
      position: sticky; top: 24px; align-self: flex-start;
      max-height: calc(100vh - 24px); overflow-y: auto; overflow-x: hidden;
      padding-right: 8px;
    }
    .app-sidebar input, .app-sidebar select {
      max-width: 100%; box-sizing: border-box;
    }
    .app-content { flex: 1; min-width: 0; }

    /* フラットなサイドバー: セクションごとの白カード/影は低コントラストでノイズだったので撤去。
       見出し(sb-title)だけでグループを区切る。 */
    /* One left text-axis for the whole sidebar: boxed controls (search/select/
       date) start their text at 10(sidebar pad)+1(border)+12(inner pad)=23px, so
       bare text (titles, subtitles, counts) gets a 13px indent to land on the
       same axis, and pills use a 12px inner pad. */
    /* Rhythm: generous space BETWEEN sections, tight spacing inside them
       (title→content 6px, rows 4-8px) — Linear-style grouping. */
    .sb-section { padding: 0; margin-bottom: 22px; }
    .sb-title {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 6px; padding-left: 13px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .sb-manage-link {
      font-size: 10px; font-weight: 500; color: var(--accent); background: none; border: none;
      cursor: pointer; padding: 0; text-transform: none; letter-spacing: 0;
    }
    .sb-manage-link:hover { text-decoration: underline; }
    /* Active-filter bar pinned to the sidebar bottom (sticky). Holds the active filter
       pills + AND/OR toggle + reset. Shown only when at least one filter is active. */
    /* アクティブフィルタバーは .sb-scroll の外側の固定フッター（スクロールしない）。
       sticky をやめたことでスクロール時の再描画も無くなる＝カクつき低減。 */
    .sb-activebar {
      flex-shrink: 0; margin: 8px -10px 0; padding: 8px 10px;
      background: var(--surface); border-top: 1px solid var(--border);
    }
    /* Active-filter bar pinned to the top of the content area (scroll-following). */
    .content-activebar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: -24px -32px 16px; padding: 10px 32px;
      background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .content-activebar .sb-activebar-title { flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .content-activebar #queryChips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
    .content-activebar .sb-reset, .content-activebar .iv-andor { flex-shrink: 0; }
    .sb-activebar-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .sb-activebar-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; flex: 1; }
    .sb-reset { font-size: 10px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--muted); cursor: pointer; }
    .sb-reset:hover { border-color: var(--accent); color: var(--accent); }
    /* 値が入っているフィルタ欄の強調（検索・数値・日付） */
    /* 値が入っている欄の強調はパステルに（強い青の二重リングは主張しすぎ） */
    .has-value {
      border-color: color-mix(in oklch, var(--accent) 45%, var(--border)) !important;
      box-shadow: 0 0 0 2px color-mix(in oklch, var(--accent) 14%, transparent);
    }
    /* Collapsible sections: click the title to fold the chips. A ▾/▸ marker leads the title. */
    .sb-section.collapsible > .sb-title { cursor: pointer; user-select: none; display: block; position: relative; }
    .sb-section.collapsible > .sb-title::after { content: '▾'; font-size: 9px; color: var(--muted); margin-left: 6px; display: inline-block; }
    .sb-section.collapsible.collapsed > .sb-title::after { content: '▸'; }
    .sb-section.collapsible > .sb-title > .sb-manage-link { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
    .sb-section.collapsed > :not(.sb-title) { display: none; }
    .sb-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .sb-tag-filter {
      width: 100%; margin-bottom: 6px; padding: 5px 12px;
      border: 1px solid var(--border); border-radius: 6px; font-size: 12px; outline: none;
    }
    .sb-tag-filter:focus { border-color: var(--accent); }
    .sb-chip {
      background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 12px;
      padding: 3px 12px; font-size: 11px; color: var(--text);
      cursor: pointer; white-space: nowrap;
      /* transition: all はスクロール時のスタイル再計算を重くするので対象プロパティを限定 */
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .sb-chip:hover { border-color: var(--accent); color: var(--accent); }
    .sb-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    /* tag chips cycle 解除→いずれか(OR)→すべて含む(AND): AND = darker fill + ＋ prefix */
    .sb-chip.active.and { background: color-mix(in oklch, var(--accent) 72%, black); border-color: color-mix(in oklch, var(--accent) 72%, black); }

    .sb-active-chip {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 12px; padding: 2px 8px; font-size: 11px;
      cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
    }
    .sb-active-chip:hover { opacity: 0.7; }
    .sb-active-chip.qc-platform { background: var(--tint-blue-bg); border: 1px solid var(--tint-blue-bd); color: var(--text); }
    .sb-active-chip.qc-postType { background: var(--tint-purple-bg); border: 1px solid var(--tint-purple-bd); color: var(--text); }
    .sb-active-chip.qc-date { background: var(--tint-green-bg); border: 1px solid var(--tint-green-bd); color: var(--text); }
    .sb-active-chip.qc-engagement { background: var(--tint-orange-bg); border: 1px solid var(--tint-orange-bd); color: var(--text); }
    .sb-active-chip.qc-tag { background: var(--tint-olive-bg); border: 1px solid var(--tint-olive-bd); color: var(--text); }
    .sb-active-chip.qc-media { background: var(--tint-blue-bg); border: 1px solid var(--tint-blue-bd); color: var(--text); }
    .sb-active-chip.qc-user { background: var(--tint-pink-bg); border: 1px solid var(--tint-pink-bd); color: var(--text); }
    .sb-active-chip.qc-img { background: var(--hover); border: 1px solid var(--border); color: var(--fg); }
    .sb-active-chip.qc-kind { background: var(--surface-3); border: 1px solid var(--border); color: var(--text); }
    /* 検索/フォルダの特殊ピル: 裸テキストだったのでチップ化（角丸の四角） */
    .sb-active-chip.qc-search, .sb-active-chip.qc-folder {
      background: var(--surface-3); border: 1px solid var(--border-strong);
      color: var(--text); border-radius: 6px;
    }
    /* タグ式のフィールド分け: 「かつ:」グループ ⟨接続トグル⟩ 「または:」グループ。
       接続トグルは両グループがあるときだけ現れ、クリックで かつ⇄または。 */
    .qc-join-label { font-size: 10px; font-weight: 600; color: var(--text-muted); margin: 0 1px 0 6px; align-self: center; }
    .qc-join-toggle {
      font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 10px;
      border: 1px solid var(--accent-border); background: var(--accent-subtle);
      color: var(--accent-subtle-fg); cursor: pointer; margin: 0 4px;
      transition: background .12s, color .12s, border-color .12s;
    }
    .qc-join-toggle:hover { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .sb-subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; padding-left: 13px; }
  /* 🔍 toggle sitting right next to a section title: reveals that section's
     filter input (tags / authors). margin-right:auto keeps it adjacent to the
     title text instead of being pushed to the far right by space-between. */
  .sb-search-ico {
    display: inline-flex; align-items: center; margin-right: auto;
    background: none; border: none; padding: 2px; border-radius: 4px;
    color: var(--text-muted); cursor: pointer;
  }
  .sb-search-ico:hover, .sb-search-ico.active { color: var(--accent); }
  /* Sub-section block (開始日/終了日 etc.): indented with a guide line sitting on
     the 23px text axis, labels at readable contrast. */
  .sb-sub {
    display: flex; flex-direction: column; gap: 2px;
    margin-left: 13px; padding-left: 10px;
    border-left: 2px solid var(--border-strong);
  }
  .sb-sublabel { font-size: 11px; color: var(--text-muted); }
  .sb-sub .date-input { width: 100%; }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div id="side-post" class="side-controls">
      <!-- Posts controls (the only post-mode view; hashtags/users folded into the
           sidebar's タグ/作者 sections + search, settings moved to the gear) -->
      <div class="tab-controls active" id="controls-posts">
        <!-- Selection bar: pinned at the very top of the sidebar (outside the
             scroll area) so the bulk actions stay reachable while scrolling. -->
        <div class="selection-bar" id="selectionBar" style="display:none;">
          <span class="post-count" id="selectedCount"></span>
          <button class="chip" id="selectAllBtn"></button>
          <button class="chip" id="tagSelectedBtn"></button>
          <button class="chip" id="folderSelectedBtn"></button>
          <button class="chip" id="groupSelectedBtn"></button>
          <button class="chip" id="deleteSelectedBtn" style="background:var(--danger);color:#fff;border-color:var(--danger);"></button>
          <button class="chip" id="cancelSelectBtn"></button>
        </div>
        <div class="sb-scroll">
        <div class="toolbar" id="postsToolbar">
          <!-- Browser-style history over the filter/view state -->
          <div class="hist-nav">
            <button id="histBack" type="button" title="戻る" disabled>←</button>
            <button id="histFwd" type="button" title="進む" disabled>→</button>
          </div>
          <div class="sb-section">
            <div class="sb-title" id="sbViewTitle"></div>
            <div class="view-toggle">
              <button data-view="card" id="viewCard" class="active"></button>
              <button data-view="tile" id="viewTile"></button>
              <button data-view="list" id="viewList"></button>
            </div>
            <div class="tile-size" id="tileSizeRow" style="display:none">
              <button id="tileMinus" type="button" title="小さく">−</button>
              <button id="tilePlus" type="button" title="大きく">＋</button>
            </div>
            <label class="iv-check" id="tileOverlayRow" style="display:none;margin-top:2px;"><input type="checkbox" id="tileOverlayToggle" checked> <span id="tileOverlayLabel"></span></label>
            <span class="post-count" id="postCount"></span>
          </div>
          <div class="sb-section">

  <!-- Styles that began life in the (now-removed) image-view but are reused by the
       unified post-view: ℹ detail popup, AND/OR tag toggle, folder chips +
       management modal, toast, and the multi-image / group-expand checkboxes.

       away with that view. -->
  <style>
    .iv-tagn { opacity: .55; margin-left: 4px; font-size: 10px; }
    .iv-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg); cursor: pointer; margin-bottom: 8px; }
    .iv-htbtn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--fg); transition: all .15s; }
    .iv-htbtn:hover { border-color: var(--accent); color: var(--accent); }
    .iv-htbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .iv-htbtn:disabled { opacity: .5; cursor: default; }

    /* Detail popup (ℹ action): centered modal over a dim backdrop. */
    .iv-detail-overlay {
      position: fixed; inset: 0; z-index: 11000; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .iv-detail-overlay[hidden] { display: none; }
    .iv-detail-box {
      background: var(--surface); color: var(--fg); border-radius: 12px;
      padding: 18px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
      font-size: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-lg);
    }
    .iv-insp-close { float: right; border: none; background: none; font-size: 18px; line-height: 1; color: var(--muted); cursor: pointer; }
    .iv-insp-close:hover { color: var(--fg); }
    .iv-insp-title { font-size: 13px; font-weight: 600; line-height: 1.5; word-break: break-word; margin-bottom: 8px; padding-right: 20px; }
    .iv-insp-thumb { width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; display: block; }
    .iv-insp-row { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border-soft); }
    .iv-insp-k { color: var(--muted); flex: 0 0 72px; }
    .iv-insp-v { flex: 1; word-break: break-word; }
    .iv-insp-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .iv-insp-tag { background: var(--hover); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: var(--text-muted); }
    .iv-insp-open { display: inline-block; margin-top: 12px; color: var(--accent); cursor: pointer; }
    .iv-insp-open:hover { text-decoration: underline; }

    /* AND/OR toggle for multi-select filters (tags) */
    .iv-andor { font-size: 11px; font-weight: 600; padding: 2px 9px; border: 1px solid var(--accent-border); border-radius: 10px; background: var(--accent-subtle); color: var(--accent-subtle-fg); cursor: pointer; margin-left: 4px; vertical-align: middle; white-space: nowrap; transition: background .12s, color .12s, border-color .12s; }
    .iv-andor:hover { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
    .iv-andor.or { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

    /* Folder chips (★ default) + management modal */
    .iv-foldstar { color: var(--muted); margin-right: 3px; }
    .sb-chip.active .iv-foldstar { color: #fff; }
    .iv-folder-new { display: flex; gap: 6px; margin: 10px 0; }
    .iv-folder-new .search-box { flex: 1; }
    .iv-folder-list { display: flex; flex-direction: column; gap: 2px; }
    .iv-folder-empty { color: var(--muted); font-size: 12px; padding: 10px 2px; }
    .iv-folder-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--border-soft); }
    .iv-fold-name { flex: 1; word-break: break-word; }
    .iv-fold-n { color: var(--muted); font-size: 11px; }
    .iv-fold-def, .iv-fold-btn { border: none; background: none; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 5px; color: var(--muted); }
    .iv-fold-def:hover, .iv-fold-btn:hover { background: var(--hover); }
    .iv-fold-def.on { color: var(--fg); }
    .iv-folder-modalhint { margin-top: 12px; color: var(--muted); font-size: 11px; }

    /* transient toast (e.g. "added to folder") — shared, top-level, fixed */
    .iv-toast {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(8px);
      background: rgba(0,0,0,0.86); color: #fff; padding: 9px 18px; border-radius: 20px;
      font-size: 13px; z-index: 12000; opacity: 0; pointer-events: none;
      transition: opacity .15s, transform .15s; box-shadow: var(--shadow-pop);
    }
    .iv-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  <!-- Motion: tasteful, fast entrance/open animations layered on top of the
       existing hover transitions. Card entrance plays only on a fresh render
       (viewer.js adds .anim-in; load-more / reduced-motion skip it). Everything
       is neutralized under prefers-reduced-motion. -->
  <style>
    @keyframes corpusCardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes corpusFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes corpusPopIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes corpusSlideIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

    /* Card entrance — only when the grid is (re)built fresh, e.g. filter/sort/search. */
    .post-grid.anim-in .post-card { animation: corpusCardIn .26s ease-out both; }

    /* Detail popup (ℹ): backdrop fades, box pops in. Replays on each open because
       removing [hidden] re-mounts the element (display:none -> flex). */
    .iv-detail-overlay:not([hidden]) { animation: corpusFadeIn .16s ease-out; }
    .iv-detail-overlay:not([hidden]) .iv-detail-box { animation: corpusPopIn .2s ease-out; }

    /* Lightbox: backdrop fades on open; the slide itself animates via .lb-in
       (viewer.js restarts it on open AND on prev/next for a consistent feel). */
    .lightbox-overlay.show { animation: corpusFadeIn .16s ease-out; }
    .lightbox-overlay .lb-in { animation: corpusSlideIn .2s ease-out; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>

  <!-- Settings overlay: #panelSettings is relocated into here by viewer.js so it
       floats above either mode (the gear opens it from anywhere). -->
  <div id="settingsView" class="settings-view" hidden>
    <div class="settings-view-inner">
      <div class="settings-view-head">
        <h1 class="settings-view-title" id="settingsViewTitle">設定</h1>
        <button id="settingsClose" class="icon-btn" type="button" aria-label="閉じる" title="閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <!-- #panelSettings is appended here at runtime -->
    </div>
  </div>

  <script src="../vendor/jszip.min.js"></script>
  <script src="i18n.js"></script>
  <script src="folders.js"></script>
  <script src="search.js"></script>
  <script src="viewer.js"></script>
  <script src="shell.js"></script>
</body>

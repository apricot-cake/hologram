    .itv-stage { flex: 1; position: relative; overflow: hidden; display: flex; min-width: 0; }
    .itv-media { max-width: 100%; max-height: 100%; object-fit: contain; }
    /* react-zoom-pan-pinch's own stylesheet sets pointer-events:none on every
       img inside the content box (native img-drag protection), which silently
       killed the double-click fit-toggle AND the grab cursor for real input.
       The img is draggable={false}, so receiving events is safe. The library
       CSS loads after this sheet (injected by app.js) — outrank it via .itv-tc. */
    .itv-tc img.itv-media { pointer-events: auto; }
    img.itv-media { cursor: grab; }
    img.itv-media:active { cursor: grabbing; }
    .itv-video { margin: auto; }
    .itv-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 40px; height: 56px; border: none; border-radius: 6px;
      background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text-muted);
      font-size: 28px; line-height: 1; cursor: pointer; z-index: 2;
    }
    .itv-nav:hover { background: var(--hover); color: var(--text); }
    .itv-prev { left: 12px; }
    .itv-next { right: 12px; }
    .itv-counter {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      color: var(--text-muted); font-size: 12px;
      background: color-mix(in srgb, var(--text) 8%, transparent);
      padding: 3px 10px; border-radius: 12px; z-index: 2;
    }
    .itv-tools { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; gap: 6px; }
    .itv-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--text-muted); font-size: 13px; }

    /* --- Original-media thumbnail strip (grid view) --- */

    /* While a modal scrim is up, lock background scroll so the page scrollbar (which
       paints above the overlay) doesn't stay visible. JS toggles .modal-open. */
    html.modal-open, body.modal-open { overflow: hidden; }

    /* --- Tags --- */
    .tags-label { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .tag-chip { font-size: 10px; background: var(--surface-3); border-radius: 10px; padding: 1px 8px; color: var(--text-muted); }
    /* タグ編集ダイアログ: チップクリック＝削除なので、ホバーで控えめな赤に
       （srgb 混合 — oklch でサーフェスと混ぜると紫に寄って見える） */
    #editTagsList .tag-chip:hover { background: color-mix(in srgb, var(--red-500) 20%, transparent); color: var(--danger); }
    /* Tag chips (removable) + a grouped, searchable picker of every existing tag
       (recognition over recall) + free-text create — shared by TagEditor.tsx's
       callers (tag-pop is the only one left, Issue #22). */
    .edit-current { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 10px; }
    .edit-addrow { display: flex; gap: 6px; }
    .edit-addrow input { flex: 1; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--surface); color: var(--text); outline: none; }
    .edit-addrow input:focus { border-color: var(--accent); }
    .edit-addrow .btn-outline { padding: 6px 12px; flex-shrink: 0; }
    .edit-picker { margin-top: 12px; max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
    .edit-pick-gname { font-size: 10px; font-weight: 600; color: var(--text-subtle); text-transform: uppercase; letter-spacing: .3px; margin-bottom: 5px; }
    .edit-pick-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .edit-pick-chip { display: inline-flex; align-items: center; gap: 5px; border: none; background: var(--chip-bg); color: var(--text); border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; transition: background .12s, box-shadow .12s, color .12s; }
    .edit-pick-chip:hover { background: var(--chip-bg-hover); }
    .edit-pick-chip.on { box-shadow: inset 0 0 0 1.5px var(--accent-soft); color: var(--text-strong); font-weight: 600; }
    .edit-empty { font-size: 12px; color: var(--text-subtle); }
    /* Flags (リプライ/引用/動画 etc.): quiet muted text, NOT boxed chips —
       the boxed-tint chips were more outlined boxes (wireframe feel) and
       競合した with the real value chips in the sidebar. */
    .post-flags { display: flex; flex-wrap: wrap; gap: 2px 8px; margin: 0 0 3px; }
    .post-flag { font-size: 10px; color: var(--text-muted); line-height: 1.6; }
    .post-grid.list-view .post-meta .post-flags { order: 1; margin: 0; }
    /* 📎 clip button: like the other hover actions, but its 'in' state IS
       meaningful (a library-wide flag, so a persistent filled state is correct). */
    .clip-btn {
      position: absolute; top: 8px; right: 40px;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--chrome-glass-bg); color: #fff; border: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.15s, background 0.15s;
      z-index: 1;
    }
    /* Hover buttons are glass-chrome (icon-only, floating OVER the thumbnail).
       The blur layer is enabled only on the hovered card so 150
       offscreen-invisible buttons don't each cost a backdrop pass. */
    .post-card:hover .clip-btn, .post-card:hover .info-btn, .post-card:hover .tag-btn {
      backdrop-filter: var(--chrome-glass-blur); -webkit-backdrop-filter: var(--chrome-glass-blur);
    }
    .post-card:hover .clip-btn { opacity: 1; }
    /* Clipped = active: the button fills with the accent (the "on" toggle idiom,
       like a filled bookmark/like — the fill itself is the state cue, replacing the
       old membership dot). No red-for-remove: clip is a light, frequent toggle and
       the red read as too alarming (user 2026-06-27). */
    .clip-btn.in { background: var(--accent); color: #fff; }
    .clip-btn.in:hover { background: color-mix(in srgb, var(--accent) 82%, black); }
    .post-grid.list-view .clip-btn { top: 50%; right: 40px; transform: translateY(-50%); }
    /* Flyout menus: the card context menu (full action list) and the folder
       picker it opens share one look. */
    .fold-menu {
      position: fixed; z-index: 12000; min-width: 180px; max-width: 260px;
      background: var(--surface); border: 1px solid var(--float-border);
      border-radius: 8px; box-shadow: var(--shadow-pop); padding: 4px; display: none;
    }
    .fold-menu.kind-menu { z-index: 13500; }   /* above the edit modal (13000) so the 種別 menu shows on top */
    .fold-menu.show { display: block; animation: hologramPopIn var(--dur-pop) var(--ease-out) both; }
    .fold-menu.qf-pop.show { display: flex; flex-direction: column; max-height: calc(100vh - var(--tabbar-h) - 16px); }
    /* Tag picker pop (Issue #22): the single popup for 🏷 / inspector ✎ / selection
       bar "タグを追加". Fixed width (chip wrap assumes it, unlike qf-pop's
       max-content). TagPop.tsx caps the pop's own max-height (viewport clamp) but
       does NOT make the pop itself scroll — .edit-picker (below) already owns the
       one scroll region, so chips/input stay put and only the vocab list scrolls. */
    .fold-menu.tag-pop { width: 320px; max-width: 320px; }
    .tag-pop-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .tag-pop-hint { font-size: 11px; color: var(--text-subtle); }
    .tag-pop-apply { flex-shrink: 0; padding: 6px 12px; background: var(--accent); color: #fff; border-color: var(--accent); }
    .fold-menu .fm-row {
      display: flex; align-items: center; gap: 6px; padding: 5px 8px;
      border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--text);
    }
    .fold-menu .fm-row:hover { background: var(--hover); }
    .fm-name { flex: 1; word-break: break-word; }
    /* High-contrast monotone check (was thin accent ✓ that read as cursive). */
    .fm-check { color: var(--text-strong); flex-shrink: 0; display: inline-flex; align-items: center; }
    .fm-check svg { display: block; }
    /* Quiet rename ✎ on the 作品/キャラ kind rows — hidden until the row is hovered
       (段階的開示), so the menu reads as a simple kind picker at rest. */
    .fm-rename { display: inline-flex; align-items: center; padding: 2px; border: 0; background: none;
      color: var(--text-subtle); cursor: pointer; border-radius: 4px; opacity: 0; flex-shrink: 0; }
    .fold-menu .fm-row:hover .fm-rename { opacity: .65; }
    .fm-rename:hover { opacity: 1; background: var(--sidebar-row-hover); color: var(--text); }
    .fm-rename svg { display: block; }
    .fm-sep { height: 1px; background: var(--border); margin: 4px 2px; }
    .fm-manage { color: var(--accent-text); }
    .fm-ic { display: flex; align-items: center; color: var(--text-muted); flex-shrink: 0; }
    .fm-ic svg { display: block; }
    /* destructive row: quiet red, stronger on hover (srgb mix — oklch turns purple on dark) */
    .fold-menu .fm-row.fm-danger { color: var(--danger); }
    .fold-menu .fm-row.fm-danger .fm-ic { color: var(--danger); }
    .fold-menu .fm-row.fm-danger:hover { background: color-mix(in srgb, var(--red-500) 14%, transparent); }
    /* Tag-kind menu (用語帳): non-interactive header + kind dots. Dot colors follow
       danbooru's tag-category convention (copyright=purple, character=green). */
    .fold-menu .fm-head { padding: 4px 8px 3px; font-size: 10px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--text-subtle); pointer-events: none; }
    .tk-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
    .tk-work { background: var(--tint-purple-bd); }
    .tk-character { background: var(--tint-green-bd); }

    /* --- ℹ detail-popup button on card (ported from image-view) --- */
    .info-btn {
      position: absolute; top: 8px; right: 8px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(20,22,26,0.42); color: #fff; border: none; font-size: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.15s;
      z-index: 1;
    }
    /* block display kills the inline-baseline slack; even 16px in the even
       28px button avoids the half-pixel that nudged the icon bottom-right */
    .info-btn svg { display: block; }
    .post-card:hover .info-btn { opacity: 1; }
    .post-grid.list-view .info-btn { top: 50%; right: 8px; transform: translateY(-50%); }

    /* --- 🏷 edit-tags button on card (third hover pill, left of ℹ/🔖). The
       2-button cap was lifted to 3 (🔖ws · ℹinfo · 🏷tags) by user call. --- */
    .tag-btn {
      position: absolute; top: 8px; right: 72px;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--chrome-glass-bg); color: #fff; border: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.15s, background 0.15s;
      z-index: 1;
    }
    .tag-btn svg { display: block; }
    .post-card:hover .tag-btn { opacity: 1; }
    .post-grid.list-view .tag-btn { top: 50%; right: 72px; transform: translateY(-50%); }

    /* Liquid hover highlight: ONE accent blob shared by the two hover buttons,
       gliding between them (iPadOS pointer-style), driven by :has() — no JS.
       It sits under the buttons (earlier in DOM, same z-index), so opaque
       button states (red=remove / green=added) still win visually. */
    .act-pill {
      position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
      border-radius: 50%; pointer-events: none; z-index: 2; opacity: 0;
      /* NEUTRAL white, never accent: hover = "pointer is here" (iPadOS
         pointer / Fluent hover), accent = selected STATE. A translucent
         accent blob gliding over thumbnails read as a color smear.
         z-index 2 = ABOVE the buttons (iPadOS layers the highlight OVER
         content); under the dark glass it was nearly invisible and the
         glide could not be seen. */
      background: rgba(255,255,255,0.25);
      transition: opacity .12s;
    }
    .post-card:has(.clip-btn:hover) .act-pill { right: 40px; opacity: 1; }
    .post-card:has(.info-btn:hover) .act-pill { right: 8px; opacity: 1; }
    .post-card:has(.tag-btn:hover) .act-pill { right: 72px; opacity: 1; }
    .post-grid.list-view .act-pill { top: 50%; transform: translateY(-50%); }

    /* --- Popovers --- */
    .qf-popover {
      position: fixed; background: var(--surface); border-radius: 10px;
      box-shadow: var(--shadow-pop); border: 1px solid var(--float-border); padding: 16px;
      z-index: 1001; min-width: 260px;
      /* Entrance pop. Placement code must keep measuring via offsetWidth/Height —
         getBoundingClientRect mid-pop reads ~4% small (scale .96 start). */
      animation: hologramPopIn var(--dur-pop) var(--ease-out) both;
    }
    /* Poster date popover: 日付の種類 / 並び替え / 期間 を小見出し付きで縦に積む。 */
    .pd-field { margin-bottom: 10px; }
    .pd-label { display: block; font-size: 10.5px; letter-spacing: .03em; color: var(--text-muted); margin-bottom: 4px; }

    /* --- App layout: content column beside the persistent left #sidebar --- */
    .app-content { flex: 1; min-width: 0; }

    /* フラットなサイドバー: セクションごとの白カード/影は低コントラストでノイズだったので撤去。
       見出し(sb-title)だけでグループを区切る。 */
    /* One left text-axis for the whole sidebar: boxed controls (search/select/
       date) start their text at 10(sidebar pad)+1(border)+12(inner pad)=23px, so
       bare text (titles, subtitles, counts) gets a 13px indent to land on the
       same axis, and pills use a 12px inner pad. */
    /* Rhythm: generous space BETWEEN sections, tight spacing inside them
       (title→content 6px, rows 4-8px) — Linear-style grouping. */
    .sb-section { padding: 0; margin-bottom: 18px; }
    /* Lower column: separate the big groups (filters / tags / clip /
       folders) by generous WHITESPACE rather than divider lines (user: no
       rules). The extra air carries the structure. */
    .sb-scroll > .sb-section { margin-bottom: 18px; }
    .sb-title {
      font-size: 11px; font-weight: 600; color: var(--text-muted-strong);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 6px; padding-left: 0;   /* aligns to the gutter (container) */
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    /* Active-filter bar pinned to the sidebar bottom (sticky). Holds the active filter
       pills + AND/OR toggle + reset. Shown only when at least one filter is active. */
    /* アクティブフィルタバーは .sb-scroll の外側の固定フッター（スクロールしない）。
       sticky をやめたことでスクロール時の再描画も無くなる＝カクつき低減。 */
    .sb-activebar {
      flex-shrink: 0; margin: 8px -10px 0; padding: 8px 10px;
      background: var(--surface); border-top: 1px solid var(--border);
    }
    /* Query builder = full-width top bar that spans ABOVE the sidebar+content row
       (it pierces over the sidebar's top; the sidebar starts below it). Sticks
       directly under the (sticky) tab bar. Its height feeds --activebar-h (set in
       JS) so the floating sidebar below can offset its sticky top. */
    /* Query bar = a TOOLBAR row under the tabs, NOT an input field. Active
       filters are chips laid directly on the bar surface — the industry shape
       for applied filters (Linear/Notion filter rows, Lightroom's Library
       Filter bar, SAP Fiori "filter feedback bar", Baymard's applied-filters
       overview). The former omnibox capsule (field fill + border + pill
       radius, 前例 Chrome) made three promises an address bar keeps and this
       bar breaks: one line (chips + 読み下し文 wrap to two), typable (it is
       not — first-run users tried, BACKLOG 誤認 2026-06-21), one value (it
       holds N discrete chips). Back/forward + tabs survive without an address
       bar — Finder is the precedent. Layout: [◀ ▶ nav] · [lead glyph + title +
       chips, wrapping] · [count + save + reset + help]. */
    .content-activebar {
      position: sticky; top: var(--tabbar-h); z-index: 40;
      flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 7px 16px;
      background: var(--sidebar-bg); border-bottom: 1px solid var(--float-border);
    }
    /* Nav + lead glyph anchor to the FIRST row of chips — otherwise they float
       to the block's middle when the chips wrap to multiple rows. */
    .qb-nav { flex: none; display: flex; align-items: center; gap: 2px; align-self: flex-start; }
    .qb-nav .icon-btn { width: 28px; height: 28px; }
    .qb-nav .icon-btn svg { width: 17px; height: 17px; }
    /* #113: opacity:.3 on top of the already-muted ghost color made the shape
       nearly invisible — "can't press" only needs to read, not "can't see". */
    .qb-nav .icon-btn:disabled { cursor: default; }
    .qb-nav .icon-btn:disabled:hover { background: none; color: var(--text-subtle); border-color: transparent; }
    .qb-body {
      flex: 1 1 auto; min-width: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .qb-body .qb-lead { flex: none; display: inline-flex; align-items: center; color: var(--text-muted); align-self: flex-start; margin-top: 6px; }
    .qb-body .qb-main { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    /* Empty-bar hint: the bar is a display, not an input — teach the entry
       point instead (声: 平易・次にやることの導線). Hidden once anything is on. */
    .qb-empty { font-size: 12px; color: var(--text-subtle); }
    .content-activebar .sb-activebar-title { flex: none; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .content-activebar #queryChips, .content-activebar #posterQueryChips { display: flex; flex-wrap: wrap; gap: 4px; flex: 0 1 auto; min-width: 0; justify-content: flex-start; align-items: center; }
    /* Trailing cluster sits just past the pill's right edge (outside the capsule).
       The pill grows to fill, so no auto margin is needed to push it over. */
    .content-activebar .qb-trail { flex: none; display: flex; align-items: center; gap: 8px; }
    .content-activebar .post-count { flex: none; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .content-activebar .sb-reset { flex-shrink: 0; }
    .sb-activebar-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .sb-activebar-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; flex: 1; }
    .sb-reset { font-size: 10px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--muted); cursor: pointer; }
    .sb-reset:hover { border-color: var(--accent); color: var(--accent-text); }
    /* Save-search = a feature-launch button: borderless chip fill + accent icon/text
       (DESIGN「フィーチャー起動ボタン」). The accent makes it read as an action you can
       take; the label says it outright. Was an unstyled button = looked like stray text
       and gave no hint you could save the search (user 2026-06-27). */
    .sb-save-search { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 3px 10px; border: none; border-radius: 10px; background: var(--chip-bg); color: var(--accent-text); cursor: pointer; white-space: nowrap; transition: background .12s; }
    .sb-save-search svg { color: var(--accent); }
    .sb-save-search:hover { background: var(--chip-bg-hover); }
    /* 値が入っているフィルタ欄の強調（検索・数値・日付） */
    /* 値が入っている欄の強調はパステルに（強い青の二重リングは主張しすぎ） */
    .has-value {
      border-color: color-mix(in oklch, var(--accent) 45%, var(--border)) !important;
      box-shadow: 0 0 0 2px color-mix(in oklch, var(--accent) 14%, transparent);
    }
    .sb-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    /* Breathing room under the chip row, only when chips exist (the container is
       always mounted — an unconditional padding would gap the empty toolbar). */
    .sb-chips:has(*) { padding-bottom: 8px; }
    /* Feature launcher (tagging session): an explicit CTA button (Notion "+New" /
       Linear式) — defined fill + border + xs shadow, plus a hover LIFT (translateY
       + shadow) so it reads unmistakably as a press target, not a flat tinted box.
       The accent icon sits in its own soft chip so the button has a clear "head".
       (.btn-outline language — a single CTA, not a category row.) */
    .sb-feature {
      width: 100%; display: flex; align-items: center; gap: 9px;
      padding: 8px 11px; margin: 2px 0 12px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--chip-bg);
      color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: left;
      box-shadow: var(--shadow-xs);
      transition: background .12s, border-color .12s, box-shadow .12s, transform .12s;
    }
    .sb-feature:hover {
      background: var(--chip-bg-hover); border-color: var(--accent-soft);
      box-shadow: var(--shadow-sm); transform: translateY(-1px);
    }
    .sb-feature:active { transform: translateY(0); box-shadow: var(--shadow-xs); }
    /* Icon gets a soft accent chip = the button's "head" (recognisable affordance,
       like Linear's coloured glyph badge). */
    .sb-feature .sb-feature-ic {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent-text);
    }
    .sb-feature .sb-feature-ic svg { width: 15px; height: 15px; }
    .sb-feature svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--accent-text); }
    /* Value chips: FILLED pill, no outline (GitHub topics / Notion tags).
       The transparent border keeps geometry so the active tint border can
       appear without layout shift. Hover = neutral lift, never accent. */
    /* Resting chip carries a visible border — relying on bg-tint alone made chips
       vanish into the muted sidebar (recurring low-contrast complaint). A border
       is contrast-independent, so it survives any background. */
    .sb-chip {
      background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 12px;
      padding: 3px 12px; font-size: 11px; color: var(--text);
      cursor: pointer; white-space: nowrap;
      /* transition: all はスクロール時のスタイル再計算を重くするので対象プロパティを限定 */
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .sb-chip:hover { background: var(--chip-bg-hover); color: var(--text-strong); }
    /* Active = soft tint (light accent bg + accent text), NOT a saturated border —
       the hard accent border read as too loud (user). Matches the quiet filter-row
       active (accent text) for one consistent selection language across the sidebar. */
    .sb-chip.active {
      background: var(--accent-subtle); border-color: var(--accent-subtle);
      color: var(--accent-subtle-fg); font-weight: 600;
    }
    /* tag chips cycle 解除→いずれか(OR)→すべて含む(AND): AND = 濃いめのティント + ＋ prefix */
    .sb-chip.active.and {
      background: color-mix(in srgb, var(--accent) 30%, var(--surface));
      border-color: var(--accent); color: var(--accent-subtle-fg);
    }
    /* Poster tag filter (投稿者タグ②): selected chips wear the 種別 dot inline; the
       clear-all chip reads quietly (it's an action, not an active filter). */
    .poster-tag-chip { display: inline-flex; align-items: center; gap: 5px; }
    .poster-tag-clear { color: var(--text-muted); }
    .poster-tag-clear:hover { color: var(--text-strong); }

    /* Active-filter pills = one uniform SOLID material (monotone). The old
       per-type rainbow tints (qc-platform/postType/date/…) read as "color groups
       floating" against the monotone UI (報告) — dropped for a single pill; the
       leading icon/label still tells the type apart. Solid, not glass (#136):
       the pill sits on the solid activebar, so a backdrop blur had nothing to
       sample — the chip tokens give the same clear step above the bar as the
       sidebar chips get. */
    .sb-active-chip {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 999px; padding: 3px 10px; font-size: 12px;
      cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
      color: var(--text);
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
    }
    .sb-active-chip:hover { opacity: 0.7; }
    .sb-active-chip .qc-ic { width: 12px; height: 12px; flex-shrink: 0; opacity: .72; }
    .sb-active-chip.chip-new, .qb-val.chip-new { animation: hologramPillIn var(--dur-pop) var(--ease-out) both; }
    /* Chip exit: the query-chips island keeps removed values as .leaving ghosts
       for the animation's length, then prunes them (pointer-events off so the
       stale data-nid can't reach the delegated handlers). */
    .qb-val.leaving { animation: hologramPillOut var(--dur-pop) var(--ease-out) forwards; pointer-events: none; }
    /* A whole attribute cluster removed → the entire pill leaves as one. */
    .sb-active-chip.leaving { animation: hologramPillOut var(--dur-pop) var(--ease-out) forwards; pointer-events: none; }
    /* 検索/フォルダの特殊ピルは「値」ではなく入力欄寄りなので角丸四角に */
    .sb-active-chip.qc-search, .sb-active-chip.qc-folder { border-radius: 6px; }
    /* Facet-chip query builder (改訂④): values
       cluster by attribute inside ONE glass pill (.qb-cluster), joined by 「・」
       (.qb-sep), each with a hover ✕ (.qb-del-btn). The only operator surface is
       the すべて/どれか toggle (.qb-opt) on multi-value clusters; exclusions live
       in the 除く cluster (.qb-cluster-excl); a non-facet persisted tree renders
       read-only (.qb-summary). No parens, no connective words, no drag. */
    .qb-cluster { gap: 4px; }
    .qb-cluster:hover { opacity: 1; }  /* cancel .sb-active-chip's click-fade: the container itself isn't clickable */
    .qb-val { position: relative; display: inline-flex; align-items: center; gap: 3px; min-width: 0; }
    .qb-val .qb-val-label { min-width: 0; }
    .qb-val-edit { cursor: pointer; }
    .qb-val-edit:hover .qb-val-label { text-decoration: underline dotted; }
    .qb-sep { color: var(--text-subtle); pointer-events: none; user-select: none; }
    /* すべて/どれか = miniature segmented control (recessed track + raised
       thumb), the app's vocabulary for a two-state switch: BOTH options stay
       visible so it reads as pressable and the alternative frames the meaning
       ("all of these" vs "any of these"). Same reasoning that replaced the
       lone search-mode chip with ぴったり/おおまか (.seg-control) — a single
       word read as a status badge, not a switch (ユーザー指摘 2026-07-03). */
    .qb-opt { display: inline-flex; align-self: center; padding: 2px; gap: 2px;
      background: var(--seg-track); border-radius: 7px; }
    .qb-opt-btn { border: 0; background: transparent; cursor: pointer; padding: 1px 7px;
      border-radius: 5px; font: inherit; font-size: 10.5px; color: var(--text-muted);
      white-space: nowrap; transition: color var(--dur-base); }
    .qb-opt-btn:hover:not(.is-on) { color: var(--text); }
    .qb-opt-btn.is-on { background: var(--seg-thumb); color: var(--text-strong);
      font-weight: 600; box-shadow: var(--shadow-xs); cursor: default; }
    .qb-excl-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    /* Read-only 「かつ」 between the search echo and the query. */
    .qc-conn { font-size: 11px; color: var(--text-subtle); margin: 0 4px; align-self: center; pointer-events: none; }
    /* ✕ delete: tucked at the value's right edge, INSIDE its bounds. Reserves its
       slot always so revealing it on hover causes no layout shift. The exclusion
       move + a redundant delete live in the right-click menu. */
    .qb-del-btn { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 15px; height: 15px; margin-left: 1px; margin-right: -4px; padding: 0; border: none;
      border-radius: 50%; background: none; color: var(--text-muted); cursor: pointer; opacity: 0;
      transition: opacity .12s, color .12s, background .12s; }
    .qb-val:hover .qb-del-btn { opacity: .75; }
    .qb-del-btn:hover { opacity: 1; color: var(--danger); background: color-mix(in srgb, var(--red-500) 16%, transparent); }
    .qb-del-btn svg { display: block; }
    /* Read-only summary of a persisted non-facet (改訂③) tree. */
    .qb-summary { font-size: 12px; color: var(--text-muted-strong); align-self: center; cursor: help; min-width: 0; }
    /* ⓘ クエリビルダの使い方ヘルプ。バーの右端＝ヘルプの定番コーナーに置く
       (margin-left:auto でチップ/リセットを左に寄せ、ⓘ だけ右へ逃がす)。 */
    .qb-help {
      flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border: none; border-radius: 50%;
      background: none; color: var(--text-subtle); cursor: pointer; transition: color .12s;
    }
    .qb-help:hover { color: var(--accent-text); }
    .qb-help-pop {
      position: fixed; z-index: 12000; display: none; max-width: 360px;
      border-radius: 10px; padding: 12px 14px;   /* material (bg/border/shadow) = shared pop-solid */
      font-size: 12px; line-height: 1.7; color: var(--text);
    }
    .qb-help-pop.show { display: block; animation: hologramPopIn var(--dur-pop) var(--ease-out); }
    .qb-help-pop .qh-title { font-weight: 700; margin-bottom: 6px; }
    .qb-help-pop .qh-row { display: flex; gap: 7px; margin-top: 4px; }
    .qb-help-pop .qh-row::before { content: '・'; color: var(--text-subtle); flex-shrink: 0; }
    /* grip dots = 「ドラッグで移せる」の定番アフォーダンス（pseudo なので
       textContent には乗らない） */
    /* No permanent drag-grip glyph on pills: draggability is signalled by the
       grab cursor, the empty-zone "ここへドラッグで移動" hint and the ⓘ help.
       (The tiny ⋮⋮ read as a squashed 三 and added noise to every pill.) */
    /* scrollbar-gutter: without it the scrollbar that appears AFTER placement
       re-wraps the chip rows narrower → content grows past the measured height
       and a sliver of scroll survives even when the list could have fit. */
    .qf-pop .qf-vals { overflow-y: auto; flex: 1; min-height: 0; scrollbar-gutter: stable; }
    /* Find input + ぴったり/おおまか form the flyout's SEARCH HEADER (Finder/Mail:
       field + scope bar as one block, then results). The seg now carries its own
       border (visible on glass), so the values area needs no extra hairline above it. */
    .qf-pop .qf-find {
      width: 100%; padding: 5px 10px; font-size: 12px;
      border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface-3);
      color: var(--text); outline: none;
    }
    .qf-pop .qf-find:focus { border-color: var(--accent); }
    /* Tag-group heading inside the flyout: same non-interactive-header anatomy as
       .fm-head (10px/600/subtle) PLUS a hairline above the group — the macOS menu
       section pattern (separator + small grey header). Whitespace + faint text alone
       still read as a greyed-out tag row (0-count rows share that tone). */
    .qf-pop .qf-ghead { font-size: 10px; font-weight: 600; letter-spacing: .3px; color: var(--text-subtle); padding: 8px 8px 3px; margin-top: 5px; border-top: 1px solid var(--border); pointer-events: none; }
    .qf-pop .qf-vals > .qf-ghead:first-child { margin-top: 0; border-top: none; padding-top: 5px; }
    /* instance sub-rows nested under Misskey/Mastodon in the platform flyout */
    .qf-pop .fm-row.fm-sub { padding-left: 24px; font-size: 11px; color: var(--text-muted); }
    .qf-pop .fm-row.fm-sub .fm-name { color: inherit; }
    /* Facet count: how many current-query matches carry this value. Quiet
       tabular number, sits right of the name (which flexes) before the ✓.
       0件 → whole row greyed (still pickable); a divider marks the present→absent
       boundary on flat lists. Muted via color, never opacity (DESIGN.md). */
    .qf-pop .fm-count { flex-shrink: 0; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .qf-pop .fm-row.off { color: var(--text-muted); }
    .qf-pop .fm-row.off .fm-count { color: var(--text-subtle); }
    .qf-pop .qf-div { height: 1px; background: var(--border); margin: 5px 6px; }
    /* Two-pane mode (the タグ flyout with user tag-groups): group list on the LEFT,
       the selected group's tags as rows on the RIGHT — Eagle's tag panel (groups you
       click to scope the tags beside them). Replaces the wrapped-chip single flyout
       (2026-07-04): a grouped vocabulary reads faster as pick-a-group → see-its-tags
       than as one long chip-wrapped scroll. The flyout widens to hold both columns. */
    /* width:max-content = the flyout sizes to its content (both columns), capped at
       520px / viewport — NOT a fixed 560 slab (user 2026-07-04: 横長すぎ). The panes'
       own min-widths set the effective floor (≈110+150+gutters), so a short vocabulary
       gives a narrow flyout and a long one grows to the cap. */
    .fold-menu.qf-pop--twopane { width: max-content; max-width: min(520px, calc(100vw - 24px)); }
    .qf-pop .qf-panes { flex: 1; display: flex; min-height: 0; }
    /* Left column: the tag-groups (全て + each group), hugs its content (min 110px).
       Active group = the app's monotone-contrast active fill (not accent — DESIGN). */
    .qf-pop .qf-groups { flex: 0 0 auto; min-width: 110px; max-width: 190px; overflow-y: auto; padding: 4px 4px 4px 2px; border-right: 1px solid var(--border); scrollbar-gutter: stable; }
    .qf-pop .qf-group-row {
      display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 8px;
      border: 0; border-radius: 6px; background: transparent; cursor: pointer;
      font: inherit; font-size: 12px; color: var(--text); text-align: left;
      transition: background .12s, color .12s;
    }
    .qf-pop .qf-group-row:hover { background: var(--sidebar-row-hover); }
    .qf-pop .qf-group-row.active { background: var(--accent-subtle); color: var(--text-strong); font-weight: 600; }
    .qf-pop .qf-group-row .fm-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qf-pop .qf-group-row .fm-count { flex-shrink: 0; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .qf-pop .qf-panes .qf-vals { flex: 1 1 auto; min-width: 150px; }
    .qf-pop .qf-footer { border-top: 1px solid var(--border); padding: 2px 0; flex-shrink: 0; }
    .qf-pop .qf-footer-link { display: block; width: 100%; text-align: left; padding: 6px 10px; font-size: 12px; font-weight: 500; color: var(--accent-text); background: none; border: none; cursor: pointer; }
    .qf-pop .qf-footer-link:hover { background: var(--hover); text-decoration: underline; }
    /* リアルタイム検索サジェスト（検索ボックス直下・タグ/作者候補）
       react-aria Popover: position/visibility は portal + inline style 側が持つので
       ここはパネルの見た目と行だけ。--trigger-width は react-aria が供給。 */
    .search-suggest {
      z-index: 12000; max-height: 300px; overflow-y: auto;
      min-width: var(--trigger-width);
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 8px; box-shadow: var(--shadow-pop); padding: 4px;
    }
    /* allowsEmptyCollection keeps the popover openable from a single paste event
       (open decisions see the pre-render collection); an EMPTY open is hidden here
       instead — same visible behavior as the old "no matches → no dropdown". */
    .search-suggest:not(:has(.sg-row)) { display: none; }
    .search-suggest .sg-row {
      display: flex; align-items: center; gap: 7px; padding: 5px 8px;
      border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--text);
    }
    .search-suggest .sg-row:hover, .search-suggest .sg-row[data-focused] { background: var(--hover); }
    .search-suggest .sg-ic { flex-shrink: 0; font-size: 11px; }
    .search-suggest .sg-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-suggest .sg-n { flex-shrink: 0; font-size: 10px; color: var(--text-subtle); }
  /* Filter rows: one-line category buttons; a flyout with the values opens
     beside the row. Badge = number of active filters of that type. */
  /* Category rows: borderless text rows with a soft fill ONLY on hover
     (Finder/Notion idiom). Boxing every row in a border+fill read as
     wireframe placeholders ("Wordの図形" — user-rejected). The transparent
     1px border keeps the 23px text axis geometry intact. */
  .sb-row {
    display: flex; align-items: center; gap: 7px; width: 100%;
    padding: 4px 12px; margin-bottom: 1px; text-align: left;
    background: transparent; border: 1px solid transparent;
    border-radius: 8px; color: var(--text); font-size: 12px; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .sb-row:hover { background: var(--sidebar-row-hover); }
  .sb-row .sb-row-ic { display: flex; align-items: center; color: var(--text-muted); flex-shrink: 0; transition: color .12s; }
  .sb-row .sb-row-ic svg { width: 14px; height: 14px; display: block; }
  .sb-row:hover .sb-row-ic { color: var(--text); }
  .sb-row .sb-row-name { flex: 1; }
  /* Active-filter count (AND clip count — same part). The old filled grey
     pill read as a clunky notification badge against the flat sidebar (user: ダサい);
     replaced by a PLAIN right-aligned number. It marks an ACTIVE category, so it
     carries a touch more weight + the full --text ink — "active = grey
     contrast", not a tint or a box (DESIGN.md). */
  .sb-row .sb-row-badge {
    display: none; flex-shrink: 0;
    color: var(--text); font-size: 11px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .sb-row .sb-row-badge.on { display: inline-block; animation: hologramBadgePop .3s var(--ease-out); }
  /* Rows with an active filter mark their icon in accent ink (motion-study
     canvas 2026-07-05) — (0,3,1) outweighs the (0,2,1) hover rule above. */
  .sb-row:has(.sb-row-badge.on) .sb-row-ic { color: var(--accent-text); }
  /* --- Disclosure arrows (single source of truth; shape = inline SVG set in HTML/JS) ---
     All ▸/▾ indicators share this token. Per-component rules keep only spacing. */
  .sb-row-arrow, .cs-btn .cs-arrow {
    color: var(--text-muted); display: inline-flex; align-items: center; flex-shrink: 0;
    pointer-events: none;
  }
  /* Always-visible (#112): posterFilterRows never hid this arrow, so the
     library rows were the odd one out — same "opens a popover" affordance,
     inconsistent visual language between the two sidebars. */
  /* Sub-section block (開始日/終了日 etc.): indented with a guide line sitting on
     the 23px text axis, labels at readable contrast. */
  .sb-sub {
    display: flex; flex-direction: column; gap: 2px;
    margin-left: 13px; padding-left: 10px;
    border-left: 2px solid var(--border-strong);
  }
  .sb-sub .date-input { width: 100%; }
  } /* @layer legacy */
  </style>
</head>
<body>
  <!-- Legacy shell markup removed (redesign P1 cutover): the React AppShell
       (islands/shell/AppShell.tsx) now owns the tab bar, sidebar, toolbar, grid host
       and inspector. The three overlay containers below (#ivFolderModal / #lightbox /
       #settingsRoot) stay static until their surfaces are reworked (P2 ⑦/⑧/⑩). -->

  <!-- Folder management modal (shared by both modes) — React island (FolderManagerModal,
       app/islands/folders) owns the content + [hidden] visibility; folders.ts's
       openManager()/closeManager() drive it. -->
  <div id="ivFolderModal" class="iv-detail-overlay" hidden></div>

  <!-- Image quick-view peek — React island (renderer/lightbox.ts + islands/lightbox)
       owns the overlay contents + show class; orchestrator.ts feeds it the one item. -->
  <div class="lightbox-overlay" id="lightbox"></div>

  <!-- Bulk "add tags to selection" is the tag-pop React island now (Issue #22,
       app/islands/tag-pop) — no static markup here (it portals onto document.body
       like qf-pop/context-menu). -->

  <!-- Date / engagement / poster-date-range popovers are the filter-popover React
       island now (app/islands/filter-popover) — no static markup here. -->

  <!-- Styles that began life in the (now-removed) image-view but are reused by the
       unified post-view: ℹ detail popup, AND/OR tag toggle, folder chips +
       management modal, toast, and the multi-image / group-expand checkboxes.
       The image-view tile grid, sidebar layout and fullscreen lightbox CSS went
       away with that view. -->
  <style>
    @layer legacy {
    .iv-tagn { opacity: .55; margin-left: 4px; font-size: 10px; }
    .iv-htbtn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--fg); transition: all .15s; }
    .iv-htbtn:hover { border-color: var(--accent); color: var(--accent-text); }
    .iv-htbtn:disabled { opacity: .5; cursor: default; }

    /* Detail popup (ℹ action): centered modal over a dim backdrop. */
    .iv-detail-overlay {
      position: fixed; inset: 0; z-index: 11000; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .iv-detail-overlay[hidden] { display: none; }
    .iv-detail-box {
      background: var(--surface); color: var(--fg); border-radius: 12px;
      padding: 18px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
      font-size: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-lg);
    }
    .iv-insp-close { float: right; border: none; background: none; font-size: 18px; line-height: 1; color: var(--muted); cursor: pointer; }
    .iv-insp-close:hover { color: var(--fg); }
    .iv-insp-title { font-size: 13px; font-weight: 600; line-height: 1.5; word-break: break-word; margin-bottom: 8px; padding-right: 20px; }

    /* Inspector: an inline right column, at every window width (#243). The panel
       used to detach into a fixed slide-over below 1280px; that automatic reshape
       is gone — the column is opened and closed by the user (toggle / ×) and the
       width no longer decides its form. Clicking a card while it is open swaps the
       content (double-click → gallery). */
    .inspector {
      width: var(--inspector-w); flex-shrink: 0;
      height: 100%; z-index: 25;
      background: var(--surface); border-left: 1px solid var(--border);
      font-size: 12px;
      /* A column of [titlebar strip][scrolling body]: the panel spans the full window
         height like the sidebar does, so like the sidebar it has to hand its top row
         to the window chrome instead of scrolling content under it. */
      display: flex; flex-direction: column;
    }
    /* The panel's share of the titlebar (mirrors the sidebar's header row). The
       inspector toggle and the window buttons are pinned over it, so it stays empty —
       what it contributes is the drag region and the reserved height. */
    .inspector-titlebar { height: var(--tabbar-h); flex-shrink: 0; -webkit-app-region: drag; }
    .inspector-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px 18px; }
    /* Narrow widths (#259): the same panel floats over the grid instead of taking a
       column out of it. --content-top is measured by AppShell (the toolbar's height
       moves with the filter chip row), so the overlay starts exactly at the content
       area and leaves the tab bar + toolbar reachable. React owns the width decision —
       no media query here; layout-mode.ts is the only place the breakpoint lives. */
    .inspector--overlay {
      position: fixed; top: var(--content-top, var(--tabbar-h)); right: 0; bottom: 0; height: auto;
      border-left: 1px solid var(--float-border); box-shadow: var(--shadow-lg);
      z-index: 9500;   /* over the content, under modals/lightbox (11000+) */
    }
    /* The window chrome is pinned over the panel's top only while it reaches the window
       top — as an overlay it starts below the toolbar, so it hands the strip back. */
    .inspector--overlay .inspector-titlebar { display: none; }
    /* Image tab: the inspector is part of the detail view (Eagle-style), so it stays an
       inline column even when narrow — a slide-over would cover the very image being
       inspected. Back in flow, it reaches the window top again and needs its strip. */
    body.image-tab-active .inspector--overlay {
      position: static; height: 100%; box-shadow: none; border-left: 1px solid var(--border);
    }
    body.image-tab-active .inspector--overlay .inspector-titlebar { display: block; }
    .inspector[hidden] { display: none; }
    .inspector:not([hidden]) { animation: hologramPanelIn var(--dur-panel) var(--ease-out); }
    /* Inspector inline tag editor — always shown while the inspector is open: tag
       editing is per-card here, no mode to enter (posts + posters behave the same). */
    .iv-tag-edit, .iv-tag-edit-poster { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 4px; }
    .iv-tag-label { font-size: 11px; color: var(--text-muted); }
    .iv-tag-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .iv-tag-chips .tag-chip { cursor: pointer; font-size: 11px; transition: background .12s, color .12s; }
    .iv-tag-chips .tag-chip:hover { background: color-mix(in srgb, var(--red-500) 20%, transparent); color: var(--danger); }
    .iv-tag-addrow { display: flex; gap: 6px; }
    .iv-tag-addrow input { flex: 1; min-width: 0; padding: 5px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 12px; outline: none; }
    .iv-tag-addrow input:focus { border-color: var(--accent); }
    .iv-tag-addrow .btn-outline { flex-shrink: 0; padding: 5px 11px; font-size: 12px; }
    .iv-tag-picker.edit-picker { margin-top: 2px; max-height: 42vh; }
    /* The card currently shown in the inspector — tinted ring, not solid */
    .post-card.inspected { border-color: var(--accent-border); box-shadow: 0 0 0 1px var(--accent-border); }

    /* (Old .iv-andor AND/OR toggle removed in the query-builder 改訂③ redesign;
       改訂④ removed the operator vocabulary from the bar entirely.) */

    /* Folder management modal */
    .iv-folder-new { display: flex; gap: 6px; margin: 10px 0; }
    .iv-folder-new .search-box { flex: 1; }
    .iv-folder-list { display: flex; flex-direction: column; gap: 2px; }
    .iv-folder-empty { color: var(--muted); font-size: 12px; padding: 10px 2px; }
    .iv-folder-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--border-soft); cursor: grab; }
    .iv-folder-row.iv-dragging { opacity: 0.45; }
    .iv-folder-row.iv-drop-before { box-shadow: inset 0 2px 0 var(--accent); }
    .iv-folder-row.iv-drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
    .iv-fold-name { flex: 1; word-break: break-word; }
    .iv-fold-n { color: var(--muted); font-size: 11px; }
    .iv-fold-btn { border: none; background: none; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 5px; color: var(--muted); }
    .iv-fold-btn:hover { background: var(--hover); }

    /* ============================================================
       === Floating-surface materials (#136 readability policy) ===
       Utility layer (defined LAST so it wins source-order over component
       rules like .fold-menu). Three materials, chosen by CONTENT:
         1 .pop-solid    — text-bearing floats on UI: themed solid. Menus/
                           popovers/panels/settings restate the same recipe in
                           their component rules; this class is the shared hook
                           for hosts without one (hint family).
         2 scrim solid   — text-bearing floats over CONTENT (toast, thumbnail
                           badges): --scrim-bg/--scrim-ink inline in the
                           component rules (shapes differ too much for a class).
         3 .glass-chrome — the ONLY glass. Icon-only chrome floating over
                           content (hover card buttons, back-to-top). Dark veil
                           + white ink = contrast guaranteed over any image,
                           so it is theme-INDEPENDENT. Never carries text.
       ============================================================ */
    .pop-solid {
      background: var(--surface);
      border: 1px solid var(--float-border);
      box-shadow: var(--shadow-pop);
    }
    .glass-chrome {
      background: var(--chrome-glass-bg); color: #fff;
      backdrop-filter: var(--chrome-glass-blur);
      -webkit-backdrop-filter: var(--chrome-glass-blur);
      border: 1px solid var(--chrome-glass-rim);
      box-shadow: var(--shadow-md);
    }
    .glass-chrome:hover { background: rgba(20,22,26,0.6); color: #fff; }

    /* The single shared hover-hint surface (.ui-tip + .pop-solid, singleton div
       owned by islands/tooltip/TooltipHost.tsx, portaled onto document.body; the
       store + tipProps() live in islands/_shared/tip.ts). EVERY hover hint drives
       it — React tipProps() and the [data-tip] delegation — so tooltips
       can't drift apart. Replaces native `title` on custom controls (the OS
       tooltip is ~1s delayed and OS-styled = チープ). Shows immediately on
       hover/focus with a fast fade+rise; pop-solid supplies the material.
       Topmost surface (above every fold-menu/popover at ≤13500). */
    .ui-tip {
      position: fixed; z-index: 14000; pointer-events: none;
      padding: 6px 10px; border-radius: 6px;
      font-size: 12px; font-weight: 400; line-height: 1.45;
      letter-spacing: 0.01em;
      color: var(--text-strong); white-space: nowrap;
      opacity: 0; visibility: hidden; translate: 0 3px;
      transition: opacity .12s var(--ease-out), translate .12s var(--ease-out), visibility 0s .12s;
    }
    .ui-tip.show { opacity: 1; visibility: visible; translate: 0 0; transition-delay: 0s; }
    @media (prefers-reduced-motion: reduce) { .ui-tip { transition: none; translate: 0 0; } }
    /* Rich variant: a multi-line explanatory hint (clip row etc.) — wraps, wider,
       left-aligned, roomier corners/padding. Material = the same .pop-solid as
       the single-line tip (#136: the whole hover-hint family is solid now;
       no per-host fill bumps). */
    .ui-tip--rich {
      white-space: normal; max-width: 260px; text-align: left;
      padding: 9px 12px; border-radius: 8px;
      line-height: 1.6;
    }

    /* a11y escape hatch: text faces are already solid (#136), so only the two
       remaining backdrop-filter users need a fallback here. */
    @media (prefers-reduced-transparency: reduce) {
      .glass-chrome, .clip-btn, .info-btn, .tag-btn, #sidebar #sbTop { background: rgba(20,22,26,0.86); }
      .post-card:hover .clip-btn, .post-card:hover .info-btn, .post-card:hover .tag-btn,
      .glass-chrome, #sidebar #sbTop { backdrop-filter: none; -webkit-backdrop-filter: none; }
      .lightbox-overlay { background: rgba(0,0,0,0.85); backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    } /* @layer legacy */
  </style>

  <!-- Motion: tasteful, fast entrance/open animations layered on top of the
       existing hover transitions. Card entrance plays only on a fresh render
       (viewer.js adds .anim-in; load-more / reduced-motion skip it). Everything
       is neutralized under prefers-reduced-motion. -->
  <style>
    @layer legacy {
    @keyframes hologramCardIn { from { opacity: 0; transform: translateY(11px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes hologramFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes hologramPopIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes hologramSlideIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes hologramPanelIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
    @keyframes hologramPillIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    /* Chip exit — the island marks removed values .leaving and prunes them
       after the run (see query-chips AnimatedChips). */
    @keyframes hologramPillOut { to { opacity: 0; transform: scale(.55); } }
    /* Badge pop on activation. Uses the independent `scale` property, NOT
       transform: #clipBadge carries transform: translateY(-50%) — a transform
       keyframe would yank it off its vertical axis mid-pop. */
    @keyframes hologramBadgePop { 0% { scale: 1; } 50% { scale: 1.5; } 100% { scale: 1; } }
    /* Selection check draw: overshoot then settle. rotate(45deg) rides along in
       every frame — it's what shapes the border-drawn checkmark. */
    @keyframes hologramCheckDraw {
      0% { transform: rotate(45deg) scale(0); opacity: 0; }
      70% { transform: rotate(45deg) scale(1.15); opacity: 1; }
      100% { transform: rotate(45deg) scale(1); }
    }
    /* Card entrance — only when the grid is (re)built fresh, e.g. filter/sort/search.
       Fill is `backwards`, NOT `both`: the grid keeps .anim-in until the next render,
       so a forwards fill would pin the final `transform: none` on every card forever —
       and an animation's value outranks the `:hover` rule, which silently killed the
       hover-scale lift. `backwards` still holds the hidden pre-start state but stops
       contributing a transform once the run ends, so :hover scale works again.
       Staggered: each card delays by its model index (--card-i, inline from the
       island), capped at 15 steps so the grid's .anim-in removal window
       (GRID_ANIM_MS in viewer.js) can cover the last card. */
    .post-grid.anim-in .post-card {
      animation: hologramCardIn var(--dur-entrance) var(--ease-out) backwards;
      animation-delay: calc(min(var(--card-i, 0), 15) * var(--stagger));
    }

    /* Empty state: same slide-in as cards when first shown. */
    .empty-state.anim-in { animation: hologramCardIn var(--dur-entrance) var(--ease-out) both; }

    /* View mode transition (card↔tile↔list): scope to the grid only so sidebar
       doesn't repaint. Old grid fades out quickly; new grid's anim-in handles
       the card entrance. ::view-transition-new gets animation:none so we don't
       double-animate with anim-in. */
    ::view-transition-old(post-grid) { animation: hologramFadeIn .12s ease-in reverse both; }
    ::view-transition-new(post-grid) { animation: none; }
    /* The post-grid snapshot renders in the TOP LAYER and would cover the sticky
       active-filter bar (content shows through it on mode switch — ユーザー報告).
       Promote the bar to its own snapshot group above the grid so it stays put. */
    .content-activebar { view-transition-name: hologram-activebar; }
    ::view-transition-group(hologram-activebar) { z-index: 2; }
    ::view-transition-old(hologram-activebar), ::view-transition-new(hologram-activebar) { animation: none; }
    /* Same top-layer cover for the rest of the persistent chrome: once the page is
       scrolled, the post-grid snapshot's box starts above the viewport, so in the
       top layer it paints over the tab bar / sidebar (query builder) / back-to-top
       and the grid shows "through" them on mode switch (ユーザー報告: タブ・クエリ
       ビルダーが透ける). Promote each to its own static group above the grid. */
    #tabBar { view-transition-name: hologram-tabbar; }
    ::view-transition-group(hologram-tabbar) { z-index: 3; }
    ::view-transition-old(hologram-tabbar), ::view-transition-new(hologram-tabbar) { animation: none; }
    #sidebar { view-transition-name: hologram-sidebar; }
    ::view-transition-group(hologram-sidebar) { z-index: 2; }
    ::view-transition-old(hologram-sidebar), ::view-transition-new(hologram-sidebar) { animation: none; }
    #contentTop { view-transition-name: hologram-backtotop; }
    ::view-transition-group(hologram-backtotop) { z-index: 3; }
    ::view-transition-old(hologram-backtotop), ::view-transition-new(hologram-backtotop) { animation: none; }

    /* Detail popup (ℹ): backdrop fades, box pops in. Replays on each open because
       removing [hidden] re-mounts the element (display:none -> flex). */
    .iv-detail-overlay:not([hidden]) { animation: hologramFadeIn .16s ease-out; }
    .iv-detail-overlay:not([hidden]) .iv-detail-box { animation: hologramPopIn .2s ease-out; }

    /* Lightbox: backdrop fades on open; the slide itself animates via .lb-in
       (viewer.js restarts it on open AND on prev/next for a consistent feel). */
    .lightbox-overlay.show { animation: hologramFadeIn .16s ease-out; }
    .lightbox-overlay .lb-in { animation: hologramSlideIn .2s ease-out; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
    } /* @layer legacy */
  </style>

  <!-- Settings modal is a React island (app/islands/settings); it renders the
       whole overlay into this mount point. The gear (#settingsBtn) opens it. -->
  <div id="settingsRoot"></div>

  <!-- The entire renderer SERVICE layer (i18n/ui/folders/store/bridge/menu/kind-menu/
       filter-popover/qf-pop/inspector/edit-overlay/searchbox/grid/sidebar/confirm/
       about-icon/shell, plus the logic-service wave — search/query/records/facets/cooc/
       tags/users/tab-state/listing/geometry/format/undo) is folded into the app.js bundle
       (P2): each service is a real ES module imported directly by its consumers
       (shell.ts last via app/islands/app/index.tsx, mirroring the old script
       order). theme.js stays its own pre-paint <script> (head,
       above) — it must run before first paint, which app.js (loaded at the end of body)
       cannot guarantee. -->
  <!-- All React islands, React itself, the renderer service layer, AND the boot
       orchestrator in ONE IIFE bundle: islands/build.mjs builds the app/index.tsx
       barrel, which side-effect-imports every service, every island, then (last)
       renderer/orchestrator.ts + shell.ts. orchestrator.ts owns data/state/event-
       delegation + the remaining window.hologram* bridges; each island subscribes
       and renders. Ordering is robust — orchestrator's body awaits hologramI18n so it
       stays deferred behind the synchronous island mounts, and islands pull current
       state on mount. Shared code (React / masonic / react-aria / _shared/*) is
       bundled once. -->
  <script src="islands/app.js"></script>
</body>
</html>

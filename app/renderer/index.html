  <style>
    .iv-tagn { opacity: .55; margin-left: 4px; font-size: 10px; }
    .iv-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg); cursor: pointer; margin-bottom: 8px; }
    .iv-htbtn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--fg); transition: all .15s; }
    .iv-htbtn:hover { border-color: var(--accent); color: var(--accent); }
    .iv-htbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .iv-htbtn:disabled { opacity: .5; cursor: default; }

    /* Detail popup (ℹ action): centered modal over a dim backdrop. */
    .iv-detail-overlay {
      position: fixed; inset: 0; z-index: 11000; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .iv-detail-overlay[hidden] { display: none; }
    .iv-detail-box {
      background: var(--surface); color: var(--fg); border-radius: 12px;
      padding: 18px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
      font-size: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-lg);
    }
    .iv-insp-close { float: right; border: none; background: none; font-size: 18px; line-height: 1; color: var(--muted); cursor: pointer; }
    .iv-insp-close:hover { color: var(--fg); }
    .iv-insp-title { font-size: 13px; font-weight: 600; line-height: 1.5; word-break: break-word; margin-bottom: 8px; padding-right: 20px; }
    .iv-insp-thumb { width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; display: block; }
    .iv-insp-row { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border-soft); }
    .iv-insp-k { color: var(--muted); flex: 0 0 72px; }
    .iv-insp-v { flex: 1; word-break: break-word; }
    .iv-insp-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .iv-insp-tag { background: var(--hover); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: var(--text-muted); }
    .iv-insp-open { display: inline-block; margin-top: 12px; color: var(--accent); cursor: pointer; }
    .iv-insp-open:hover { text-decoration: underline; }

    /* --- Tagging wizard --- */
    /* One image LARGE on the left; on the right ONE tag group at a time with a
       clickable group stepper (no full-vocabulary scan, no collapse-and-peek). */
    .tw-inner { max-width: 1100px; width: 100%; display: flex; flex-direction: column; max-height: 100%; }
    .tw-progress { font-size: var(--text-sm); color: var(--text-muted); font-weight: var(--weight-regular); }
    .tw-body { flex: 1; min-height: 460px; overflow: hidden; padding: 4px 2px 8px; display: flex; gap: 20px; }
    .tw-left { flex: 1.25; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .tw-right { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 2px; }
    /* the image is the protagonist: large, zoomable, and the frame HUGS the
       image (no fixed box → no letterboxing bars) */
    .tw-big { max-width: 100%; max-height: 64vh; width: auto; height: auto; align-self: center; object-fit: contain; border-radius: 8px; border: 1px solid var(--border); display: block; cursor: zoom-in; }
    .tw-meta { font-size: 12px; color: var(--text-muted); flex-shrink: 0; text-align: center; }
    .tw-meta .tw-author { font-size: 13px; font-weight: 600; color: var(--text); }
    .tw-meta .tw-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.55; color: var(--text); }
    .tw-group-name { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .tw-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    /* group stepper: every (visible) group is a clickable chip — the linear
       次へ is just the default walk; jumping is always allowed, so "done" is
       an informed choice rather than an order artifact */
    .tw-steps { display: flex; flex-wrap: wrap; gap: 4px; flex-shrink: 0; }
    .tw-step {
      border: 1px solid var(--border-strong); background: var(--surface-3); color: var(--text-muted);
      border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      transition: background .12s, color .12s, border-color .12s;
    }
    .tw-step:hover { color: var(--text); border-color: var(--accent); }
    .tw-step.on { background: var(--accent-subtle); color: var(--accent-subtle-fg); border-color: var(--accent-border); font-weight: 600; }
    .tw-step-badge {
      font-size: 10px; font-weight: 700; min-width: 16px; text-align: center;
      background: var(--accent-subtle); color: var(--accent-subtle-fg); border: 1px solid var(--accent-border);
      border-radius: 999px; padding: 0 5px;
    }
    .tw-step.on .tw-step-badge { background: var(--surface); }
    .tw-step-hid { border-style: dashed; color: var(--text-subtle); }
    /* current group's panel */
    .tw-panel { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
    .tw-panel-name { font-size: 14px; font-weight: 600; color: var(--text-strong); }
    .tw-hide-link { align-self: flex-start; background: none; border: none; padding: 0; font-size: 11px; color: var(--text-subtle); cursor: pointer; }
    .tw-hide-link:hover { color: var(--accent); text-decoration: underline; }
    /* group-visibility panel (opened from the 非表示 chip) */
    .tw-hidpanel { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
    .tw-hidrow { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
    .tw-chip {
      border: 1px solid var(--border-strong); background: var(--surface-3); color: var(--text);
      border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
    }
    .tw-chip:hover { border-color: var(--accent); }
    .tw-chip.on { background: var(--accent-subtle); color: var(--accent-subtle-fg); border-color: var(--accent-border); }
    .tw-add { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .tw-add input { flex: 1; min-width: 120px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
    .tw-add select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
    .tw-foot { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); margin-top: 4px; }
    .tw-done { text-align: center; padding: 40px 20px; color: var(--text-muted); }


    /* Inspector (ℹ): an inline right column at wide widths; below the
       breakpoint the SAME panel floats over the grid as a slide-over — it
       never disappears, only the layering changes. Esc/× closes; clicking a
       card while it is open swaps the content (double-click → gallery). */
    .inspector {
      width: 320px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
      overflow-y: auto; overscroll-behavior: contain; z-index: 25;
      background: var(--surface); border-left: 1px solid var(--border);
      padding: 16px 18px; font-size: 12px;
    }
    .inspector[hidden] { display: none; }
    .inspector:not([hidden]) { animation: corpusPanelIn .2s ease-out; }
    @media (max-width: 1279px) {
      .inspector {
        position: fixed; top: 0; right: 0;
        border-left: 1px solid var(--border-strong); box-shadow: var(--shadow-lg), var(--glass-edge);
        z-index: 9500;   /* over the content, under modals/lightbox (11000+) */
        /* Floating over the grid -> glass. The inline (wide) column stays
           solid: it sits BESIDE content, nothing to blur. High tint (88%)
           because the panel is text-dense. */
        background: var(--glass-bg-panel);
        backdrop-filter: var(--glass-filter); -webkit-backdrop-filter: var(--glass-filter);
      }
    }
    .iv-insp-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; align-items: flex-start; }
    .iv-insp-actions .iv-insp-open { margin-top: 0; }
    /* The card currently shown in the inspector — tinted ring, not solid */
    .post-card.inspected { border-color: var(--accent-border); box-shadow: 0 0 0 1px var(--accent-border); }

    /* AND/OR toggle for multi-select filters (tags) */
    .iv-andor { font-size: 11px; font-weight: 600; padding: 2px 9px; border: 1px solid var(--accent-border); border-radius: 10px; background: var(--accent-subtle); color: var(--accent-subtle-fg); cursor: pointer; margin-left: 4px; vertical-align: middle; white-space: nowrap; transition: background .12s, color .12s, border-color .12s; }
    .iv-andor:hover { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
    .iv-andor.or { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

    /* Folder chips (★ default) + management modal */
    .iv-folder-new { display: flex; gap: 6px; margin: 10px 0; }
    .iv-folder-new .search-box { flex: 1; }
    .iv-folder-list { display: flex; flex-direction: column; gap: 2px; }
    .iv-folder-empty { color: var(--muted); font-size: 12px; padding: 10px 2px; }
    .iv-folder-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--border-soft); }
    .iv-fold-name { flex: 1; word-break: break-word; }
    .iv-fold-n { color: var(--muted); font-size: 11px; }
    .iv-fold-btn { border: none; background: none; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 5px; color: var(--muted); }
    .iv-fold-btn:hover { background: var(--hover); }
    .iv-folder-modalhint { margin-top: 12px; color: var(--muted); font-size: 11px; }

    /* transient toast (e.g. "added to folder") — shared, top-level, fixed */
    .iv-toast {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(8px);
      background: rgba(20,22,26,0.68); color: #fff; padding: 9px 18px; border-radius: 20px;
      backdrop-filter: blur(16px) saturate(130%); -webkit-backdrop-filter: blur(16px) saturate(130%);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px; z-index: 12000; opacity: 0; pointer-events: none;
      transition: opacity .15s, transform .15s; box-shadow: var(--shadow-pop), inset 0 1px 0 rgba(255,255,255,0.10);
    }
    .iv-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* a11y escape hatch: solid surfaces when the OS asks for less transparency */
    @media (prefers-reduced-transparency: reduce) {
      .fold-menu, .qf-popover { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .content-activebar { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .inspector { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .lightbox-overlay { background: rgba(0,0,0,0.85); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .iv-toast { background: rgba(0,0,0,0.86); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .ws-btn, .info-btn { background: rgba(0,0,0,0.6); }
      .post-card:hover .ws-btn, .post-card:hover .info-btn { backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
  </style>

  <!-- Motion: tasteful, fast entrance/open animations layered on top of the
       existing hover transitions. Card entrance plays only on a fresh render
       (viewer.js adds .anim-in; load-more / reduced-motion skip it). Everything
       is neutralized under prefers-reduced-motion. -->
  <style>
    @keyframes corpusCardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes corpusFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes corpusPopIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes corpusSlideIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes corpusPanelIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    @keyframes corpusPillIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }

    /* Card entrance — only when the grid is (re)built fresh, e.g. filter/sort/search. */
    .post-grid.anim-in .post-card { animation: corpusCardIn .26s ease-out both; }

    /* Empty state: same slide-in as cards when first shown. */
    .empty-state.anim-in { animation: corpusCardIn .26s ease-out both; }

    /* View mode transition (card↔tile↔list): scope to the grid only so sidebar
       doesn't repaint. Old grid fades out quickly; new grid's anim-in handles
       the card entrance. ::view-transition-new gets animation:none so we don't
       double-animate with anim-in. */
    ::view-transition-old(post-grid) { animation: corpusFadeIn .12s ease-in reverse both; }
    ::view-transition-new(post-grid) { animation: none; }

    /* Detail popup (ℹ): backdrop fades, box pops in. Replays on each open because
       removing [hidden] re-mounts the element (display:none -> flex). */
    .iv-detail-overlay:not([hidden]) { animation: corpusFadeIn .16s ease-out; }
    .iv-detail-overlay:not([hidden]) .iv-detail-box { animation: corpusPopIn .2s ease-out; }

    /* Lightbox: backdrop fades on open; the slide itself animates via .lb-in
       (viewer.js restarts it on open AND on prev/next for a consistent feel). */
    .lightbox-overlay.show { animation: corpusFadeIn .16s ease-out; }
    .lightbox-overlay .lb-in { animation: corpusSlideIn .2s ease-out; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>

  <!-- Settings overlay: #panelSettings is relocated into here by viewer.js so it
       floats above either mode (the gear opens it from anywhere). -->
  <div id="settingsView" class="settings-view" hidden>
    <div class="settings-view-inner">
      <div class="settings-view-head">
        <h1 class="settings-view-title" id="settingsViewTitle">設定</h1>
        <button id="settingsClose" class="icon-btn" type="button" aria-label="閉じる" title="閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <!-- #panelSettings is appended here at runtime -->
    </div>
  </div>

  <script src="../vendor/jszip.min.js"></script>
  <script src="i18n.js"></script>
  <script src="folders.js"></script>
  <script src="search.js"></script>
  <script src="viewer.js"></script>
  <script src="shell.js"></script>
</body>
</html>

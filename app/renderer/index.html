       old membership dot). No red-for-remove: clip is a light, frequent toggle and
       the red read as too alarming (user 2026-06-27). */
    .clip-btn.in { background: var(--accent); color: #fff; }
    .clip-btn.in:hover { background: color-mix(in srgb, var(--accent) 82%, black); }
    .post-grid.list-view .clip-btn { top: 50%; right: 40px; transform: translateY(-50%); }
    /* Flyout menus: the card context menu (full action list) and the folder
       picker it opens share one look. */
    .fold-menu {
      position: fixed; z-index: 12000; min-width: 180px; max-width: 260px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      /* EXPERIMENT: real refraction — warp the backdrop via the SVG displacement filter
         (was just blur+saturate). The filter does displacement + a light blur; saturate
         stays in CSS. Falls back to no-filter if url() unsupported (bg still translucent). */
      backdrop-filter: url(#glassRefract) saturate(150%); -webkit-backdrop-filter: url(#glassRefract) saturate(150%);
      border-radius: 8px; box-shadow: var(--shadow-pop), var(--glass-edge); padding: 4px; display: none;
    }
    .fold-menu.kind-menu { z-index: 13500; }   /* above the edit modal (13000) so the 種別 menu shows on top */
    .fold-menu.show { display: block; animation: corpusPopIn 150ms var(--ease-out) both; }
    .fold-menu.qf-pop.show { display: flex; flex-direction: column; max-height: calc(100vh - var(--tabbar-h) - 16px); }
    .fold-menu .fm-row {
      display: flex; align-items: center; gap: 6px; padding: 5px 8px;
      border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--text);
    }
    /* Glass-friendly hover: a TRANSLUCENT highlight (reuses the sidebar's row-hover
       token = darken in light / lighten in dark) so the glass shows through instead of
       an opaque block floating on it. */
    .fold-menu .fm-row:hover { background: var(--sidebar-row-hover); }
    /* Light flyout text a touch darker — better contrast over the now-translucent
       refracted backdrop (dark is fine as-is). */
    html:not([data-theme="dark"]) .fold-menu .fm-row { color: var(--gray-900); }
    .fm-name { flex: 1; word-break: break-word; }
    /* High-contrast monotone check (was thin accent ✓ that read as cursive). */
    .fm-check { color: var(--text-strong); flex-shrink: 0; display: inline-flex; align-items: center; }
    .fm-check svg { display: block; }
    /* Quiet rename ✎ on the 作品/キャラ kind rows — hidden until the row is hovered
       (段階的開示), so the menu reads as a simple kind picker at rest. */
    .fm-rename { display: inline-flex; align-items: center; padding: 2px; border: 0; background: none;
      color: var(--text-subtle); cursor: pointer; border-radius: 4px; opacity: 0; flex-shrink: 0; }
    .fold-menu .fm-row:hover .fm-rename { opacity: .65; }
    .fm-rename:hover { opacity: 1; background: var(--sidebar-row-hover); color: var(--text); }
    .fm-rename svg { display: block; }
    .fm-sep { height: 1px; background: var(--border); margin: 4px 2px; }
    .fm-manage { color: var(--accent-text); }
    .fm-ic { display: flex; align-items: center; color: var(--text-muted); flex-shrink: 0; }
    .fm-ic svg { display: block; }
    /* destructive row: quiet red, stronger on hover (srgb mix — oklch turns purple on dark) */
    .fold-menu .fm-row.fm-danger { color: var(--danger); }
    .fold-menu .fm-row.fm-danger .fm-ic { color: var(--danger); }
    .fold-menu .fm-row.fm-danger:hover { background: color-mix(in srgb, var(--red-500) 14%, transparent); }
    /* Tag-kind menu (用語帳): non-interactive header + kind dots. Dot colors follow
       danbooru's tag-category convention (copyright=purple, character=green). */
    .fold-menu .fm-head { padding: 4px 8px 3px; font-size: 10px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--text-subtle); pointer-events: none; }
    .tk-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
    .tk-work { background: var(--tint-purple-bd); }
    .tk-character { background: var(--tint-green-bd); }

    /* --- ℹ detail-popup button on card (ported from image-view) --- */
    .info-btn {
      position: absolute; top: 8px; right: 8px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(20,22,26,0.42); color: #fff; border: none; font-size: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.15s;
      z-index: 1;
    }
    /* block display kills the inline-baseline slack; even 16px in the even
       28px button avoids the half-pixel that nudged the icon bottom-right */
    .info-btn svg { display: block; }
    .post-card:hover .info-btn { opacity: 1; }
    .post-grid.list-view .info-btn { top: 50%; right: 8px; transform: translateY(-50%); }

    /* --- 🏷 edit-tags button on card (third hover pill, left of ℹ/🔖). The
       2-button cap was lifted to 3 (🔖ws · ℹinfo · 🏷tags) by user call. --- */
    .tag-btn {
      position: absolute; top: 8px; right: 72px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(20,22,26,0.42); color: #fff; border: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.15s, background 0.15s;
      z-index: 1;
    }
    .tag-btn svg { display: block; }
    .post-card:hover .tag-btn { opacity: 1; }
    .post-grid.list-view .tag-btn { top: 50%; right: 72px; transform: translateY(-50%); }

    /* Liquid hover highlight: ONE accent blob shared by the two hover buttons,
       gliding between them (iPadOS pointer-style), driven by :has() — no JS.
       It sits under the buttons (earlier in DOM, same z-index), so opaque
       button states (red=remove / green=added) still win visually. */
    .act-pill {
      position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
      border-radius: 50%; pointer-events: none; z-index: 2; opacity: 0;
      /* NEUTRAL white, never accent: hover = "pointer is here" (iPadOS
         pointer / Fluent hover), accent = selected STATE. A translucent
         accent blob gliding over thumbnails read as a color smear.
         z-index 2 = ABOVE the buttons (iPadOS layers the highlight OVER
         content); under the dark glass it was nearly invisible and the
         glide could not be seen. */
      background: rgba(255,255,255,0.25);
      transition: opacity .12s;
    }
    .post-card:has(.clip-btn:hover) .act-pill { right: 40px; opacity: 1; }
    .post-card:has(.info-btn:hover) .act-pill { right: 8px; opacity: 1; }
    .post-card:has(.tag-btn:hover) .act-pill { right: 72px; opacity: 1; }
    .post-grid.list-view .act-pill { top: 50%; transform: translateY(-50%); }

    /* --- Popovers --- */
    .qf-popover {
      position: fixed; background: var(--glass-bg); border-radius: 10px;
      backdrop-filter: url(#glassRefract) saturate(150%); -webkit-backdrop-filter: url(#glassRefract) saturate(150%);
      box-shadow: var(--shadow-pop), var(--glass-edge); border: 1px solid var(--glass-border); padding: 16px;
      z-index: 1001; min-width: 260px;
    }
    /* Poster date popover: 日付の種類 / 並び替え / 期間 を小見出し付きで縦に積む。 */
    .pd-field { margin-bottom: 10px; }
    .pd-label { display: block; font-size: 10.5px; letter-spacing: .03em; color: var(--text-muted); margin-bottom: 4px; }

    /* --- App layout: content column beside the persistent left #sidebar --- */
    .app-content { flex: 1; min-width: 0; }

    /* フラットなサイドバー: セクションごとの白カード/影は低コントラストでノイズだったので撤去。
       見出し(sb-title)だけでグループを区切る。 */
    /* One left text-axis for the whole sidebar: boxed controls (search/select/
       date) start their text at 10(sidebar pad)+1(border)+12(inner pad)=23px, so
       bare text (titles, subtitles, counts) gets a 13px indent to land on the
       same axis, and pills use a 12px inner pad. */
    /* Rhythm: generous space BETWEEN sections, tight spacing inside them
       (title→content 6px, rows 4-8px) — Linear-style grouping. */
    .sb-section { padding: 0; margin-bottom: 22px; }
    /* Lower column: separate the big groups (filters / tags / clip /
       folders) by generous WHITESPACE rather than divider lines (user: no
       rules). The extra air carries the structure. */
    .sb-scroll > .sb-section { margin-bottom: 26px; }
    .sb-title {
      font-size: 11px; font-weight: 600; color: var(--text-muted-strong);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px; padding-left: 0;   /* aligns to the gutter (container) */
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    /* Active-filter bar pinned to the sidebar bottom (sticky). Holds the active filter
       pills + AND/OR toggle + reset. Shown only when at least one filter is active. */
    /* アクティブフィルタバーは .sb-scroll の外側の固定フッター（スクロールしない）。
       sticky をやめたことでスクロール時の再描画も無くなる＝カクつき低減。 */
    .sb-activebar {
      flex-shrink: 0; margin: 8px -10px 0; padding: 8px 10px;
      background: var(--surface); border-top: 1px solid var(--border);
    }
    /* Query builder = full-width top bar that spans ABOVE the sidebar+content row
       (it pierces over the sidebar's top; the sidebar starts below it). Sticks
       directly under the (sticky) tab bar. Its height feeds --activebar-h (set in
       JS) so the floating sidebar below can offset its sticky top. */
    /* Query bar = the browser toolbar row under the tabs. Mirrors Chrome:
       [◀ ▶ nav] · [rounded omnibox pill stretches to just before the count] ·
       [count + reset + help]. The pill (qb-field) GROWS to fill the space up to
       the trailing cluster (flex:1) — like a URL bar — with its tokens left-
       anchored inside and empty field space to the right. The count・reset・help
       live OUTSIDE the pill so there's no barbell gap inside the capsule. 前例:
       Chrome/Edge のアドレスバー（オムニボックスがツールバー幅いっぱいに伸びる）。 */
    .content-activebar {
      position: sticky; top: var(--tabbar-h); z-index: 40;
      flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 7px 16px;
      background: var(--sidebar-bg); border-bottom: 1px solid var(--glass-border);
    }
    .qb-nav { flex: none; display: flex; align-items: center; gap: 2px; }
    .qb-nav .icon-btn { width: 28px; height: 28px; }
    .qb-nav .icon-btn svg { width: 17px; height: 17px; }
    .qb-nav .icon-btn:disabled { opacity: .3; cursor: default; }
    .qb-nav .icon-btn:disabled:hover { background: none; color: var(--text-subtle); border-color: transparent; }
    .qb-field {
      flex: 1 1 auto; min-width: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 2px 16px 2px 14px;
      background: var(--field-bg); border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
    }
    .qb-field .qb-lead { flex: none; display: inline-flex; align-items: center; color: var(--text-muted); }
    .qb-field .qb-main { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .content-activebar .sb-activebar-title { flex: none; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .content-activebar #queryChips, .content-activebar #posterQueryChips { display: flex; flex-wrap: wrap; gap: 4px; flex: 0 1 auto; min-width: 0; justify-content: flex-start; align-items: center; }
    /* Trailing cluster sits just past the pill's right edge (outside the capsule).
       The pill grows to fill, so no auto margin is needed to push it over. */
    .content-activebar .qb-trail { flex: none; display: flex; align-items: center; gap: 8px; }
    .content-activebar .post-count { flex: none; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .content-activebar .sb-reset { flex-shrink: 0; }
    .sb-activebar-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .sb-activebar-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; flex: 1; }
    .sb-reset { font-size: 10px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--muted); cursor: pointer; }
    .sb-reset:hover { border-color: var(--accent); color: var(--accent-text); }
    /* Save-search = a feature-launch button: borderless chip fill + accent icon/text
       (DESIGN「フィーチャー起動ボタン」). The accent makes it read as an action you can
       take; the label says it outright. Was an unstyled button = looked like stray text
       and gave no hint you could save the search (user 2026-06-27). */
    .sb-save-search { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 3px 10px; border: none; border-radius: 10px; background: var(--chip-bg); color: var(--accent-text); cursor: pointer; white-space: nowrap; transition: background .12s; }
    .sb-save-search svg { color: var(--accent); }
    .sb-save-search:hover { background: var(--chip-bg-hover); }
    /* 値が入っているフィルタ欄の強調（検索・数値・日付） */
    /* 値が入っている欄の強調はパステルに（強い青の二重リングは主張しすぎ） */
    .has-value {
      border-color: color-mix(in oklch, var(--accent) 45%, var(--border)) !important;
      box-shadow: 0 0 0 2px color-mix(in oklch, var(--accent) 14%, transparent);
    }
    .sb-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    /* Feature launcher (tagging session): an explicit CTA button (Notion "+New" /
       Linear式) — defined fill + border + xs shadow, plus a hover LIFT (translateY
       + shadow) so it reads unmistakably as a press target, not a flat tinted box.
       The accent icon sits in its own soft chip so the button has a clear "head".
       (.btn-outline language — a single CTA, not a category row.) */
    .sb-feature {
      width: 100%; display: flex; align-items: center; gap: 9px;
      padding: 8px 11px; margin: 2px 0 12px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--chip-bg);
      color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: left;
      box-shadow: var(--shadow-xs);
      transition: background .12s, border-color .12s, box-shadow .12s, transform .12s;
    }
    .sb-feature:hover {
      background: var(--chip-bg-hover); border-color: var(--accent-soft);
      box-shadow: var(--shadow-sm); transform: translateY(-1px);
    }
    .sb-feature:active { transform: translateY(0); box-shadow: var(--shadow-xs); }
    /* Icon gets a soft accent chip = the button's "head" (recognisable affordance,
       like Linear's coloured glyph badge). */
    .sb-feature .sb-feature-ic {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent-text);
    }
    .sb-feature .sb-feature-ic svg { width: 15px; height: 15px; }
    .sb-feature svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--accent-text); }
    /* Value chips: FILLED pill, no outline (GitHub topics / Notion tags).
       The transparent border keeps geometry so the active tint border can
       appear without layout shift. Hover = neutral lift, never accent. */
    /* Resting chip carries a visible border — relying on bg-tint alone made chips
       vanish into the muted sidebar (recurring low-contrast complaint). A border
       is contrast-independent, so it survives any background. */
    .sb-chip {
      background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 12px;
      padding: 3px 12px; font-size: 11px; color: var(--text);
      cursor: pointer; white-space: nowrap;
      /* transition: all はスクロール時のスタイル再計算を重くするので対象プロパティを限定 */
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .sb-chip:hover { background: var(--chip-bg-hover); color: var(--text-strong); }
    /* Active = soft tint (light accent bg + accent text), NOT a saturated border —
       the hard accent border read as too loud (user). Matches the quiet filter-row
       active (accent text) for one consistent selection language across the sidebar. */
    .sb-chip.active {
      background: var(--accent-subtle); border-color: var(--accent-subtle);
      color: var(--accent-subtle-fg); font-weight: 600;
    }
    /* tag chips cycle 解除→いずれか(OR)→すべて含む(AND): AND = 濃いめのティント + ＋ prefix */
    .sb-chip.active.and {
      background: color-mix(in srgb, var(--accent) 30%, var(--surface));
      border-color: var(--accent); color: var(--accent-subtle-fg);
    }
    /* Poster tag filter (投稿者タグ②): selected chips wear the 種別 dot inline; the
       clear-all chip reads quietly (it's an action, not an active filter). */
    .poster-tag-chip { display: inline-flex; align-items: center; gap: 5px; }
    .poster-tag-clear { color: var(--text-muted); }
    .poster-tag-clear:hover { color: var(--text-strong); }

    /* Active-filter pills = one uniform GLASS material (monotone). The old
       per-type rainbow tints (qc-platform/postType/date/…) read as "color groups
       floating" against the monotone UI (報告) — dropped for a single glass pill;
       the leading icon/label still tells the type apart. */
    .sb-active-chip {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 999px; padding: 3px 10px; font-size: 12px;
      cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
      color: var(--text);
      background: color-mix(in srgb, var(--surface) 48%, transparent);
      backdrop-filter: blur(8px) saturate(160%); -webkit-backdrop-filter: blur(8px) saturate(160%);
      border: 1px solid var(--glass-rim);
      box-shadow: inset 0 1px 0.5px var(--glass-hi);
    }
    .sb-active-chip:hover { opacity: 0.7; }
    /* Dark's white glass rim (--glass-rim .16) read fainter than light's dark rim
       over the bar, so the pill looked edge-less in dark (BACKLOG). Lift dark only
       so both themes show a matching edge. */
    [data-theme="dark"] .sb-active-chip { border-color: rgba(255, 255, 255, 0.24); }
    .sb-active-chip .qc-ic { width: 12px; height: 12px; flex-shrink: 0; opacity: .72; }
    .sb-active-chip.chip-new { animation: corpusPillIn 130ms var(--ease-out) both; }
    /* 検索/フォルダの特殊ピルは「値」ではなく入力欄寄りなので角丸四角に */
    .sb-active-chip.qc-search, .sb-active-chip.qc-folder { border-radius: 6px; }
    /* Inline query builder (docs/design-query-builder.md 改訂③): conditions are
       draggable pills (.qb-pill); groups show literal parentheses (.qb-paren); the
       AND/OR between members is a clickable toggle (.qb-op); a hover ✕ (.qb-del-btn)
       removes a pill and right-click opens the negate / delete menu (.qb-menu); a
       negated pill / group shows a leading ≠. Pills reuse .sb-active-chip glass. */
    .qb-pill { position: relative; cursor: grab; }
    .qb-pill:active { cursor: grabbing; }
    .qb-pill .qb-pill-label { min-width: 0; }
    .qb-pill.neg .qb-pill-label { text-decoration: line-through; opacity: .65; }
    .qb-pill .qb-ne { color: var(--text-muted); font-weight: 600; margin-right: 1px; }
    .qb-grp { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 5px; position: relative; }
    .qb-paren { color: var(--text-subtle); font-size: 16px; line-height: 1; cursor: grab; user-select: none; align-self: center; }
    .qb-paren:active { cursor: grabbing; }
    /* AND/OR connector: a quiet, now CLICKABLE word (the old non-operative label was
       the documented pain point — making it toggle resolves it). Same for the root. */
    .qb-op { border: none; background: none; cursor: pointer; padding: 1px 5px; border-radius: 5px;
      font-size: 11px; color: var(--text-subtle); white-space: nowrap; align-self: center; }
    .qb-op:hover { background: var(--hover); color: var(--text); }
    /* Read-only 「かつ」 between the search echo and the query. */
    .qc-conn { font-size: 11px; color: var(--text-subtle); margin: 0 4px; align-self: center; pointer-events: none; }
    /* ✕ delete: tucked at the pill's right edge, INSIDE its bounds (the old ≠ corner
       badge floated outside and overlapped neighbours / the row above). Reserves its
       slot always so revealing it on hover causes no layout shift. Negate + a
       redundant delete live in the right-click menu. */
    .qb-pill:hover { opacity: 1; }   /* cancel .sb-active-chip's click-fade: plain pills no longer act on left-click */
    .qb-del-btn { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 15px; height: 15px; margin-left: 1px; margin-right: -4px; padding: 0; border: none;
      border-radius: 50%; background: none; color: var(--text-muted); cursor: pointer; opacity: 0;
      transition: opacity .12s, color .12s, background .12s; }
    .qb-pill:hover .qb-del-btn { opacity: .75; }
    .qb-del-btn:hover { opacity: 1; color: var(--danger); background: color-mix(in srgb, var(--red-500) 16%, transparent); }
    .qb-del-btn svg { display: block; }
    /* Drag affordances: dim the dragged element, light the drop target. */
    .qb-dragging { opacity: .4; }
    .qb-drop-on { outline: 2px solid var(--accent-soft); outline-offset: 2px; border-radius: 999px; }
    .qb-grp.qb-drop-on { border-radius: 8px; }
    .qb-grp.qb-drop-into { box-shadow: inset 0 0 0 1.5px var(--accent-soft); border-radius: 8px; }
    #queryChips.qb-drop-root, #posterQueryChips.qb-drop-root { box-shadow: inset 0 0 0 1.5px var(--accent-soft); border-radius: 8px; }
    /* 「グループで囲う」: wrap-the-whole-query button at the bar's right edge. */
    .qb-group-add { font-size: 13px; padding: 2px 9px; margin-left: 6px; white-space: nowrap; line-height: 1.2;
      border: 1px solid var(--border-strong); border-radius: 6px; background: var(--field-bg);
      color: var(--text-muted-strong); cursor: pointer; font-variant-numeric: tabular-nums; }
    .qb-group-add:hover { background: var(--hover); color: var(--text); }
    /* ⓘ クエリビルダの使い方ヘルプ。バーの右端＝ヘルプの定番コーナーに置く
       (margin-left:auto でチップ/リセットを左に寄せ、ⓘ だけ右へ逃がす)。 */
    .qb-help {
      flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border: none; border-radius: 50%;
      background: none; color: var(--text-subtle); cursor: pointer; transition: color .12s;
    }
    .qb-help:hover { color: var(--accent-text); }
    .qb-help-pop {
      position: fixed; z-index: 12000; display: none; max-width: 360px;
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 10px; box-shadow: var(--shadow-pop); padding: 12px 14px;
      font-size: 12px; line-height: 1.7; color: var(--text);
    }
    .qb-help-pop.show { display: block; animation: corpusPopIn .15s ease-out; }
    .qb-help-pop .qh-title { font-weight: 700; margin-bottom: 6px; }
    .qb-help-pop .qh-row { display: flex; gap: 7px; margin-top: 4px; }
    .qb-help-pop .qh-row::before { content: '・'; color: var(--text-subtle); flex-shrink: 0; }
    /* grip dots = 「ドラッグで移せる」の定番アフォーダンス（pseudo なので
       textContent には乗らない） */
    /* No permanent drag-grip glyph on pills: draggability is signalled by the
       grab cursor, the empty-zone "ここへドラッグで移動" hint and the ⓘ help.
       (The tiny ⋮⋮ read as a squashed 三 and added noise to every pill.) */
    .qf-pop .qf-vals { overflow-y: auto; flex: 1; min-height: 0; }
    .qf-find-wrap { position: relative; display: flex; align-items: center; margin: 2px 4px 4px; }
    .qf-pop .qf-find {
      width: 100%; padding: 5px 10px; font-size: 12px;
      border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface-3);
      color: var(--text); outline: none;
    }
    .qf-pop .qf-find:focus { border-color: var(--accent); }
    .qf-pop .qf-ghead { font-size: 10px; font-weight: 600; color: var(--text-muted); padding: 6px 8px 2px; }
    /* instance sub-rows nested under Misskey/Mastodon in the platform flyout */
    .qf-pop .fm-row.fm-sub { padding-left: 24px; font-size: 11px; color: var(--text-muted); }
    .qf-pop .fm-row.fm-sub .fm-name { color: inherit; }
    /* Facet count: how many current-query matches carry this value. Quiet
       tabular number, sits right of the name (which flexes) before the ✓.
       0件 → whole row greyed (still pickable); a divider marks the present→absent
       boundary on flat lists. Muted via color, never opacity (DESIGN.md). */
    .qf-pop .fm-count { flex-shrink: 0; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .qf-pop .fm-row.off { color: var(--text-muted); }
    .qf-pop .fm-row.off .fm-count { color: var(--text-subtle); }
    .qf-pop .qf-div { height: 1px; background: var(--border); margin: 5px 6px; }
    .qf-pop .qf-footer { border-top: 1px solid var(--border); padding: 2px 0; flex-shrink: 0; }
    .qf-pop .qf-footer-link { display: block; width: 100%; text-align: left; padding: 6px 10px; font-size: 12px; font-weight: 500; color: var(--accent-text); background: none; border: none; cursor: pointer; }
    .qf-pop .qf-footer-link:hover { background: var(--hover); text-decoration: underline; }
    /* --- Plan A: tag group sub-rows --- */
    /* Grid trick: animates open/close without display:none jump.
       The inner flex container needs min-height:0 to collapse below its content. */
    .sb-subrows { display: grid; grid-template-rows: 1fr; overflow: hidden;
      transition: grid-template-rows 180ms ease-out; }
    .sb-subrows.collapsed { grid-template-rows: 0fr; }
    .sb-subrows-inner { display: flex; flex-direction: column; min-height: 0; }
    @media (prefers-reduced-motion: reduce) { .sb-subrows { transition: none; } }
    .sb-subrow { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px calc(var(--sb-gutter) + 22px); font-size: 12.5px; color: var(--text); cursor: pointer; border-radius: 5px; border: none; background: none; width: 100%; text-align: left; }
    .sb-subrow:hover { background: var(--sidebar-row-hover); }
    .sb-subrow.active { color: var(--accent-text); }
    .sb-subrow-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sb-subrow-count { flex-shrink: 0; font-size: 11px; color: var(--text-muted); }
    .sb-subrow-arrow { margin-left: 4px; /* color/display/flex-shrink from shared .sb-row-arrow rule */ }
    .sb-row-disclosure { display: inline-flex; align-items: center; transition: transform 200ms ease-out; }
    .sb-row-disclosure.collapsed { transform: rotate(-90deg); }
@media (prefers-reduced-motion: reduce) { .sb-row-disclosure { transition: none; } }
    /* リアルタイム検索サジェスト（検索ボックス直下・タグ/作者候補）
       react-aria Popover: position/visibility は portal + inline style 側が持つので
       ここはパネルの見た目と行だけ。--trigger-width は react-aria が供給。 */
    .search-suggest {
      z-index: 12000; max-height: 300px; overflow-y: auto;
      min-width: var(--trigger-width);
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 8px; box-shadow: var(--shadow-pop); padding: 4px;
    }
    /* allowsEmptyCollection keeps the popover openable from a single paste event
       (open decisions see the pre-render collection); an EMPTY open is hidden here
       instead — same visible behavior as the old "no matches → no dropdown". */
    .search-suggest:not(:has(.sg-row)) { display: none; }
    .search-suggest .sg-row {
      display: flex; align-items: center; gap: 7px; padding: 5px 8px;
      border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--text);
    }
    .search-suggest .sg-row:hover, .search-suggest .sg-row[data-focused] { background: var(--hover); }
    .search-suggest .sg-ic { flex-shrink: 0; font-size: 11px; }
    .search-suggest .sg-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-suggest .sg-n { flex-shrink: 0; font-size: 10px; color: var(--text-subtle); }
  /* Filter rows: one-line category buttons; a flyout with the values opens
     beside the row. Badge = number of active filters of that type. */
  /* Category rows: borderless text rows with a soft fill ONLY on hover
     (Finder/Notion idiom). Boxing every row in a border+fill read as
     wireframe placeholders ("Wordの図形" — user-rejected). The transparent
     1px border keeps the 23px text axis geometry intact. */
  .sb-row {
    display: flex; align-items: center; gap: 7px; width: 100%;
    padding: 5px 12px; margin-bottom: 1px; text-align: left;
    background: transparent; border: 1px solid transparent;
    border-radius: 8px; color: var(--text); font-size: 12px; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .sb-row:hover { background: var(--sidebar-row-hover); }
  .sb-row .sb-row-ic { display: flex; align-items: center; color: var(--text-muted); flex-shrink: 0; transition: color .12s; }
  .sb-row .sb-row-ic svg { width: 14px; height: 14px; display: block; }
  .sb-row:hover .sb-row-ic { color: var(--text); }
  .sb-row .sb-row-name { flex: 1; }
  /* Active-filter count (AND clip count — same part). The old filled grey
     pill read as a clunky notification badge against the flat sidebar (user: ダサい);
     replaced by a PLAIN right-aligned number matching the tag sub-row counts
     (.sb-subrow-count). It marks an ACTIVE category, so it carries a touch more
     weight + the full --text ink (vs the muted passive tag counts) — "active = grey
     contrast", not a tint or a box (DESIGN.md). */
  .sb-row .sb-row-badge {
    display: none; flex-shrink: 0;
    color: var(--text); font-size: 11px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .sb-row .sb-row-badge.on { display: inline-block; }
  /* --- Disclosure arrows (single source of truth; shape = inline SVG set in HTML/JS) ---
     All ▸/▾ indicators share this token. Per-component rules keep only spacing. */
  .sb-row-arrow, .sb-subrow-arrow, .cs-btn .cs-arrow {
    color: var(--text-muted); display: inline-flex; align-items: center; flex-shrink: 0;
    pointer-events: none;
  }
  /* Flyout arrows: hover-only. */
  #filterRows .sb-row .sb-row-arrow:not(.sb-row-disclosure) { opacity: 0; transition: opacity .12s; }
  #filterRows .sb-row:hover .sb-row-arrow:not(.sb-row-disclosure),
  #filterRows .sb-row.qf-open .sb-row-arrow:not(.sb-row-disclosure) { opacity: 1; }
  /* Tag disclosure (▾ on タグ): hover-only when EXPANDED — the visible subrows already
     show the open state, so the chevron is redundant (Finder-style quiet). When COLLAPSED
     it is the only cue that hidden content exists, so keep it shown. */
  #filterRows .sb-row .sb-row-disclosure { opacity: 0; transition: opacity .12s; }
  #filterRows .sb-row:hover .sb-row-disclosure,
  #filterRows .sb-row.qf-open .sb-row-disclosure,
  #filterRows .sb-row .sb-row-disclosure.collapsed { opacity: 1; }
  /* Tag sub-rows (すべてのタグ/人物…) share the same hover-only flyout chevron */
  #filterRows .sb-subrow .sb-subrow-arrow { opacity: 0; transition: opacity .12s; }
  #filterRows .sb-subrow:hover .sb-subrow-arrow,
  #filterRows .sb-subrow.qf-open .sb-subrow-arrow { opacity: 1; }
  /* tag-group buttons: squared corners + chevron so they read as「開くもの」—
     丸ピル（タグ実体）との境界をはっきりさせる */
  /* Sub-section block (開始日/終了日 etc.): indented with a guide line sitting on
     the 23px text axis, labels at readable contrast. */
  .sb-sub {
    display: flex; flex-direction: column; gap: 2px;
    margin-left: 13px; padding-left: 10px;
    border-left: 2px solid var(--border-strong);
  }
  .sb-sub .date-input { width: 100%; }
  </style>
</head>
<body>
  <!-- "Real" Liquid Glass refraction (experiment): an SVG displacement filter that
       actually WARPS the backdrop through the glass (vs CSS blur which only softens).
       Applied to overlays that float over content (flyouts). Hidden defs. -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
    <filter id="glassRefract" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.011" numOctaves="2" seed="13" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="14" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="6"/>
    </filter>
  </svg>
  <header id="tabBar">
    <div id="tabBarInner">
      <!-- Phase 2 でタブ実装。スケルトン: ドラッグ領域の確保のみ -->
    </div>
  </header>
  <!-- Query builder: full-width top bar that spans above the sidebar (the sidebar
       starts below it). Always shown (it's also the entry point for filters). -->
  <div id="postActiveBar" class="content-activebar" style="display:none">
    <div class="qb-nav">
      <button class="icon-btn icon-btn--ghost" id="navBackBtn" type="button" aria-label="戻る" title="戻る (Alt+←)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button class="icon-btn icon-btn--ghost" id="navFwdBtn" type="button" aria-label="進む" title="進む (Alt+→)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <div class="qb-field">
      <span class="qb-lead" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></span>
      <div class="qb-main">
        <span class="sb-activebar-title" id="activebarLabel"></span>
        <div class="sb-chips" id="queryChips"></div>
      </div>
    </div>
    <div class="qb-trail">
      <span class="post-count" id="postCount"></span>
      <button class="sb-save-search" id="saveSearchBtn" type="button" title="この絞り込みを動的コレクションとして保存" style="display:none"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>検索を保存</button>
      <button class="sb-reset" id="postResetBtn" type="button">リセット</button>
      <button class="qb-help" id="qbHelpBtn" type="button"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="7.6" x2="12" y2="7.7"/></svg></button>
    </div>
  </div>
  <!-- Poster-view query bar (mirrors #postActiveBar; shown only in poster mode).
       Same inline drag query-builder, rendered by the posterQB instance. -->
  <div id="posterActiveBar" class="content-activebar" style="display:none">
    <div class="qb-field">
      <span class="qb-lead" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></span>
      <div class="qb-main">
        <div class="sb-chips" id="posterQueryChips"></div>
      </div>
    </div>
    <div class="qb-trail">
      <button class="sb-reset" id="posterResetBtn" type="button">リセット</button>
    </div>
  </div>
  <div id="appBody">
  <aside id="sidebar">
    <div id="side-post" class="side-controls">
      <!-- Posts controls (the only post-mode view; hashtags/users folded into the
           sidebar's タグ/作者 sections + search, settings moved to the gear) -->
      <div class="tab-controls active" id="controls-posts">
        <!-- Selection bar: pinned at the very top of the sidebar (outside the
             scroll area) so the bulk actions stay reachable while scrolling. -->
        <div class="selection-bar" id="selectionBar" style="display:none;">
          <span class="post-count" id="selectedCount"></span>
          <button class="btn-outline" id="selectAllBtn"></button>
          <button class="btn-outline" id="tagSelectedBtn"></button>
          <button class="btn-outline" id="folderSelectedBtn"></button>
          <button class="btn-outline" id="groupSelectedBtn"></button>
          <button class="btn-danger" id="deleteSelectedBtn"></button>
          <button class="btn-outline" id="cancelSelectBtn"></button>
        </div>
        <div class="sb-scroll">
        <!-- Browse-mode switch: ライブラリ（投稿グリッド）↔ 投稿者（投稿者グリッド）。
             サイドバー先頭に常設（両モードで表示・body.browse-posters の非表示対象に入れない）。
             segmented control = macOS式の凹トラック＋浮きつまみ（密度トグルと同語彙、
             ただし広域セレクタ衝突を避けるため id で別管理）。前例: Bluesky/Xのプロフィールタブ。 -->

    /* ============================================================
       === Glass material system — pick the tier by WHAT IS BEHIND ===
       Utility layer (defined LAST so it wins source-order over component
       rules like .fold-menu). Host must set its own `position` so the
       ::before sheen anchors to it.
         A .glass-lens  — rich content behind (over cards): read THROUGH it.
                          High transparency + light blur. Text-dense hosts
                          should bump opacity (see .kb-hint-pop.glass-lens).
         B .glass-frost — sparse/low-contrast behind (pulldown over sidebar):
                          mid opacity + strong blur MANUFACTURES the frost so
                          it reads as glass without busy content behind it.
         C .glass-relief— nothing behind (toggle on the flat Mica sidebar):
                          a baked top-light gradient + the shared specular
                          sell the glass with almost no help from the backdrop.
       ============================================================ */
    /* All material values come from --glass-* tokens (design-tokens.css), which
       are defined in BOTH themes — so light & dark can never drift apart. No
       hardcoded rgba here. */
    .glass-lens, .glass-frost, .glass-relief { isolation: isolate; }
    .glass-lens::before, .glass-frost::before, .glass-relief::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      pointer-events: none; z-index: -1;
      background: var(--glass-sheen);
    }
    .glass-lens {
      background: color-mix(in srgb, var(--surface) 14%, transparent);
      backdrop-filter: blur(8px) saturate(185%) brightness(1.05);
      -webkit-backdrop-filter: blur(8px) saturate(185%) brightness(1.05);
      border: 1px solid var(--glass-rim);
      box-shadow: inset 0 1px 0.5px var(--glass-hi), var(--glass-drop);
    }
    .glass-frost {
      background: color-mix(in srgb, var(--surface) 55%, transparent);
      backdrop-filter: blur(18px) saturate(165%) brightness(1.04);
      -webkit-backdrop-filter: blur(18px) saturate(165%) brightness(1.04);
      border: 1px solid var(--glass-rim);
      box-shadow: inset 0 1px 0.5px var(--glass-hi), var(--glass-drop);
    }
    .glass-relief {
      /* baked light gradient = the refraction a backdrop would give, painted in
         so the glass works on a flat surface (no backdrop needed) */
      background: var(--glass-relief-bg);
      backdrop-filter: blur(6px) saturate(150%);
      -webkit-backdrop-filter: blur(6px) saturate(150%);
      border: 1px solid var(--glass-rim);
      box-shadow: inset 0 1px 0.5px var(--glass-hi), var(--glass-drop-sm);
    }

    /* a11y escape hatch: solid surfaces when the OS asks for less transparency */
    @media (prefers-reduced-transparency: reduce) {
      .fold-menu, .qf-popover { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .glass-lens, .glass-frost, .glass-relief { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .glass-lens::before, .glass-frost::before, .glass-relief::before { background: none; }
      .sb-active-chip { background: var(--surface-3); backdrop-filter: none; -webkit-backdrop-filter: none; border-color: var(--border); }
      .content-activebar { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .inspector { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }

  <!-- Motion: tasteful, fast entrance/open animations layered on top of the
       existing hover transitions. Card entrance plays only on a fresh render
       (viewer.js adds .anim-in; load-more / reduced-motion skip it). Everything
       is neutralized under prefers-reduced-motion. -->
  <style>
    @keyframes corpusCardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes corpusFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes corpusPopIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes corpusSlideIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes corpusPanelIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    @keyframes corpusPillIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
    /* Card entrance — only when the grid is (re)built fresh, e.g. filter/sort/search.
       Fill is `backwards`, NOT `both`: the grid keeps .anim-in until the next render,
       so a forwards fill would pin the final `transform: none` on every card forever —
       and an animation's value outranks the `:hover` rule, which silently killed the
       hover-scale lift. `backwards` still holds the hidden pre-start state but stops
       contributing a transform once the run ends, so :hover scale works again. */
    .post-grid.anim-in .post-card { animation: corpusCardIn .26s ease-out backwards; }

    /* Empty state: same slide-in as cards when first shown. */
    .empty-state.anim-in { animation: corpusCardIn .26s ease-out both; }

    /* View mode transition (card↔tile↔list): scope to the grid only so sidebar
       doesn't repaint. Old grid fades out quickly; new grid's anim-in handles
       the card entrance. ::view-transition-new gets animation:none so we don't
       double-animate with anim-in. */
    ::view-transition-old(post-grid) { animation: corpusFadeIn .12s ease-in reverse both; }
    ::view-transition-new(post-grid) { animation: none; }
    /* The post-grid snapshot renders in the TOP LAYER and would cover the sticky
       active-filter bar (content shows through it on mode switch — ユーザー報告).
       Promote the bar to its own snapshot group above the grid so it stays put. */
    .content-activebar { view-transition-name: corpus-activebar; }
    ::view-transition-group(corpus-activebar) { z-index: 2; }
    ::view-transition-old(corpus-activebar), ::view-transition-new(corpus-activebar) { animation: none; }
    /* Same top-layer cover for the rest of the persistent chrome: once the page is
       scrolled, the post-grid snapshot's box starts above the viewport, so in the
       top layer it paints over the tab bar / sidebar (query builder) / back-to-top
       and the grid shows "through" them on mode switch (ユーザー報告: タブ・クエリ
       ビルダーが透ける). Promote each to its own static group above the grid. */
    #tabBar { view-transition-name: corpus-tabbar; }
    ::view-transition-group(corpus-tabbar) { z-index: 3; }
    ::view-transition-old(corpus-tabbar), ::view-transition-new(corpus-tabbar) { animation: none; }
    #sidebar { view-transition-name: corpus-sidebar; }
    ::view-transition-group(corpus-sidebar) { z-index: 2; }
    ::view-transition-old(corpus-sidebar), ::view-transition-new(corpus-sidebar) { animation: none; }
    #contentTop { view-transition-name: corpus-backtotop; }
    ::view-transition-group(corpus-backtotop) { z-index: 3; }
    ::view-transition-old(corpus-backtotop), ::view-transition-new(corpus-backtotop) { animation: none; }

    /* Detail popup (ℹ): backdrop fades, box pops in. Replays on each open because
       removing [hidden] re-mounts the element (display:none -> flex). */
    .iv-detail-overlay:not([hidden]) { animation: corpusFadeIn .16s ease-out; }
    .iv-detail-overlay:not([hidden]) .iv-detail-box { animation: corpusPopIn .2s ease-out; }

    /* Lightbox: backdrop fades on open; the slide itself animates via .lb-in
       (viewer.js restarts it on open AND on prev/next for a consistent feel). */
    .lightbox-overlay.show { animation: corpusFadeIn .16s ease-out; }
    .lightbox-overlay .lb-in { animation: corpusSlideIn .2s ease-out; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>

       once by islands/build.mjs and loaded FIRST so islands (built with React
       externalized) reach window.React/ReactDOM/… instead of each inlining its
       own ~186KB copy. Must precede the first island script. -->
  <script src="islands/vendor-react.js"></script>
  <!-- Image lightbox / gallery: React owns the overlay UI; viewer.js resolves a
       post's gallery items and calls window.corpusLightbox.open(). Loaded BEFORE
       viewer.js so its init can push the nav-button labels. -->
  <script src="islands/lightbox.js"></script>
  <script src="viewer.js"></script>
  <script src="islands/settings.js"></script>
  <!-- Sidebar tag-group subrows: React owns rendering, viewer.js owns data+events. -->
  <script src="islands/sidebar-tags.js"></script>
  <!-- Query-builder active bars: React owns chip rendering, viewer.js owns the
       tree state + qbNodeMap + drag/click/contextmenu delegation. -->
  <script src="islands/query-chips.js"></script>
  <!-- Tab strip: React owns tab rendering, viewer.js owns the tabs array +
       activeTabId + rename state + click/auxclick/contextmenu/rename delegation. -->
  <script src="islands/tabs.js"></script>
  <!-- Collection grid: React owns card rendering, viewer.js owns the collection
       list + records/thumbs + count badge + click/contextmenu delegation. -->
  <script src="islands/collections.js"></script>
  <!-- Search box + suggest dropdown (react-aria ComboBox): the island owns the
       input + dropdown UI (rendering, keyboard nav, open/close, positioning);
       value = corpusStore 'searchQuery', data/actions via window.corpusSearchBox. -->
  <script src="islands/searchbox.js"></script>
  <!-- Poster grid: React owns card rendering, viewer.js owns posterList + count +
       density classes + inspected highlight + click/contextmenu delegation. -->
  <script src="islands/posters.js"></script>
  <!-- Virtualized post grid (all three views): React owns cell rendering +
       windowing (masonic) inside its own #postGridReact host; viewer.js owns
       viewGroups, the container classes, and all delegated #postGrid events
       (via window.corpusGrid). -->
  <script src="islands/grid.js"></script>
  <!-- Sidebar toolbar controls (search-mode segment; view-density toggle): React
       owns rendering, state lives in window.corpusSearch / window.corpusStore. -->
  <script src="islands/toolbar.js"></script>
  <!-- Right-click context menus: React owns the glass popup rendering, viewer.js owns
       the items + actions (via window.corpusContextMenu). -->
  <script src="islands/context-menu.js"></script>
  <!-- 種別 (tag-kind) menu: React owns the glass popup rendering (header + pick/rename
       rows), viewer.js owns the row model + pick/rename actions (kind-menu.js bridge). -->
  <script src="islands/kind-menu.js"></script>
  <!-- Date / engagement / poster-date-range popovers: React owns the form rendering
       (fields + apply/remove), viewer.js owns the field values + apply/remove actions
       (via window.corpusFilterPopover). -->
  <script src="islands/filter-popover.js"></script>
  <!-- Sidebar filter value flyout (qf-pop): React owns the list/find/segment/footer
       rendering, viewer.js owns the facet logic (qfValues) + pick routing (via
       window.corpusQfPop). -->
  <script src="islands/qf-pop.js"></script>
  <!-- Post/poster inspector panel: React owns the detail body + inline tag editor
       rendering, viewer.js owns the panel's hidden/insp-open chrome + all business
       logic (persistence, undo, homonym detection, poster folders) via
       window.corpusInspector. -->
  <script src="islands/inspector.js"></script>
  <!-- Bulk "add tags to selection" modal: React owns the label/chips/add-row/picker/
       cancel/save rendering, viewer.js owns the backdrop show/hide + selection/
       persistence/undo via window.corpusEditOverlay. -->
  <script src="islands/edit-overlay.js"></script>
  <script src="shell.js"></script>
</body>
</html>

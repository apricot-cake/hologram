<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' asset: data: blob:; media-src 'self' asset: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none';">
  <title>Hologram</title>
  <!-- Cascade-layer order for the shadcn/Tailwind coexistence (trial branch):
       every legacy <style> below is wrapped in @layer legacy, slotted BETWEEN
       Tailwind's base (preflight) and components/utilities. So legacy rules
       still beat the preflight reset (legacy screens keep their look), while
       shadcn component utilities beat the legacy universal reset. This first
       declaration pins the relative order; the Tailwind sheet injected by
       islands/app.js declares the same names minus `legacy` and merges in. -->
  <style>@layer theme, base, legacy, components, utilities;</style>
  <link rel="stylesheet" href="design-tokens.css">
  <!-- Island CSS (settings layout) is bundled into islands/app.js and injected at
       runtime as a <style> (CSP style-src allows unsafe-inline) — no <link> needed. -->
  <script src="theme.js"></script>
  <style>
    @layer legacy {
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* --- Design tokens (colours, type, spacing, light/dark) live in
       design-tokens.css, linked above. Legacy var names (--fg / --muted /
       --border-soft …) are aliased there onto the new semantic tokens, so the
       rules below keep working while picking up the new palette + dark mode. --- */

    body {
      font: 14px/1.6 var(--font-sans);
      background: var(--bg); color: var(--fg);
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    #tabBar {
      height: var(--tabbar-h); flex-shrink: 0; display: flex; align-items: center;
      -webkit-app-region: drag;
      background: var(--tabbar-bg);
      /* No bottom divider line: the tab strip already steps in tone from the band
         below (tabbar-bg vs sidebar-bg), and the active tab connects into it —
         Chrome draws no hard rule between the strip and the toolbar. */
      position: sticky; top: 0; z-index: 50;
    }
    #tabBarInner > * { -webkit-app-region: no-drag; }
    #tabBarInner {
      box-sizing: border-box;
      min-width: 0; flex: 1; display: flex; align-items: flex-end;
      align-self: stretch;
      /* The window buttons and the inspector toggle are both pinned to the window's
         top-right rather than sitting in this row's flow, so reserve their width to keep
         tabs from running under them — plus the grab gutter that leaves a draggable patch
         even when many tabs fill the row. */
      padding: 0 calc(var(--window-controls-w, 138px) + var(--inspector-toggle-w, 48px) + var(--tabbar-drag-gutter, 88px)) 0 8px;
      gap: 0;
    }
    /* …unless the inspector is open: the panel is wider than that chrome, so the band ends
       well before it and only the grab gutter is still owed. Without this the reservation
       would eat a third of the tab row for buttons that aren't over it. */
    #tabBarInner.has-inspector { padding-right: var(--tabbar-drag-gutter, 88px); }
    /* Window tabs (Phase 2) — Chrome tab-strip anatomy: all tabs share one
       32px bottom-flush box (one text axis); inactive hover = floating pill
       inset within the box; active = connected to the band below with
       concave "ears" at both bottom corners. */
    .tab-item {
      position: relative; display: flex; align-items: center;
      height: 34px; flex: 1 1 0; max-width: 200px; min-width: 0;
      padding: 0 8px 0 10px;
      background: transparent; border: none; border-radius: 8px;
      cursor: pointer; color: var(--text-muted-strong); font-size: 12px;
      transition: color .12s; overflow: hidden;
      user-select: none;   /* .tab-item is a div now; dblclick = rename, not text selection */
    }
    .tab-body {
      display: flex; align-items: center; gap: 6px;
      flex: 1; min-width: 0; overflow: hidden; white-space: nowrap;
    }
    /* Hover pill — floats centered inside the tab box */
    .tab-item::before {
      content: ''; position: absolute; inset: 3px 2px;
      border-radius: 7px; background: transparent;
      transition: background .12s; pointer-events: none;
    }
    /* ALL children above the ::before pill (icon/title/close/rename input) */
    .tab-item > * { position: relative; z-index: 1; }
    .tab-item.pinned:not(.active) { color: var(--accent-text); }
    .tab-item.pinned:not(.active)::before { background: var(--accent-subtle); }
    .tab-item:hover:not(.active) { color: var(--text); }
    /* Hover pill colour: midway between the bar (--bg) and the band
       (--sidebar-bg) — Chrome's hierarchy. var(--hover) collides with
       --sidebar-bg in dark mode (both #202226), which would make a hovered
       inactive tab look exactly like the active one. */
    .tab-item:hover:not(.active)::before { background: color-mix(in srgb, var(--sidebar-bg) 60%, var(--bg)); }
    /* Active tab: connected to the band below, Chrome-style concave ears */
    .tab-item.active {
      background: var(--sidebar-bg); color: var(--text);
      border-radius: 8px 8px 0 0; overflow: visible; z-index: 1;
    }
    /* Ear geometry: fill OUTSIDE a quarter-circle whose center sits at the
       square's corner TOUCHING THE BAR BG (top-left for the left ear,
       top-right for the right ear) — the filled sliver hugs the tab wall
       and the band, the transparent bulk shows the bar. */
    .tab-item.active::before {
      inset: auto; bottom: 0; left: -8px;
      width: 8px; height: 8px; border-radius: 0;
      background: radial-gradient(circle 8px at top left, transparent 7.5px, var(--sidebar-bg) 8px);
      transition: none;
    }
    .tab-item.active::after {
      content: ''; position: absolute;
      bottom: 0; right: -8px;
      width: 8px; height: 8px;
      background: radial-gradient(circle 8px at top right, transparent 7.5px, var(--sidebar-bg) 8px);
      pointer-events: none;
    }
    .tab-icon { width: 12px; height: 12px; flex-shrink: 0; opacity: .7; display: flex; align-items: center; }
    .tab-item.active .tab-icon { opacity: 1; }
    .tab-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
    .tab-close {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer; padding: 0;
      color: var(--text-muted); opacity: 0; transition: opacity .12s, background .1s, color .1s;
    }
    .tab-item.active .tab-close { opacity: 1; }
    .tab-item:not(.active):hover .tab-close { opacity: .7; }
    .tab-close:hover { background: var(--hover); color: var(--text); opacity: 1 !important; }
    .tab-new {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px;
      /* Vertically centered in the bar (tabs are flex-end / bottom-flush, so the
         + needs align-self:center to sit on the bar's mid-line), with a small
         gap from the last tab. */
      align-self: center; margin-left: 6px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      transition: background .12s, color .12s;
    }
    .tab-new:hover { background: var(--hover); color: var(--text); }
    .tab-rename-input { flex: 1; min-width: 0; font-size: 12px; font-weight: 500; border: none; outline: none; background: transparent; color: inherit; padding: 0; user-select: text; /* parent .tab-item is user-select:none */ }
    #appBody {
      display: flex; flex: 1; min-height: 0;
      /* 背景グリッド（方眼）。線色は --text 混色でライト/ダーク自動追従。26px セル。
         コンテンツの背後に薄く敷く控えめなテクスチャ。background-attachment: fixed
         でビューポートに固定＝コンテンツがスクロールしてもグリッドは動かない
         （紙の方眼の上をカードが滑る感じ）。 */
      background-image:
        linear-gradient(to right, color-mix(in srgb, var(--text) 8%, transparent) 1px, transparent 1px),
        linear-gradient(to bottom, color-mix(in srgb, var(--text) 8%, transparent) 1px, transparent 1px);
      background-size: 26px 26px;
      background-attachment: fixed;
    }

    /* --- Single left sidebar (Claude-Desktop style): brand + mode nav at the
       top, then the active mode's controls below. One column, no second rail. --- */
    #sidebar {
      /* --sb-gutter = the ONE horizontal inset for the whole column. Every
         item's box aligns to it (the scroll owns the inset; items are full
         width within, no per-element left padding). Change it here and the
         entire column's left/right axis moves together. */
      --sb-gutter: 12px;
      width: 248px; flex-shrink: 0; z-index: 30;
      /* Floating "window" sidebar (Claude-app style): rounded card with a margin on
         all sides. appBody is a fixed-height flex row (the content area scrolls, not
         the page), so the sidebar just stretches to it — no sticky needed. */
      margin: var(--sidebar-float);
      /* Flat fill — the vertical gradient was dropped (user). */
      background-color: var(--sidebar-bg);
      display: flex; flex-direction: column; padding: 14px 10px 0; gap: 2px;
      overflow: hidden;   /* スクロールは内側の .sb-scroll が担当（角丸でクリップ） */
      /* Window-like: a defined rim + lift (replaces the old 1px content hairline). */
      border: 1px solid var(--float-border);
      border-radius: 14px;
      box-shadow: var(--shadow-md);
    }
    /* Settings gear pinned bottom-left of the sidebar (title/theme button removed;
       theme moved into Settings). */
    .sidebar-footer { flex-shrink: 0; display: flex; align-items: center; margin: 4px -10px 0; padding: 8px 10px; border-top: 1px solid var(--border); }
    .icon-btn {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .12s, color .12s, border-color .12s;
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); border-color: var(--border-strong); }
    .icon-btn svg { width: 15px; height: 15px; }
    /* Ghost variant: keeps the SAME 26×26 box (so size/edges stay aligned with
       siblings by construction), only lightens the chrome — no border/fill, muted
       ink that warms on hover. Use for secondary icon buttons in a row of icons. */
    .icon-btn--ghost { border-color: transparent; background: none; color: var(--text-subtle); }
    .icon-btn--ghost:hover { border-color: transparent; background: var(--hover); color: var(--text); }

    /* Keyboard-shortcut hint: hover the ? button to see all shortcuts */
    .kb-hint-wrap { position: relative; display: flex; align-items: center; margin-left: 6px; }
    .kb-hint-pop {
      display: none; position: fixed; bottom: 52px; left: 14px;
      border-radius: 10px; padding: 12px 14px; z-index: 12000; white-space: nowrap;
    }
    .kb-hint-wrap:hover .kb-hint-pop { display: block; animation: hologramPopIn var(--dur-pop) var(--ease-out); }
    /* Floating-surface materials (.pop-solid / .glass-chrome) are defined as a
       utility layer at the END of this stylesheet so they win source-order over
       component rules like .fold-menu. See "=== Floating-surface materials ===". */
    .kb-hint-head { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .kb-hint-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
    .kb-hint-grid kbd {
      font-size: 10.5px; font-family: ui-monospace, monospace;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 4px; padding: 2px 6px; color: var(--text); white-space: nowrap;
      /* hug the key label (grid items stretch to the column otherwise) + keycap bevel */
      justify-self: start; min-width: 20px; text-align: center; box-sizing: border-box;
      box-shadow: inset 0 -1px 0 var(--border);
    }
    .kb-hint-grid span { font-size: 11.5px; color: var(--text); font-weight: 400; }

    /* Settings overlay (opened by the brand-bar gear; floats above either mode) */
    /* Settings: centered modal over a dimmed backdrop (was a fullscreen page) */
    .settings-view {
      position: fixed; inset: 0; z-index: 11000; background: var(--overlay);
      display: flex; align-items: center; justify-content: center; padding: 36px;
    }
    .settings-view[hidden] { display: none; }
    .settings-view:not([hidden]) { animation: hologramFadeIn .16s ease-out; }
    .settings-view-inner {
      width: 100%; max-width: 880px; max-height: 100%; overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--float-border); border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 4px 32px 40px;
    }
    /* Settings search (in the sticky head) + side TOC + scrollable panel. */
    .settings-search-wrap { position: relative; flex: 1; max-width: 280px; margin: 0 14px 0 18px; display: flex; align-items: center; }
    .settings-search-ic { position: absolute; left: 10px; width: 14px; height: 14px; color: var(--text-muted); pointer-events: none; }
    .settings-search { width: 100%; padding: 6px 10px 6px 30px; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); outline: none; }
    .settings-search:focus { border-color: var(--accent); }
    /* Master-detail: the TOC is the persistent left nav; the right pane shows
       only the selected section as its own "page" (no long scroll). */
    .settings-body { display: flex; align-items: stretch; gap: 0; }
    .settings-toc { flex-shrink: 0; width: max-content; min-width: 150px; display: flex; flex-direction: column; gap: 1px; padding-right: 22px; border-right: 1px solid var(--border-subtle); }
    .settings-toc .toc-item { text-align: left; border: none; background: transparent; color: var(--text-muted); font-size: 13px; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: background .12s, color .12s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .settings-toc .toc-item:hover { background: var(--hover); color: var(--text); }
    .settings-toc .toc-item.active { color: var(--text-strong); font-weight: 600; background: var(--hover); }
    .settings-toc .toc-item[hidden] { display: none; }
    .settings-view #panelSettings { display: block; flex: 1; min-width: 0; max-width: none; padding-left: 26px; }
    /* One page = one section card; drop the inter-section margin in single-page mode. */
    .settings-view .section { margin-bottom: 16px; }
    .settings-view .section:last-child { margin-bottom: 0; }
    /* Search hit highlight inside the settings panel — pinpoints the matching item
       within a surfaced section (esp. the long データ section). Soft accent tint. */
    .settings-view mark.set-hl { background: var(--accent-subtle); color: var(--accent-subtle-fg); border-radius: 3px; padding: 0 1px; }
    .settings-empty { display: none; padding: 28px 6px; color: var(--text-muted); font-size: 13px; }
    .settings-empty:not([hidden]) { display: block; }
    /* Narrow: keep the TOC reachable (else pages can't be switched) — stack it
       as a horizontal chip row above the page. */
    @media (max-width: 680px) {
      .settings-body { flex-direction: column; }
      .settings-toc { width: auto; flex-direction: row; flex-wrap: wrap; gap: 4px; padding: 0 0 12px; border-right: none; border-bottom: 1px solid var(--border-subtle); margin-bottom: 14px; }
      .settings-view #panelSettings { padding-left: 0; }
      .settings-search-wrap { max-width: none; }
    }
    .settings-view:not([hidden]) .settings-view-inner { animation: hologramPopIn .2s ease-out; }
    .settings-view-head {
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: transparent; padding: 12px 0 14px;
      z-index: 1; margin-bottom: 4px;
    }
    .settings-view-title { font-size: var(--text-2xl); font-weight: var(--weight-semibold); color: var(--text-strong); }
    .settings-view-head .icon-btn { width: 30px; height: 30px; }
    .settings-view-head .icon-btn svg { width: 17px; height: 17px; }
    /* About panel: centered "this app" card (live holographic icon over name/version).
       Anchored on the macOS/Windows "About <app>" dialog — big app icon, then name,
       version and a one-line descriptor stacked below it. */
    .about-card { display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: 14px; padding: 24px 0 10px; }
    /* Deliberately undecorated: no radius, no shadow, no gloss — it should read as a
       plain flat square image, so the fact that it is quietly animating is a surprise. */
    .about-icon { width: 176px; height: 176px; }
    .about-icon canvas { display: block; width: 100%; height: 100%; }
    .about-name { font-size: 24px; font-weight: var(--weight-semibold); color: var(--text-strong); letter-spacing: .2px; }
    .about-version { font-size: var(--text-sm); color: var(--text-muted); margin-top: -8px; }
    .about-tagline { font-size: var(--text-sm); color: var(--text-muted); max-width: 36em; line-height: 1.55; text-wrap: balance; }
    .about-meta { font-size: 11px; color: var(--text-subtle); font-variant-numeric: tabular-nums; margin-top: 2px; }
    .about-links { display: flex; gap: 16px; margin-top: 4px; }
    .about-links a { font-size: var(--text-sm); color: var(--accent-text); text-decoration: none; }
    .about-links a:hover { text-decoration: underline; }
    /* Settings rows (Settings → 外観) */
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--text); cursor: pointer; }
    .side-controls { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    /* スクロールするのは内側の .sb-scroll だけ。アクティブフィルタバーはその外側の
       固定フッターにして、スクロールバーがバーに被らないようにする。 */
    /* 左: ガター6px（チェックボックスの negative margin が overflow で見切れない
       よう padding 側に逃がす。位置は margin-left で相殺＝従来どおり）。
       右: コンテンツとスクロールバーの間に 8px の余白。 */
    .sb-scroll {
      flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
      /* The gutter lives HERE (single source). 6px is the negative-margin
         escape for select-ring overflow; 8px is the scrollbar gap. */
      margin-left: -6px;
      /* Right gutter was 8px+gutter PLUS the 10px transparent scrollbar, so items
         hugged the left (左右の余白が非対称・報告). The scrollbar already supplies
         the visual right gap, so keep padding-right minimal to balance the edges. */
      padding-left: calc(6px + var(--sb-gutter)); padding-right: 4px;
      padding-bottom: 16px;
    }
    #sidebar select, #sidebar input.search-box { width: 100%; }

    #appMain { flex: 1; min-width: 0; min-height: 0; display: flex; overflow: hidden; }
    /* The content area is the scroll container (not the page): the scrollbar stays
       inside the grid column, never crossing the tab/query bands or the sidebar.
       scrollbar-gutter:stable keeps the column width from jumping ±10px as the bar
       toggles (the tile slider's column-fit math depends on a stable width). */
    #mode-post { flex: 1; min-width: 0; min-height: 0; padding: 24px 32px; overflow-y: auto; overflow-anchor: none; scrollbar-gutter: stable; }

    /* --- Modern scrollbars (Chromium/Electron). NOTE: setting the standard
       `scrollbar-width` property disables these ::-webkit-scrollbar rules in
       Chromium, so style scrollable areas via padding, not scrollbar-width. --- */
    ::-webkit-scrollbar { width: var(--scrollbar-w); height: var(--scrollbar-w); }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in oklch, var(--text-subtle) 55%, transparent); border-radius: 8px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: color-mix(in oklch, var(--text-muted) 70%, transparent); background-clip: padding-box; }
    ::-webkit-scrollbar-corner { background: transparent; }

    /* Sidebar scrollbar: auto-hide (macOS / Claude-Desktop overlay language).
       A permanently-visible thumb drew a vertical line down the sidebar's right
       edge that broke the tab → query-builder → sidebar surface into pieces
       (ユーザー指摘). At rest the thumb is fully transparent so the --sidebar-bg
       plane reads as one continuous surface; it fades in only while the pointer
       is over the sidebar or a field inside it is focused. The track is already
       transparent and the 10px width is unchanged, so nothing shifts — the bar
       just stops being visible when idle. Position stays on the right (natural). */
    .sb-scroll::-webkit-scrollbar-thumb { background: transparent; transition: background .18s ease; }
    .sb-scroll:hover::-webkit-scrollbar-thumb,
    .sb-scroll:focus-within::-webkit-scrollbar-thumb {
      background: color-mix(in oklch, var(--text-subtle) 45%, transparent); background-clip: padding-box;
    }
    .sb-scroll::-webkit-scrollbar-thumb:hover {
      background: color-mix(in oklch, var(--text-muted) 70%, transparent); background-clip: padding-box;
    }

    #panelSettings { max-width: 720px; }

    /* The tab row was removed (one post view). #panelPosts keeps .tab-panel and
       #controls-posts keeps .tab-controls as the single always-active set. */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    /* Per-tab control set in the sidebar; only the active tab's controls show. */
    .tab-controls { display: none; }
    .tab-controls.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

    /* --- Toolbar (stacked in the sidebar) --- */
    .toolbar {
      display: flex; flex-direction: column; align-items: stretch; gap: 18px;
      margin-bottom: 18px;   /* same inter-section rhythm as .sb-section */
    }
    .toolbar select { width: 100%; }
    .toolbar .view-toggle, .toolbar > .chip { align-self: flex-start; }
    /* 件数はサイドバー左下（設定の歯車の隣）に常駐。subtle だと読めないと
       指摘があったので muted（セカンダリの標準）まで上げる */
    .sidebar-footer .post-count { font-size: 12px; color: var(--text-muted); }
    .mirror-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); margin-left: 8px; white-space: nowrap; overflow: hidden; max-width: 150px; }
    .mirror-status .ms-ic { flex-shrink: 0; }
    .mirror-status .ms-body { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .mirror-status .ms-t { overflow: hidden; text-overflow: ellipsis; }
    .mirror-status .ms-time { font-size: 9.5px; color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; }
    .mirror-status.is-error { color: var(--danger); }
    .mirror-status.is-syncing { color: var(--accent-text); }
    .mirror-status.is-syncing .ms-ic { animation: ms-spin 0.9s linear infinite; }
    @keyframes ms-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .mirror-status.is-syncing .ms-ic { animation: none; } }
    /* Unified field anatomy (motion-study canvas 2026-07-05): 32px / r8 /
       recessed fill (--field-bg + inset shadow) + visible border. */
    .search-box {
      width: 100%; box-sizing: border-box; height: 32px;
      padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md);
      background: var(--field-bg); color: var(--text);
      box-shadow: inset 0 1px 2px rgba(16, 19, 26, 0.05);
      font-size: 14px; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    [data-theme="dark"] .search-box { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3); }
    .search-box:focus {
      border-color: var(--accent); background: var(--surface);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--sky-500) 32%, transparent);
    }
    /* Search field + leading magnifier (macOS search-field anatomy). */
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-wrap .search-ico {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; fill: none; stroke: var(--text-subtle);
      stroke-width: 2; stroke-linecap: round; pointer-events: none;
    }
    .search-wrap .search-box { padding-left: 31px; }
    .search-wrap .search-cb { width: 100%; }   /* react-aria ComboBox wrapper — the input fills the wrap */
    /* Search-mode toggle = macOS segmented control (recessed track + raised thumb):
       both options stay visible, so the state AND the switch read at a glance — the
       old lone right-edge chip didn't look like a toggle (BACKLOG: 発見性が低い).
       Shared by the main search box and, compact, the filter flyout (.seg-control--qf).
       Labels are behavior-words (ぴったり/おおまか) + a one-line hint (DESIGN「声と語り口」). */
    /* Full-width = the control spans the same width as the input bar directly above
       it (the search box in the sidebar, the 絞り込み find box in the flyout) so they
       line up as one block (user 2026-07-04). The thumb slide is an inline transform
       set by the island (fuzzy=left / exact=right). Each option names itself via a
       .ui-tip tooltip on hover. */
    .seg-control {
      position: relative; display: grid; grid-template-columns: 1fr 1fr;
      background: var(--seg-track); border-radius: var(--radius-md);
      padding: 3px; margin-top: 8px; user-select: none;
      box-shadow: inset 0 1px 2px rgba(16, 19, 26, 0.06);   /* recessed track */
    }
    [data-theme="dark"] .seg-control { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3); }
    .seg-control .seg-thumb {
      position: absolute; top: 3px; left: 3px;
      width: calc(50% - 3px); height: calc(100% - 6px);
      background: var(--seg-thumb); border-radius: calc(var(--radius-md) - 2px);
      box-shadow: 0 1px 2px rgba(16, 19, 26, 0.12), 0 0 0 1px var(--border-strong);
      transition: transform var(--dur-slow) var(--ease-out);
    }
    [data-theme="dark"] .seg-control .seg-thumb {
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    .seg-control .seg-opt {
      position: relative; z-index: 1; appearance: none; background: transparent;
      border: 0; font: inherit; font-size: 12px; padding: 0 4px; height: 26px;
      color: var(--text-muted); cursor: pointer;
      border-radius: calc(var(--radius-md) - 2px); transition: color var(--dur-base);
    }
    .seg-control .seg-opt.is-on { color: var(--text-strong); font-weight: 600; }
    .seg-control .seg-opt:hover:not(.is-on) { color: var(--text); }
    /* Flyout variant: full-width to match the find box above it, and a MORE VISIBLE
       track — the sidebar's light --seg-track melted into the refracted glass (user:
       コントラスト低くて溶けてる). --surface-3 + a hairline reads as a recessed control
       on glass, matching the find input's treatment. */
    .seg-control--qf { margin: 6px 4px 2px; }
    .seg-control--qf .seg-opt { padding: 3px 4px; font-size: 11px; }
    .qf-pop .seg-control--qf { background: var(--surface-3); border: 1px solid var(--border-strong); }
    .qf-pop .seg-control--qf .seg-thumb { background: var(--seg-thumb); }
    @media (prefers-reduced-motion: reduce) { .seg-control .seg-thumb { transition: none; } }
    /* バックアップ設定のラジオ/チェック行 */
    .radio-line { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 4px 0; cursor: pointer; flex-wrap: wrap; }
    .radio-line input { cursor: pointer; }
    select {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; background: var(--surface); outline: none; cursor: pointer;
    }
    /* Custom dropdown: native select hidden (value source), field-styled
       trigger + a glass option list reusing .fold-menu (matches the flyouts;
       native select popups are OS-drawn and can't be glassed). */
    select.cs-host { display: none !important; }
    .cs-btn {
      width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      height: 32px; background: var(--field-bg); border: 1px solid var(--border-strong); border-radius: var(--radius-md);
      padding: 0 12px; font-size: 12.5px; color: var(--text); cursor: pointer; text-align: left;
      box-shadow: inset 0 1px 2px rgba(16, 19, 26, 0.05);
      transition: border-color .12s, background .12s;
    }
    [data-theme="dark"] .cs-btn { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3); }
    .cs-btn:hover { border-color: var(--text-muted); background: var(--hover); }
    .cs-btn .cs-arrow { /* color/display/flex-shrink from shared .sb-row-arrow rule */ }
    .cs-pop { min-width: 160px; }
    .cs-pop .fm-row.cs-on { color: var(--accent-subtle-fg); font-weight: 600; }
    .post-count {
      font-size: 12px; color: var(--text-subtle);
    }

    /* --- Chip buttons --- */
    .chip {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 4px 14px; font-size: 13px; color: var(--text);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent-text); }
    .date-input {
      padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; color: var(--text); outline: none; cursor: pointer;
    }
    .date-input:focus { border-color: var(--accent); }

    /* --- Selection bar (pinned at the sidebar top while ≥1 card is selected) --- */
    .selection-bar {
      /* 2-col grid (was a 6-tall vertical stack of full-width buttons = tall/heavy,
         user). The count spans the top row; the 6 actions pack into 3 rows of 2 →
         ~half the height. Buttons stay rectangular (操作=四角ボタン規約は維持). */
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      margin-bottom: 10px; padding: 8px 10px;
      background: var(--accent-subtle); border: 1px solid var(--accent-border);
      border-radius: 10px;
    }
    .selection-bar .post-count { grid-column: 1 / -1; color: var(--text); font-weight: 600; }
    /* compact fill for the narrow half-width cells (scoped — leaves dialog buttons untouched) */
    .selection-bar .btn-outline, .selection-bar .btn-danger { padding: 5px 8px; font-size: 12px; text-align: center; }

    /* --- Sidebar control readability: in dark mode the sidebar bg (--sidebar-bg)
       is LIGHTER than --surface, so surface-colored controls look sunken/dark.
       Raise them to --surface-3 + --border-strong (same fix as the sb-chips). --- */
    /* Inputs (search/select/date/number): RECESSED fill + visible hairline —
       a field must read as a well you can type into. (First pass used
       border-subtle on surface-3 and the fields sank into the background —
       user report. Borders remain an input-only affordance.) */
    #sidebar .chip:not(.active), #sidebar select, #sidebar .search-box,
    #sidebar .date-input, #sidebar input[type="number"] {
      background: var(--field-bg); border-color: var(--border-strong); color: var(--text);
    }
    /* icon buttons (history ←→ etc.): ghost — bare glyph, fill on hover */
    #sidebar .icon-btn { background: transparent; border-color: transparent; color: var(--text-muted); }
    #sidebar .chip:not(.active):hover { background: var(--active); color: var(--text-strong); }
    /* Segmented control hover: brighten the GLYPH only — the track background
       stays put (the raised thumb is the only fill that moves). */
    #sidebar .view-toggle button:not(.active):hover { background: transparent; color: var(--text); }
    #sidebar .icon-btn:hover { background: var(--hover); color: var(--text); }
    /* Back-to-top: glass-chrome (icon-only, floats above content). NB `#sidebar
       .icon-btn` (1,1,0) outweighs a bare `#sbTop` (1,0,0) and was forcing the
       ghost transparent fill (+ transparent border) → the button was invisible on
       the light sidebar (user). Qualify with #sidebar so the chrome fill wins. */
    #sidebar #sbTop {
      background: var(--chrome-glass-bg); color: #fff;
      border: 1px solid var(--chrome-glass-rim);
      backdrop-filter: var(--chrome-glass-blur); -webkit-backdrop-filter: var(--chrome-glass-blur);
      box-shadow: var(--shadow-md);
    }
    #sidebar #sbTop:hover { background: rgba(20,22,26,0.6); color: #fff; }
    #sidebar .search-box:focus, #sidebar .date-input:focus, #sidebar input[type="number"]:focus { border-color: var(--accent); }
    /* Sidebar controls run slimmer than the dialog defaults: the column is a
       dense list, so tall bars waste vertical room (vertical padding only —
       the 12px side padding carries the 23px text axis). */
    #sidebar select { padding-top: 5px; padding-bottom: 5px; transition: border-color .12s, background .12s; }
    #sidebar select:hover { background: var(--hover); border-color: var(--text-muted); }
    /* 12.5px = same as the sibling .cs-btn (at 14px the 13-glyph JP placeholder
       "テキスト・ユーザー名で検索" overran the ~178px field and clipped). */
    #sidebar .search-box { font-size: 12.5px; }
    /* Two axes, both derived from the gutter: section HEADERS sit at the gutter
       (box edge); all CONTENT (filter-row icons, bar text, chips) sits one
       content-pad (12px) inside it — so headers read as one step out, content
       one step in. No magic per-element numbers. */
    #sidebar .sb-chips { padding-left: 12px; }
    .clip-row-wrap { position: relative; }
    /* Clip count: same plain-number treatment as the filter badges, parked at
       the right edge (where the × clear button takes over on hover). */
    #clipBadge.sb-row-badge {
      display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      color: var(--text); font-size: 11px; font-weight: 600;
      font-variant-numeric: tabular-nums; transition: opacity .12s;
    }
    #clipBadge.sb-row-badge.on { display: inline-block; }
    /* Active clip filter: accent INK on the icon only — no fill (motion-study
       canvas 2026-07-05; the grey slab read as a heavier state than it is).
       Hover keeps the plain .sb-row treatment. */
    .clip-row.active .sb-row-ic, .multi-row.active .sb-row-ic { color: var(--accent-text); }
    .clip-clear-btn {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; padding: 3px; border-radius: 4px;
      cursor: pointer; color: var(--text-muted);
      display: flex; align-items: center;
      opacity: 0; transition: opacity .12s;
    }
    .clip-row-wrap:hover .clip-clear-btn { opacity: 1; }
    .clip-row-wrap:hover .sb-row-badge { opacity: 0; }
    .clip-clear-btn:hover { color: var(--text); }
    /* checkbox rows: the BOX aligns with the control edge (same x as the pill
       chips above), like any other control in the column */
    .engagement-select {
      padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; color: var(--text); background: var(--surface); outline: none; cursor: pointer;
    }
    .engagement-input {
      width: 80px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; color: var(--text); outline: none;
    }
    .engagement-input:focus { border-color: var(--accent); }

    /* --- View toggle --- */
    /* Segmented control = recessed track + raised thumb (macOS/iOS style).
       Icon-only: the raised thumb is the ONLY active cue — no label, no glyph
       fill, no color shift — so switching just slides the thumb and the buttons
       never resize or shove each other. */
    .view-toggle {
      display: flex; border: none; border-radius: 8px;
      background: var(--seg-track); padding: 3px; gap: 2px;   /* 26px buttons + 6 = 32px */
      box-shadow: inset 0 1px 2px rgba(16, 19, 26, 0.06);      /* recessed track */
    }
    [data-theme="dark"] .view-toggle { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3); }
    .view-toggle button {
      flex: 1; display: flex; align-items: center; justify-content: center;
      height: 26px; box-sizing: border-box; padding: 0;
      background: transparent; border: none; border-radius: 6px;
      cursor: pointer; color: var(--text-muted); line-height: 0;
      transition: background .15s, color .15s;
    }
    /* Glyph stays outlined in every state; the thumb behind it marks the active one. */
    .view-toggle .vt-ico { width: 15px; height: 15px; display: block; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .view-toggle .vt-label { display: none; }
    /* Active = a single FLAT thumb (.vt-thumb, a real element) that SLIDES between
       segments (macOS segmented-control motion). The thumb is the BUTTON/chip, not
       the track. JS sets its inline width/transform from the active button's
       measured geometry (a ::before with var() didn't resolve % translate / inherited
       props reliably). Flat white on a recessed track — the liquid-glass thumb was
       retired with the control unification (motion-study canvas 2026-07-05):
       same material as .seg-thumb so every segmented control reads as one family. */
    .view-toggle { position: relative; }
    .vt-thumb {
      position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; pointer-events: none;
      width: calc((100% - 10px) / 3);   /* card fallback before JS measures left/width */
      border-radius: 6px;
      transition: left .22s var(--ease-out), width .22s var(--ease-out);
      background: var(--seg-thumb);
      box-shadow: 0 1px 2px rgba(16, 19, 26, 0.12), 0 0 0 1px var(--border-strong);
    }
    /* No dome highlight — flat in both themes (the ::before convex cue is retired). */
    .vt-thumb::before { display: none; }
    [data-theme="dark"] .vt-thumb {
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    /* Flat slide — no jelly bulge (the mid-travel scale pulse read as the thumb puffing up). */
    @media (prefers-reduced-motion: reduce) { .vt-thumb { transition: none; } }
    .view-toggle button { position: relative; z-index: 1; }
    /* Active glyph: light uses a soft grey (the glass thumb IS the active cue, so the
       icon needn't go near-black); dark keeps bright ink to read on the dark thumb. */
    .view-toggle button.active { color: var(--text); }
    [data-theme="dark"] .view-toggle button.active { color: var(--text-strong); }

    /* Browse-mode toggle (ライブラリ / 投稿者 / コレクション): reuses .view-toggle visuals
       verbatim — glyph-only in EVERY state (the active-label idiom was retired
       2026-07-04: text on the active segment made the thumb width jump per mode and
       read as a different control from the layout toggle). Segments name themselves
       via the instant .ui-tip tooltips; the glass thumb marks the active one. */
    /* Lives at the sidebar top (.browse-bar-section = a .sb-section). */
    .browse-bar-section { margin-bottom: 16px; }

    /* Poster grid — auto-fill cards (角丸四角=押すと開く). avatar + 投稿者名 +
       @ユーザー名 + プラットフォーム + 投稿数. Click=インスペクタ / dblclick=投稿一覧. */
    /* Container-level layout (auto-fill grid / flex stack) is dead in the
       virtualized grid — masonic positions cells absolutely inside its host.
       The density classes stay purely for descendant (cell) styling. */
    .poster-grid { display: block; }
    /* Card density (default): a vertical card LED BY THE AVATAR IMAGE (アイコンを画像
       部分に＝ライブラリのカードと同じ構造). Library colors (surface + subtle border +
       shadow) so it has the same contrast as post cards, not the flatter --surface-2. */
    .poster-card {
      position: relative;
      display: flex; flex-direction: column; min-width: 0; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 10px;
      box-shadow: var(--shadow-sm); cursor: pointer;
      transition: box-shadow var(--dur-hover) var(--ease-out), border-color var(--dur-hover), transform var(--dur-hover) var(--ease-out);
    }
    .poster-card:hover { box-shadow: var(--shadow-md); border-color: var(--border); transform: translateY(-3px) scale(1.014); z-index: 1; }
    /* backwards (not both): a forwards fill pins transform:none and kills :hover scale
       (see the .post-grid.anim-in note for the full reasoning). Staggered like posts. */
    .poster-grid.anim-in .poster-card {
      animation: hologramCardIn var(--dur-entrance) var(--ease-out) backwards;
      animation-delay: calc(min(var(--card-i, 0), 15) * var(--stagger));
    }
    .poster-card.inspected { border-color: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent-soft); }
    .poster-av {
      width: 100%; aspect-ratio: 1; flex: none; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-3);
      container-type: inline-size; /* the monogram sizes off this frame, which the density slider drives */
    }
    .poster-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Avatar-less posters wear the standard circular monogram (the GitHub / Google
       fallback-avatar idiom): a small initial on a pale, hue-hashed disc — a grid of them
       reads as cards, where the old card-filling letter read as a wall of glyphs. The hue
       (--mono-h, hashed per poster in poster-grid-builder.ts) is the ONLY thing that
       varies; each theme pins its own saturation/lightness so the tint stays pale in
       light and stays muted in dark. */
    .poster-mono {
      width: 44cqw; height: 44cqw; flex: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 19cqw; line-height: 1;
      background: hsl(var(--mono-h, 220) 52% 88%); color: hsl(var(--mono-h, 220) 42% 32%);
    }
    [data-theme="dark"] .poster-mono { background: hsl(var(--mono-h, 220) 26% 27%); color: hsl(var(--mono-h, 220) 50% 78%); }
    .poster-meta { min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 9px 11px 10px; }
    .poster-name { font-weight: 600; font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .poster-handle { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .poster-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; min-width: 0; }
    .poster-foot .pf-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); white-space: nowrap; }
    .poster-count { font-size: 11px; color: var(--text-subtle); white-space: nowrap; }
    /* Hover actions float over the avatar (top-right) — dark glass so they read on any
       avatar (card + tile). Mirror the library card: 🏷 tag → 🔖 collection → ℹ info
       (L→R). List overrides them to plain ghost buttons over the row. */
    .poster-info, .poster-tag {
      position: absolute; top: 8px; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border: none; border-radius: 50%; cursor: pointer; padding: 0; opacity: 0;
      background: rgba(0,0,0,.34); color: #fff;
      transition: opacity .15s, background .15s, color .15s, transform .15s;
    }
    .poster-info { right: 8px; }
    .poster-tag { right: 38px; }
    .poster-card:hover .poster-info, .poster-info:focus-visible,
    .poster-card:hover .poster-tag, .poster-tag:focus-visible { opacity: 1; }
    .poster-info:hover, .poster-tag:hover { background: rgba(0,0,0,.5); transform: scale(1.1); }
    .poster-info svg, .poster-tag svg { width: 16px; height: 16px; display: block; }
    /* Tile density: same avatar-led square but meta OVERLAID (compact, no card chrome). */
    .poster-grid.tile-view .poster-card { border-radius: 12px; }
    .poster-grid.tile-view .poster-meta { position: absolute; left: 0; right: 0; bottom: 0; gap: 1px; padding: 18px 10px 8px; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0)); pointer-events: none; }
    .poster-grid.tile-view .poster-name { color: #fff; font-size: 12px; }
    .poster-grid.tile-view .poster-handle { display: none; }
    .poster-grid.tile-view .poster-foot { margin-top: 1px; }
    .poster-grid.tile-view .poster-foot .pf-tag, .poster-grid.tile-view .poster-count { color: rgba(255,255,255,.82); }
    /* List density: full-width compact rows — small circular avatar + inline meta,
       library colors, ghost info/ws/tag (over the row, not an image). */
    .poster-grid.list-view .poster-card { flex-direction: row; align-items: center; gap: 10px; padding: 7px 38px 7px 10px; border-radius: 8px; box-shadow: none; }
    /* List rows lift like cards via the shared .poster-card:hover (scale + shadow +
       z-index). Base list rows have box-shadow:none, so the hover shadow-md from that
       rule provides the lift. (Earlier the avatar zoomed in-frame instead.) */
    .poster-grid.list-view .poster-av { width: 36px; height: 36px; aspect-ratio: auto; border-radius: 50%; border: 1px solid var(--border-soft); }
    /* The row's frame is already a 36px disc, so the tint fills it instead of insetting a
       second circle (the fixed row height makes the frame's cqw scaling moot here). */
    .poster-grid.list-view .poster-mono { width: 100%; height: 100%; font-size: 15px; }
    .poster-grid.list-view .poster-meta { flex: 1; padding: 0; }
    .poster-grid.list-view .poster-info, .poster-grid.list-view .poster-tag { background: transparent; color: var(--text-subtle); }
    .poster-grid.list-view .poster-info:hover, .poster-grid.list-view .poster-tag:hover { background: var(--hover); color: var(--text); }
    #posterControls .poster-sort-title { margin-top: 0; }
    #posterFilterRows { margin-top: 22px; }
    /* Poster toggle row (no flyout): active = monotone contrast
       (DESIGN: アクティブはグレー面、色は機能的一点だけ). */
    .sb-row.poster-toggle-row.active { background: var(--accent-subtle); color: var(--text-strong); }
    .sb-row.poster-toggle-row.active .sb-row-ic { color: var(--text-strong); }
    /* Poster folders: sidebar list (text rows + hover, active = monotone contrast)
       + create input. Membership is assigned from the poster inspector (chips). */
    .pf-list { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
    .pf-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; cursor: pointer; color: var(--text); }
    .pf-row:hover { background: var(--hover); }
    /* Drag-reorder: dim the dragged row; a 2px accent edge marks the drop side. */
    .pf-row.pf-dragging { opacity: 0.45; }
    .pf-row.pf-drop-before { box-shadow: inset 0 2px 0 var(--accent); }
    .pf-row.pf-drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
    .pf-row.active { background: var(--accent-subtle); color: var(--text-strong); }
    .pf-row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
    .pf-row-n { font-size: 11px; color: var(--text-muted); }
    .pf-row-del { display: none; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px; border-radius: 5px; line-height: 0; }
    .pf-row:hover .pf-row-del, .pf-row:focus-within .pf-row-del { display: inline-flex; }
    .pf-row-del:hover { color: var(--danger); background: var(--hover); }
    .pf-new { display: flex; gap: 6px; margin-top: 8px; }
    .pf-new-input { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--field-bg); color: var(--text); font-size: 12.5px; }
    .pf-new-btn { flex: none; }
    /* Poster-mode sidebar controls: only while browsing posters. */
    #posterControls, #posterViewSection { display: none; }
    body.browse-posters #posterControls, body.browse-posters #posterViewSection { display: block; }
    /* Mode visibility: the body class is the single source of truth (an inline
       display set by renderPosts, or .poster-grid's display:grid, would otherwise
       beat the [hidden] attribute — so use !important here). */
    body.browse-posters #postGrid { display: none !important; }
    body:not(.browse-posters) #posterGrid { display: none !important; }
    /* Poster mode hides the post-only chrome (filters + active bar). Sort and density
       moved to the display popover, which is mode-aware in React. */
    body.browse-posters #postActiveBar,
    body.browse-posters #filterRows { display: none !important; }
    /* The poster query bar mirrors #postActiveBar: only shown while browsing posters. */
    body:not(.browse-posters) #posterActiveBar { display: none !important; }

    /* --- Post grid --- */
    .post-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-size, 280px), 1fr));
      gap: 16px;
      view-transition-name: post-grid;
    }
    /* Masonry (card view only): the virtualized grid island (masonic) measures
       each card to pack Eagle-style waterfall columns — content-visibility must
       be ON (visible) so offscreen-but-mounted cards report real heights, and
       width:100% fills the island's positioned cell wrapper. (The old JS
       .mcols/.mcol column DOM is gone.) */
    .post-grid.masonry { display: block; }
    .post-grid.masonry .post-card { content-visibility: visible; contain-intrinsic-size: auto; width: 100%; }
    .post-card {
      background: var(--surface); border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm);
      cursor: pointer; transition: box-shadow var(--dur-hover) var(--ease-out), border-color var(--dur-hover), transform var(--dur-hover) var(--ease-out);
      position: relative;
      /* Skip rendering offscreen cards (huge win for thousands of items, like
         the image grid). The intrinsic size is the per-density height estimate. */
      content-visibility: auto; contain-intrinsic-size: auto 360px;
      /* Prevent scroll anchoring from adjusting viewport when content-visibility
         re-renders offscreen cards on scroll-back — causes the "hitch" sensation. */
      overflow-anchor: none;
    }
    /* Hidden SMOKE capture window: force cards to paint (nothing is ever "on-screen"
       there, so content-visibility:auto would skip them all) AND skip the entrance
       animation — hologramCardIn starts at opacity:0 with fill `both`, and the hidden
       window doesn't advance the animation, so cards stayed invisible despite being
       laid out with loaded images. Gated on the class so the normal app is untouched. */
    html.smoke-capture .post-card { content-visibility: visible; }
    html.smoke-capture .post-grid .post-card,
    html.smoke-capture .empty-state { animation: none !important; opacity: 1 !important; transform: none !important; }
    /* Hover lift: deeper shadow + a rise-and-slight-grow reads as "picked up"
       (Pinterest/gallery idiom; values from the motion-study canvas 2026-07-05).
       All layouts incl. list rows — the whole row lifts as one element; z-index
       raises it above neighbors so the grow isn't clipped.
       Transform origin is the center; off under prefers-reduced-motion. */
    .post-card:hover { box-shadow: var(--shadow-md); border-color: var(--border); transform: translateY(-3px) scale(1.014); z-index: 1; }
    /* Slow thumbnail zoom under the lift (clipped by the card / thumb box). */
    .card-thumb .card-img { transition: transform .5s var(--ease-out); }
    .post-card:hover .card-thumb .card-img { transform: scale(1.055); }
    @media (prefers-reduced-motion: reduce) {
      .post-card:hover, .poster-card:hover { transform: none; }
      .post-card:hover .card-thumb .card-img { transform: none; }
    }
    .post-card img {
      width: 100%; display: block;
      max-height: 300px; object-fit: cover; cursor: zoom-in;
    }
    .post-meta {
      padding: 12px;
    }
    /* Meta line 1: brand dot + name (strong) + handle (subtle, ellipsis).
       The old solid platform badge was the loudest element on the card while
       carrying the least information (Reeder/Ivory keep source markers quiet —
       the dot's brand color + tooltip identify the platform). */
    .post-meta .user {
      font-weight: 600; font-size: 13px;
      margin-bottom: 4px; min-width: 0;
      display: flex; align-items: center; gap: 6px;
    }
    .post-meta .user .uname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-meta .user .handle {
      color: var(--text-subtle); font-weight: 400; font-size: 11px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
    }
    /* Source badge: platform marker pinned to the thumbnail's bottom-left
       (Instagram/Pinterest style). .card-thumb wraps the image as the anchor;
       in tile/list it collapses (display:contents) so the badge falls back to
       the card box, which there coincides with the image edge. */
    .card-thumb { position: relative; display: block; line-height: 0; }
    .post-grid.tile-view .card-thumb, .post-grid.list-view .card-thumb { display: contents; }

    /* --- Stacked cards: a multi-image group = the CARD itself duplicated -----
       Inner-deck at REST + fan-out on HOVER (motion-study 2026-07-05; replaces
       the outward-rotation-only peek). The old peek rotated the sheets out past
       the card edge, so its whole visibility budget was the layout's gutter
       (~8px) and it shrank to nothing as the tile shrank — the exact wall the
       user hit. New model, two states:

       REST — the multi-ness is drawn INSIDE the card's own footprint. The front
       face (thumb/meta) is pushed down by --deck (padding-top); the sheets fill
       the PADDING box (inset:0), so their tops already sit --deck above the inset
       front face and never cross the border box. Only that fixed --deck-tall band
       peeks. s1 (always present — it's the 2nd image, so the ONLY back sheet on a
       ×2 group) is the BACKMOST layer and fills the band from the very top, so a
       ×2 reads as a clear single step with no empty strip; s2 (the 3rd image, only
       on ×3+) steps in front of it. Zero gutter is consumed (non-stacked cards,
       the majority, pay nothing) and the peek is a constant pixel height that
       survives any tile size.

       HOVER — no stack-specific effect (user 2026-07-05: the sheet motion felt
       unnecessary). The card lifts as any card does and the whole deck rides up
       with it; the sheets themselves don't move. Geometry is per-layout via the
       --s1/--s2 (rest) custom props. ×N badge stays as the precise count. */
    .post-card.grouped {
      background: transparent;   /* the deck band shows the sheets behind */
      border-color: transparent; /* the front-face edge is drawn by ::before */
      box-shadow: none;          /* the sheets + ::before carry every shadow */
      padding-top: var(--deck, 9px);  /* pushes the front face down = the deck */
      content-visibility: visible;    /* cv:auto's implicit paint containment
         would clip the fanned sheets to the card box; cheap to drop since the
         virtualized grid unmounts offscreen cells anyway. */
    }
    .post-card .stack-sheet {
      position: absolute; inset: 0;   /* fill the PADDING box — the card's padding-top
         IS the deck, so the sheet's top already peeks --deck above the inset front
         face and never crosses the border box (zero gutter, no outward peek) */
      overflow: hidden; transform-origin: top center;
      background: var(--surface); border: 1px solid var(--border-strong);   /* strong, not hairline: a white sheet edge on a near-white bg/front needs a real line */
      border-radius: 8px; box-shadow: var(--shadow-md);   /* md, not sm: white sheets carrying white-ish images need the shadow to read at all */
    }
    /* Depth dim: back sheets tint their IMAGE toward --text (dark in light theme,
       light in dark) so the stepped deck reads as distinct layers even when every
       thumbnail is near-white manga line-art. Scoped to the image (NOT the whole
       sheet) so list's white sheet-body doesn't peek as a gray band across the
       row top — only the thumbnail sliver dims. s1 is backmost so it's the dimmer. */
    .stack-sheet .stack-sheet-img::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      pointer-events: none; background: var(--stack-dim, transparent);
    }
    .post-card.grouped .stack-s1 { z-index: -2; transform: var(--s1); --stack-dim: color-mix(in srgb, var(--text) 15%, transparent); }
    .post-card.grouped .stack-s2 { z-index: -1; transform: var(--s2); --stack-dim: color-mix(in srgb, var(--text) 8%, transparent); }
    /* Chrome sits on the FRONT face, not in the deck band: push the ×N badge
       (always-on for grouped) and the ○ select ring down by --deck. */
    .post-grid:not(.tile-view) .post-card.grouped .card-ntag { top: calc(8px + var(--deck)); }
    .post-grid.tile-view .post-card.grouped .card-ntag { top: calc(6px + var(--deck)); }
    .post-card.grouped .select-check { top: calc(8px + var(--deck)); }
    /* Front-face edge re-cast ABOVE the negative-z sheets (the card's own
       box-shadow paints UNDER them — CSS paint order). Rings the INSET front
       face only (top at --deck) so it reads as sitting ON the pile; deepens on
       hover for the lift. z-index:0 keeps it under the positioned content. */
    .post-card.grouped::before {
      content: ''; position: absolute; top: var(--deck, 9px);
      left: -1px; right: -1px; bottom: -1px; z-index: 0;
      border-radius: inherit; pointer-events: none;
      box-shadow: 0 0 0 1px var(--border-strong), 0 2px 8px rgba(16, 19, 26, 0.18);
      transition: box-shadow var(--dur-hover) var(--ease-out);
    }
    .post-card.grouped:hover::before { box-shadow: 0 0 0 1px var(--border-strong), 0 8px 20px rgba(16, 19, 26, 0.24); }
    [data-theme="dark"] .post-card.grouped::before { box-shadow: 0 0 0 1px var(--border-strong), 0 2px 8px rgba(0, 0, 0, 0.55); }
    [data-theme="dark"] .post-card.grouped:hover::before { box-shadow: 0 0 0 1px var(--border-strong), 0 8px 20px rgba(0, 0, 0, 0.6); }
    /* Card view: sheet top ~56% = thumbnail area (mirrors the card anatomy —
       image on top, meta panel below). */
    .stack-sheet .stack-sheet-img {
      position: absolute; inset: 0 0 44% 0;
      background-size: cover; background-position: center top;
      border-radius: 8px 8px 0 0;
    }
    /* ---- card view (masonry) ---- */
    .post-grid.masonry .post-card.grouped {
      overflow: visible; z-index: 0; --deck: 15px;
      --s1: scale(0.93);                     /* backmost: fills the band from the top */
      --s2: translateY(7px) scale(0.965);    /* middle: steps down toward the face */
    }
    .post-grid.masonry .post-card.grouped:hover { z-index: 1; box-shadow: none; }   /* beat the generic hover md; ::before carries the lift */
    /* The card is overflow:visible now — the thumb re-clips the hover img zoom. */
    .post-grid.masonry .post-card.grouped .card-thumb { overflow: hidden; border-radius: 8px 8px 0 0; }
    .post-grid.masonry .post-card.grouped .post-meta { position: relative; background: var(--surface); border-radius: 0 0 8px 8px; }
    /* ---- tile: square image-only cells → full-bleed sheet thumbs (no meta
       split). Same inner-deck; the front thumb regains a clip box for the hover
       img zoom now that the card is overflow:visible. ---- */
    .post-grid.tile-view .post-card.grouped {
      overflow: visible; z-index: 0; --deck: 13px;
      --s1: scale(0.92);                     /* backmost: fills the band from the top */
      --s2: translateY(6px) scale(0.955);    /* middle: steps down */
    }
    .post-grid.tile-view .post-card.grouped:hover { z-index: 1; box-shadow: none; }
    /* the front thumb is ABSOLUTE (fills the padding box), so padding-top can't
       push it — inset its top by --deck explicitly to open the deck band. */
    .post-grid.tile-view .post-card.grouped .card-thumb {
      display: block; position: absolute; inset: var(--deck) 0 0 0; overflow: hidden;
      border-radius: 8px; line-height: 0;
    }
    .post-grid.tile-view .stack-sheet .stack-sheet-img { inset: 0; border-radius: 8px; }
    /* ---- list: the WHOLE ROW is the stacked object. The deck peeks along the
       row's top edge; the sheet mirrors the row anatomy (thumb-wide image left,
       white body — only the image dims, so no gray band crosses the row top). A
       row is a wide, short lever, so the rest taper uses scaleX≈1 with a real
       scaleY to keep the bottom inside. ---- */
    .post-grid.list-view .post-card.grouped {
      overflow: visible; z-index: 0; --deck: 10px;
      --s1: scale(0.997, 0.8);               /* backmost: fills the band top (scaleY keeps the bottom inside) */
      --s2: translateY(5px) scale(0.999, 0.9); /* middle: steps down */
    }
    .post-grid.list-view .post-card.grouped:hover { z-index: 1; box-shadow: none; }
    .post-grid.list-view .post-card.grouped .card-thumb {
      display: block; position: relative; line-height: 0;
      flex: 0 0 var(--list-thumb, 88px); width: var(--list-thumb, 88px);
      align-self: stretch; overflow: hidden; border-radius: 6px 0 0 6px;
    }
    .post-grid.list-view .post-card.grouped .card-thumb .card-img {
      width: 100%; min-width: 0; height: 100%; max-height: none; object-fit: cover;
    }
    .post-grid.list-view .stack-sheet { border-radius: 6px; }
    .post-grid.list-view .stack-sheet .stack-sheet-img {
      inset: 0 auto 0 0; width: var(--list-thumb, 88px); border-radius: 6px 0 0 6px;
    }
    /* .pf-dot is used by the poster grid's inline pf-tag (the thumbnail badge
       itself was removed — #109 follow-up: no platform chrome on artwork). */
    .pf-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .pf-dot.x { background: var(--brand-x); }
    .pf-dot.bluesky { background: var(--brand-bluesky); }
    .pf-dot.misskey { background: var(--brand-misskey); }
    .pf-dot.mastodon { background: var(--brand-mastodon); }
    .pf-dot.pixiv { background: var(--brand-pixiv); }
    .post-meta .text {
      font-size: 13px; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 6px; cursor: pointer;
    }
    .post-meta .text.expanded {
      -webkit-line-clamp: unset; display: block;
    }
    .post-meta .text { position: relative; }
    .text-hint {
      position: absolute; bottom: 0; right: 0;
      font-size: 10px; color: var(--text-subtle);
      background: color-mix(in oklch, var(--surface) 88%, transparent); padding: 0 4px;
      border-radius: 3px; pointer-events: none;
      display: none;
    }
    .post-meta .text.truncated:hover .text-hint { display: block; }
    .post-meta .text.expanded .text-hint { display: none; }
    /* Footer line: nonzero engagement (monotone glyphs) + ONE compact date,
       both quiet — a single line where two full timestamp rows used to sit. */
    .post-foot { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .post-meta .stats {
      display: flex; gap: 10px; font-size: 11.5px; color: var(--text-subtle);
    }
    .post-meta .stats .st { display: inline-flex; align-items: center; gap: 3px; }
    /* Engagement counts / capture date are library noise at rest — show them only
       while a sort or filter makes them relevant (.show-eng / .show-cap on the
       grid, same gate the tile ♡ overlay already uses). */
    .post-grid:not(.show-eng) .post-meta .stats { display: none; }
    .post-grid:not(.show-cap) .post-foot .cdate { display: none; }
    /* footer right corner: post date (primary) + 📷 capture date (secondary) */
    .post-foot .foot-r { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
    .post-foot .pdate { font-size: 11px; color: var(--text-subtle); white-space: nowrap; }
    .post-foot .cdate { font-size: 11px; color: var(--text-subtle); opacity: .82; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
    .post-foot .cdate .cdate-ic { flex-shrink: 0; }
    /* Card view: pin the footer (date + pf-tag source corner) to the card bottom.
       Cards in a grid row stretch to equal height, so a short-text card left its
       footer floating mid-card with empty space below — pf-tag landed at a
       different height in every card (ユーザー指摘). flex-column + margin-top:auto
       drops the footer to the bottom edge so it lines up across the row. Scoped to
       card view: tile hides .post-meta, list re-lays it as a row. */
    .post-grid:not(.tile-view):not(.list-view) .post-card { display: flex; flex-direction: column; }
    .post-grid:not(.tile-view):not(.list-view) .post-meta { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .post-grid:not(.tile-view):not(.list-view) .post-foot { margin-top: auto; }

    /* Selection ring as an overlay (::after) so it paints ABOVE the positioned
       .card-thumb. An `outline` on the card was painted under the thumb, so it
       looked thinner over the thumbnail than over the meta (user report). */
    .post-card.selected::after {
      content: ''; position: absolute; inset: 0; z-index: 6;
      border: 3px solid var(--accent-soft); border-radius: 8px; pointer-events: none;
    }
    /* ○ select ring — the ONLY selection entry point. A hollow white ring with a
       soft dark halo (visible on any image), top-left, shown on hover; fills with
       the accent + ✓ once selected (selected cards keep it shown). */
    .post-card .select-check {
      position: absolute; top: 8px; left: 8px;
      width: 22px; height: 22px; border-radius: 50%;
      background: transparent; border: 2px solid #fff;
      box-shadow: 0 0 2px 1px rgba(0,0,0,0.45);
      opacity: 0; transition: opacity .1s, background .1s;
      display: flex; cursor: pointer; z-index: 5;
      align-items: center; justify-content: center;
    }
    .post-card:hover .select-check { opacity: 1; }
    .post-card.selected .select-check { opacity: 1; background: var(--accent); border-color: #fff; }
    /* sharp geometric check drawn with borders (matches image-view; no ✓ glyph).
       Draws in with an overshoot on selection (hologramCheckDraw). */
    .post-card.selected .select-check::after {
      content: ''; width: 5px; height: 9px; margin-top: -1px;
      border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
      animation: hologramCheckDraw .3s var(--ease-out) backwards;
    }
    /* Selection mode (≥1 selected): clicking anywhere on a card toggles it, so
       every ring stays visible and the per-card hover actions step aside. */
    .post-grid.selecting .select-check { opacity: 1; }
    .post-grid.selecting .info-btn, .post-grid.selecting .clip-btn, .post-grid.selecting .tag-btn, .post-grid.selecting .act-pill { display: none; }
    .post-grid.selecting:not(.tile-view) .card-ntag { opacity: 0; }
    /* every click selects now — plain pointer everywhere (no zoom-in over images,
       no "click to expand" hint on the text) */
    .post-grid.selecting .post-card, .post-grid.selecting .post-card img { cursor: pointer; }
    /* inspector open: a click swaps the panel content, not zoom → plain pointer */
    .post-grid.insp-open .post-card img { cursor: pointer; }
    .post-grid.selecting .post-meta .text.truncated:hover .text-hint { display: none; }

    /* --- List view: text-first (scanning post text is the point of the list) --- */
    .post-grid.list-view {
      /* gap mirrors the masonic rowGutter (viewer.js). Kept at 14 for scanning
         rhythm; the grouped-row stack no longer needs clearance here — its rest
         deck stays inside the row footprint and the hover fan raises z-index so
         it paints above neighbors rather than parting them. */
      display: flex; flex-direction: column; gap: 14px;
      grid-template-columns: unset;
    }
    .post-grid.list-view .post-card {
      display: flex; flex-direction: row; border-radius: 6px;
      overflow: hidden; align-items: stretch;
      contain-intrinsic-size: auto 104px;
    }
    .post-grid.list-view .post-card img {
      width: var(--list-thumb, 88px); min-width: var(--list-thumb, 88px); align-self: stretch;
      height: auto; max-height: calc(var(--list-thumb, 88px) * 1.25); object-fit: cover;
    }
    .post-grid.list-view .post-meta {
      display: flex; flex-wrap: wrap; align-items: baseline;
      gap: 3px 10px; padding: 9px 14px; flex: 1; min-width: 0;
      /* keep the right gutter clear for the hover trio (ℹ@8 + ws@40 + tag@72,
         28px wide) so the right-aligned date never sits under them */
      padding-right: 104px;
    }
    /* text is the hero: full width, up to 2 lines, darker and a touch larger */
    .post-grid.list-view .post-meta .text {
      order: 0; flex-basis: 100%; width: 100%;
      -webkit-line-clamp: 2; margin-bottom: 2px;
      font-size: 14px; line-height: 1.45; color: var(--text-strong);
    }
    /* secondary line: user · stats · date, small and muted */
    .post-grid.list-view .post-meta .user {
      order: 1; margin-bottom: 0; white-space: nowrap;
      font-size: 12px; font-weight: 500; color: var(--text-muted);
    }
    .post-grid.list-view .post-meta .post-foot { order: 2; flex: 1; min-width: 0; margin-top: 0; }
    .post-grid.list-view .post-meta .stats { white-space: nowrap; font-size: 11px; }
    .post-grid.list-view .post-meta .pdate { white-space: nowrap; }
    .post-grid.list-view .post-meta .tags-label { display: none; }

    /* --- Tile density: a post-card with its info section hidden + a compact
       author/❤ overlay on the image. Purely presentational (reuses the card's
       buttons + select), so card⇄tile⇄list is just like grid/list. --- */
    .post-grid.tile-view {
      grid-template-columns: repeat(auto-fill, minmax(var(--tile-size, 180px), 1fr));
      gap: 8px;
    }
    .post-grid.tile-view .post-card { aspect-ratio: 1; border-color: var(--border); box-shadow: none; contain-intrinsic-size: auto var(--tile-size, 180px); }
    /* Tiles keep the same hover buttons as cards (🔖・ℹ・🏷 — everything else
       lives in the right-click menu), laid out horizontally top-right and scaled
       with the tile size so they never collide with the ○ ring. */
    /* round() keeps the buttons on whole pixels — a fractional size (e.g.
       180×0.13=23.4px) rounds width and height differently at fractional
       display scaling and the circles render as slight ellipses */
    .post-grid.tile-view { --act: round(nearest, clamp(18px, calc(var(--tile-size, 180px) * 0.13), 26px), 1px); }
    .post-grid.tile-view .info-btn, .post-grid.tile-view .clip-btn, .post-grid.tile-view .tag-btn {
      width: var(--act); height: var(--act); top: 6px; font-size: calc(var(--act) * 0.55);
    }
    /* Same relative order as card/list (🏷 → 🔖 → ℹ, left to right) */
    .post-grid.tile-view .info-btn { right: 6px; }
    .post-grid.tile-view .clip-btn { right: calc(6px + var(--act) + 4px); }
    .post-grid.tile-view .tag-btn { right: calc(6px + 2 * (var(--act) + 4px)); }
    .post-grid.tile-view .act-pill { width: var(--act); height: var(--act); top: 6px; right: 6px; }
    .post-grid.tile-view .post-card:has(.clip-btn:hover) .act-pill { right: calc(6px + var(--act) + 4px); }
    .post-grid.tile-view .post-card:has(.info-btn:hover) .act-pill { right: 6px; }
    .post-grid.tile-view .post-card:has(.tag-btn:hover) .act-pill { right: calc(6px + 2 * (var(--act) + 4px)); }
    .post-grid.tile-view .info-btn svg, .post-grid.tile-view .clip-btn svg, .post-grid.tile-view .tag-btn svg { width: 60%; height: 60%; }
    .post-grid.tile-view .post-card:hover { box-shadow: var(--shadow-md); }
    .post-grid.tile-view .card-img { width: 100%; height: 100%; max-height: none; object-fit: cover; }
    .post-grid.tile-view .post-meta { display: none; }
    .card-overlay, .card-ntag { display: none; }
    /* Card / list view: show the ×N image-count badge on the thumbnail's top-left
       (top-right is the hover action row; the selection check only appears when
       selected, so it takes the corner then). */
    .post-grid:not(.tile-view) .card-ntag {
      display: block; position: absolute; top: 8px; left: 8px; z-index: 1;
      padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600;
      background: rgba(0,0,0,0.72); color: #fff; transition: opacity .1s;
    }
    /* the ○ select ring shares the top-left corner: it takes over on hover */
    .post-grid:not(.tile-view) .post-card:hover .card-ntag { opacity: 0; }
    .post-card.selected .card-ntag { display: none; }
    .post-grid.tile-view .card-overlay {
      display: flex; align-items: flex-end; gap: 8px;
      position: absolute; left: 0; right: 0; bottom: 0; padding: 52px 8px 8px;
      background: var(--scrim-grad); color: #fff; font-size: 11px; pointer-events: none;
    }
    .post-grid.tile-view .card-overlay .ov-author { flex: 1; min-width: 0; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-grid.tile-view .card-overlay .ov-likes { flex-shrink: 0; }
    /* tile info overlay is optional (表示 > タイルに情報を表示) */
    .post-grid.tile-view.no-overlay .card-overlay { display: none; }
    /* the ❤ count on tiles only matters while sorting/filtering by engagement */
    .post-grid.tile-view .card-overlay .ov-likes { display: none; }
    .post-grid.tile-view.show-eng .card-overlay .ov-likes { display: block; }
    .post-grid.tile-view .card-ntag {
      display: block; position: absolute; top: 6px; right: 6px; z-index: 2;
      padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 600;
      background: rgba(0,0,0,0.8); color: #fff; transition: opacity .1s;
    }
    .post-grid.tile-view .post-card:hover .card-ntag { opacity: 0; }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-subtle);
    }
    .empty-state p { margin-bottom: 8px; }
    .empty-state kbd {
      display: inline-block; padding: 1px 7px; border: 1px solid var(--border-strong);
      border-bottom-width: 2px; border-radius: 4px; background: var(--surface);
      color: var(--text); font: 12px/1.6 var(--font-sans);
    }
    /* "What to do next" affordance — rounded square = action, per DESIGN.md */
    .empty-cta {
      margin-top: 12px; padding: 7px 18px; border-radius: 6px;
      border: 1px solid var(--border-strong); background: var(--surface);
      color: var(--text); font-size: 13px; cursor: pointer;
      transition: border-color .12s, color .12s, background .12s;
    }
    .empty-cta:hover { border-color: var(--accent); color: var(--accent-text); background: var(--hover); }

    /* --- Settings --- */
    .section {
      background: var(--surface); border-radius: 8px;
      padding: 16px 20px; margin-bottom: 16px;
      border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm);
    }
    .section h2 {
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 13px; color: var(--text); margin-bottom: 6px; }
    /* Generic dialog text input. :not(.search-box) — the attribute selector
       otherwise outweighs the unified .search-box field anatomy (r8/32px). */
    input[type="text"]:not(.search-box) {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; outline: none; transition: border-color 0.15s;
    }
    input[type="text"]:not(.search-box):focus { border-color: var(--accent); }
    .hint { font-size: 12px; color: var(--text-subtle); margin-top: 6px; }
    .actions { display: flex; align-items: center; margin-top: 16px; }

    /* --- Buttons --- */
    .btn {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 8px 20px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-outline {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 16px; font-size: 13px;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent-text); }
    .btn-danger {
      background: var(--surface); color: var(--danger); border: 1px solid var(--danger);
      border-radius: 6px; padding: 7px 16px; font-size: 13px;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-danger:hover { background: var(--danger-bg); }

    a { color: var(--accent-text); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* --- Data management --- */
    .data-section {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .data-hint {
      width: 100%; font-size: 12px; color: var(--text-subtle); margin-top: 8px;
    }
    .file-input-hidden { display: none; }

    /* --- Image lightbox --- */
    .lightbox-overlay {
      display: none; position: fixed; inset: 0;
      /* Quick Look-style: lighter dim + blur so the grid ghosts behind the
         image instead of vanishing — keeps spatial context, image still pops. */
      background: rgba(0,0,0,0.72); z-index: 11000;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      justify-content: center; align-items: center;
      cursor: zoom-out;
    }
    .lightbox-overlay.show { display: flex; }
    .lightbox-overlay img, .lightbox-overlay video {
      max-width: 95vw; max-height: 95vh; object-fit: contain;
      border-radius: 4px;
    }
    .card-video { display: flex; align-items: center; justify-content: center; min-height: 120px; background: var(--surface-2); color: var(--text-muted); font-size: 30px; cursor: pointer; }
    /* #143: the lightbox is a single-image peek — no prev/next nav or page counter
       (full gallery paging lives in the image view). */

    /* --- Image tab (type:'image') — fit-to-screen detail view --- */
    /* The active image tab swaps the browse chrome (query bar / sidebar / grid)
       for a single media stage; the inspector column (#postDetail) stays. */
    #imageTabView { display: none; }
    body.image-tab-active #posterActiveBar,
    body.image-tab-active #sidebar, body.image-tab-active #mode-post { display: none; }
    /* The activebar band itself STAYS under an image tab: the active tab's
       Chrome-style connected shape needs the band below it — hiding the whole
       bar left the strip looking clipped (every browser keeps its toolbar row
       on every tab). Only the nav pair remains (disabled — an image tab has no
       filter history, like a fresh browser tab); the grid-specific innards
       (funnel/title/chips/count/reset/ⓘ) don't apply here and hide instead.
       !important outranks the poster-mode hide when browse-posters is still
       set while an image tab shows. */
    body.image-tab-active #postActiveBar { display: flex !important; }
    body.image-tab-active #postActiveBar .qb-body,
    body.image-tab-active #postActiveBar .qb-trail { display: none; }
    body.image-tab-active #imageTabView { display: flex; flex: 1; min-width: 0; min-height: 0; }
